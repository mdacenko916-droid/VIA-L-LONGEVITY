<script>
const T = {"ru": {"page_title": "Научная база", "page_sub": "На чём стоит то, что вы читаете в разборе — и где проходят границы наших выводов.", "s1_t": "Что делает приложение", "s1_b": "VIA·L собирает в одну картину то, что уже измерил ваш трекер, и то, что вы отметили сами: сон, пульс покоя, вариабельность ритма, энергию, самочувствие. Дальше он показывает связи между этими сигналами обычными словами. Это велнес-инструмент для наблюдения за образом жизни: он не ставит диагнозов, не назначает лечение и не заменяет врача.", "s2_t": "Что трекер измеряет, а что — нет", "s2_b": "Трекер измеряет пульс и его вариабельность, длительность и структуру сна, кожную температуру, насыщение крови кислородом, движение. Он не измеряет гормоны, сахар крови, воспаление или запасы железа — таких датчиков в нём нет. Поэтому всё, что касается этих тем, приложение выводит только из ваших собственных отметок и подаёт как наблюдение, а не как замер.", "s3_t": "Личная база вместо чужих норм", "s3_b": "Вариабельность сердечного ритма и пульс покоя различаются между людьми в разы: цифра, нормальная для одного, у другого означает совсем другое. Поэтому мы сравниваем сегодняшний день не с популяционной таблицей, а с вашей собственной медианой за прошлые недели. Пока накопленных дней мало, приложение так и говорит: сравнивать пока не с чем.", "s4_t": "Один день ничего не доказывает", "s4_b": "Датчики шумят: сдвинулось кольцо или браслет, была холодная спальня, вы поздно поужинали — и цифра уехала. Особенно это касается кислорода крови и ночной температуры. Поэтому мы читаем направление за несколько дней, а не одно значение, и всегда говорим, когда данных мало для вывода.", "s5_t": "Как считается «Индекс дня»", "s5_b": "Индекс — это композит по вашим же данным, а не измерение чего-то в организме. Публикаций вида «прилив = минус пятнадцать баллов» не существует, поэтому мы намеренно держим веса сглаженными и ограничиваем вклад каждого блока. Основание простое: шкала с весами и шкала без весов дают практически одинаковый результат — прямое сравнение двух классических опросников менопаузы на 306 женщинах показало совпадение r = 0,91. Значит, гнаться за «точной» цифрой веса бессмысленно; ценность даёт динамика, а не абсолютное число.", "s6_t": "Цикл и показатели трекера", "s6_b": "Во второй половине цикла ночная температура закономерно выше, пульс покоя чуть выше, а вариабельность ритма ниже — это обычная физиология, а не ухудшение, и мы читаем её как контекст. Важная оговорка для 35+: с приближением менопаузы этот ритм сначала сглаживается, а потом исчезает — больше половины поздних перименопаузальных циклов проходят без овуляции, и календарные ярлыки фаз тогда теряют смысл. В таких случаях приложение опирается только на вашу личную базу и не применяет логику фаз.", "s7_t": "Давление, которое вы измерили сами", "s7_b": "Если вы вносите домашний замер, приложение описывает его по домашним ориентирам и связывает с тем, что видно в вашем дне — сном, пульсом покоя, нагрузкой. Одно измерение говорит мало: важно, как цифры держатся день ото дня. Когда они устойчиво выше ориентира, приложение прямо предлагает показать свои замеры врачу — и никогда не называет это болезнью и не советует лекарства.", "s8_t": "Почему мы не просим считать калории", "s8_b": "Ежедневный подсчёт калорий тяжело удержать, а ошибка оценки съеденного у большинства людей велика — считать точнее, чем ошибаешься, невозможно. Поэтому мы даём ориентир по составу тарелки и работаем с тем, что человек реально может повторять неделями: белок в каждый приём, овощи, движение после еды, режим сна.", "s9_t": "На какие области мы опираемся", "s9_b": "Сон и циркадные ритмы. Вариабельность сердечного ритма и вегетативная регуляция. Физиология стрессового ответа. Гормональные переходы среднего возраста — перименопауза, менопауза, андропауза. Питание и обмен. Силовая и аэробная нагрузка, включая возрастную потерю мышц. Домашние измерения давления. Мы читаем обзоры и мета-анализы в этих областях и переводим их в наблюдения о вашем дне — без протоколов лечения, без назначений и без обещаний результата.", "disc": "Материалы приложения носят информационный характер, не являются медицинским заключением и не заменяют консультацию врача. Приложение не предназначено для диагностики, лечения или профилактики заболеваний.", "nav_today": "Сегодня", "nav_approach": "Наш подход", "nav_guide": "Мой наставник", "nav_card": "Мой профиль"}, "uk": {"page_title": "Наукова база", "page_sub": "На чому стоїть те, що ви читаєте в розборі, — і де проходять межі наших висновків.", "s1_t": "Що робить застосунок", "s1_b": "VIA·L збирає в одну картину те, що вже виміряв ваш трекер, і те, що ви відмітили самі: сон, пульс спокою, варіабельність ритму, енергію, самопочуття. Далі він показує зв’язки між цими сигналами звичайними словами. Це велнес-інструмент для спостереження за способом життя: він не ставить діагнозів, не призначає лікування і не замінює лікаря.", "s2_t": "Що трекер вимірює, а що — ні", "s2_b": "Трекер вимірює пульс і його варіабельність, тривалість і структуру сну, шкірну температуру, насичення крові киснем, рух. Він не вимірює гормони, цукор крові, запалення чи запаси заліза — таких датчиків у ньому немає. Тому все, що стосується цих тем, застосунок виводить лише з ваших відміток і подає як спостереження, а не як вимір.", "s3_t": "Особиста база замість чужих норм", "s3_b": "Варіабельність серцевого ритму й пульс спокою різняться між людьми в рази: цифра, нормальна для одного, в іншого означає зовсім інше. Тому ми порівнюємо сьогоднішній день не з популяційною таблицею, а з вашою власною медіаною за минулі тижні. Поки днів накопичено мало, застосунок так і каже: порівнювати поки нема з чим.", "s4_t": "Один день нічого не доводить", "s4_b": "Датчики шумлять: зсунувся перстень чи браслет, була холодна спальня, ви пізно повечеряли — і цифра поїхала. Особливо це стосується кисню крові та нічної температури. Тому ми читаємо напрямок за кілька днів, а не одне значення, і завжди кажемо, коли даних мало для висновку.", "s5_t": "Як рахується «Індекс дня»", "s5_b": "Індекс — це композит за вашими ж даними, а не вимір чогось в організмі. Публікацій на кшталт «приплив = мінус п’ятнадцять балів» не існує, тому ми свідомо тримаємо ваги згладженими й обмежуємо внесок кожного блоку. Підстава проста: шкала з вагами і шкала без ваг дають практично однаковий результат — пряме порівняння двох класичних опитувальників менопаузи на 306 жінках показало збіг r = 0,91. Отже, гнатися за «точною» цифрою ваги немає сенсу; цінність дає динаміка, а не абсолютне число.", "s6_t": "Цикл і показники трекера", "s6_b": "У другій половині циклу нічна температура закономірно вища, пульс спокою трохи вищий, а варіабельність ритму нижча — це звичайна фізіологія, а не погіршення, і ми читаємо її як контекст. Важливе застереження для 35+: із наближенням менопаузи цей ритм спершу згладжується, а потім зникає — більше половини пізніх перименопаузальних циклів минають без овуляції, і календарні ярлики фаз тоді втрачають сенс. У таких випадках застосунок спирається лише на вашу особисту базу.", "s7_t": "Тиск, який ви виміряли самі", "s7_b": "Якщо ви вносите домашній замір, застосунок описує його за домашніми орієнтирами і пов’язує з тим, що видно у вашому дні — сном, пульсом спокою, навантаженням. Одне вимірювання говорить мало: важливо, як цифри тримаються день у день. Коли вони стійко вищі за орієнтир, застосунок прямо пропонує показати свої заміри лікарю — і ніколи не називає це хворобою й не радить ліки.", "s8_t": "Чому ми не просимо рахувати калорії", "s8_b": "Щоденний підрахунок калорій важко втримати, а похибка оцінки з’їденого у більшості людей велика — рахувати точніше, ніж помиляєшся, неможливо. Тому ми даємо орієнтир за складом тарілки і працюємо з тим, що людина реально може повторювати тижнями: білок у кожен прийом, овочі, рух після їжі, режим сну.", "s9_t": "На які галузі ми спираємось", "s9_b": "Сон і циркадні ритми. Варіабельність серцевого ритму й вегетативна регуляція. Фізіологія стресової відповіді. Гормональні переходи середнього віку — перименопауза, менопауза, андропауза. Харчування й обмін. Силове та аеробне навантаження, включно з віковою втратою м’язів. Домашні вимірювання тиску. Ми читаємо огляди й мета-аналізи в цих галузях і перекладаємо їх у спостереження про ваш день — без протоколів лікування, без призначень і без обіцянок результату.", "disc": "Матеріали застосунку мають інформаційний характер, не є медичним висновком і не замінюють консультацію лікаря. Застосунок не призначений для діагностики, лікування чи профілактики захворювань.", "nav_today": "Сьогодні", "nav_approach": "Наш підхід", "nav_guide": "Мій наставник", "nav_card": "Мій профіль"}, "en": {"page_title": "The science behind VIA·L", "page_sub": "What the daily overview rests on — and where the limits of our conclusions are.", "s1_t": "What the app does", "s1_b": "VIA·L brings together what your tracker has already measured and what you noted yourself: sleep, resting pulse, heart-rate variability, energy, how you feel. It then shows how these signals connect, in plain language. This is a wellness tool for observing your lifestyle: it does not diagnose, does not prescribe treatment and does not replace a doctor.", "s2_t": "What a tracker measures — and what it does not", "s2_b": "A tracker measures pulse and its variability, sleep duration and structure, skin temperature, blood oxygen and movement. It does not measure hormones, blood sugar, inflammation or iron stores — there are no such sensors in it. So anything touching those topics comes only from what you noted yourself, and is presented as an observation, never as a measurement.", "s3_t": "Your own baseline, not someone else’s norm", "s3_b": "Heart-rate variability and resting pulse differ several-fold between people: a number that is normal for one person means something else entirely for another. That is why we compare today not with a population table but with your own median from previous weeks. While there are too few days, the app says so plainly: there is nothing to compare with yet.", "s4_t": "One day proves nothing", "s4_b": "Sensors are noisy: a ring or band shifted, the bedroom was cold, dinner was late — and the number drifts. This is especially true of blood oxygen and night temperature. So we read the direction across several days rather than a single value, and we always say when there is too little data for a conclusion.", "s5_t": "How the daily index is built", "s5_b": "The index is a composite of your own data, not a measurement of something inside the body. No publication says «a hot flush equals minus fifteen points», so we deliberately keep the weights flat and cap how much each block can contribute. The reason is simple: a weighted scale and an unweighted one give practically the same result — a head-to-head comparison of two classic menopause questionnaires in 306 women found r = 0.91. Chasing an «exact» weight is therefore pointless; the value lies in the trend, not in the absolute number.", "s6_t": "The cycle and tracker metrics", "s6_b": "In the second half of the cycle night temperature is predictably higher, resting pulse slightly higher and heart-rate variability lower — that is ordinary physiology, not decline, and we read it as context. An important caveat for 35+: as menopause approaches this rhythm first blunts and then disappears — more than half of late perimenopausal cycles run without ovulation, and calendar phase labels lose their meaning. In those cases the app relies on your personal baseline only and does not apply phase logic.", "s7_t": "Blood pressure you measured yourself", "s7_b": "If you enter a home reading, the app describes it against home reference ranges and links it to what is visible in your day — sleep, resting pulse, load. A single reading says little: what matters is how the numbers hold day after day. When they stay above the reference, the app plainly suggests showing your readings to a doctor — and never calls it a disease or advises medication.", "s8_t": "Why we don’t ask you to count calories", "s8_b": "Daily calorie counting is hard to sustain, and most people misjudge how much they ate by a wide margin — you cannot count more precisely than your own error. So we give a guide to what is on the plate and work with what a person can actually repeat for weeks: protein at every meal, vegetables, a walk after eating, a steady sleep schedule.", "s9_t": "The fields we draw on", "s9_b": "Sleep and circadian rhythms. Heart-rate variability and autonomic regulation. The physiology of the stress response. The hormonal transitions of midlife — perimenopause, menopause, andropause. Nutrition and metabolism. Strength and aerobic training, including age-related muscle loss. Home blood-pressure measurement. We read reviews and meta-analyses in these fields and translate them into observations about your day — without treatment protocols, prescriptions or promises of results.", "disc": "The material in this app is for information only, is not a medical opinion and does not replace consulting a doctor. The app is not intended to diagnose, treat or prevent any disease.", "nav_today": "Today", "nav_approach": "Our approach", "nav_guide": "My guide", "nav_card": "My Profile"}, "es": {"page_title": "Base científica", "page_sub": "En qué se apoya lo que lees en el resumen y dónde están los límites de nuestras conclusiones.", "s1_t": "Qué hace la aplicación", "s1_b": "VIA·L reúne en una sola imagen lo que ya midió tu dispositivo y lo que anotaste tú: sueño, pulso en reposo, variabilidad del ritmo, energía, cómo te sientes. Luego muestra cómo se conectan esas señales, en lenguaje sencillo. Es una herramienta de bienestar para observar tu estilo de vida: no diagnostica, no prescribe tratamientos y no sustituye al médico.", "s2_t": "Qué mide un dispositivo y qué no", "s2_b": "El dispositivo mide el pulso y su variabilidad, la duración y estructura del sueño, la temperatura de la piel, el oxígeno en sangre y el movimiento. No mide hormonas, glucosa, inflamación ni reservas de hierro: no tiene esos sensores. Por eso todo lo relacionado con esos temas sale solo de lo que anotaste y se presenta como observación, nunca como medición.", "s3_t": "Tu propia base, no la norma ajena", "s3_b": "La variabilidad cardíaca y el pulso en reposo varían mucho entre personas: una cifra normal para alguien significa algo distinto para otro. Por eso comparamos tu día no con una tabla poblacional, sino con tu propia mediana de las semanas anteriores. Mientras haya pocos días, la app lo dice claramente: todavía no hay con qué comparar.", "s4_t": "Un solo día no prueba nada", "s4_b": "Los sensores tienen ruido: el anillo o la pulsera se movió, la habitación estaba fría, cenaste tarde, y la cifra se desplaza. Vale sobre todo para el oxígeno en sangre y la temperatura nocturna. Por eso leemos la dirección de varios días y no un valor aislado, y decimos siempre cuando faltan datos para concluir.", "s5_t": "Cómo se calcula el «Índice del día»", "s5_b": "El índice es un compuesto de tus propios datos, no una medición de algo en el organismo. No existen publicaciones del tipo «un sofoco equivale a menos quince puntos», así que mantenemos los pesos suavizados y limitamos el aporte de cada bloque. La razón es simple: una escala con pesos y otra sin ellos dan prácticamente el mismo resultado — la comparación directa de dos cuestionarios clásicos de menopausia en 306 mujeres dio r = 0,91. Perseguir el peso «exacto» no tiene sentido; el valor está en la tendencia.", "s6_t": "El ciclo y los datos del dispositivo", "s6_b": "En la segunda mitad del ciclo la temperatura nocturna es previsiblemente más alta, el pulso en reposo algo mayor y la variabilidad más baja: es fisiología normal, no un empeoramiento, y la leemos como contexto. Advertencia importante para 35+: al acercarse la menopausia ese ritmo primero se atenúa y luego desaparece — más de la mitad de los ciclos de la perimenopausia tardía transcurren sin ovulación y las etiquetas de fase pierden sentido. Entonces la app se apoya solo en tu base personal.", "s7_t": "La presión que mediste tú", "s7_b": "Si introduces una medición casera, la app la describe según los rangos de referencia domésticos y la relaciona con lo que se ve en tu día: sueño, pulso en reposo, carga. Una sola medición dice poco: importa cómo se mantienen las cifras día tras día. Cuando se mantienen por encima de la referencia, la app sugiere claramente enseñar tus mediciones al médico, y nunca lo llama enfermedad ni aconseja medicamentos.", "s8_t": "Por qué no pedimos contar calorías", "s8_b": "Contar calorías a diario es difícil de sostener y la mayoría se equivoca mucho al estimar lo que comió: no se puede contar con más precisión que el propio error. Por eso damos una guía sobre la composición del plato y trabajamos con lo que alguien puede repetir durante semanas: proteína en cada comida, verduras, caminar tras comer, un sueño regular.", "s9_t": "Los campos en que nos apoyamos", "s9_b": "Sueño y ritmos circadianos. Variabilidad cardíaca y regulación autonómica. Fisiología de la respuesta al estrés. Transiciones hormonales de la mediana edad: perimenopausia, menopausia, andropausia. Nutrición y metabolismo. Entrenamiento de fuerza y aeróbico, incluida la pérdida muscular por edad. Medición domiciliaria de la presión. Leemos revisiones y metaanálisis de estos campos y los traducimos en observaciones sobre tu día, sin protocolos de tratamiento, prescripciones ni promesas de resultados.", "disc": "El contenido de la aplicación es informativo, no constituye un informe médico y no sustituye la consulta con un médico. La aplicación no está destinada a diagnosticar, tratar ni prevenir enfermedades.", "nav_today": "Hoy", "nav_approach": "Enfoque", "nav_guide": "Mi guía", "nav_card": "Mi perfil"}, "de": {"page_title": "Wissenschaftliche Grundlage", "page_sub": "Worauf beruht, was du in der Auswertung liest — und wo die Grenzen unserer Aussagen liegen.", "s1_t": "Was die App tut", "s1_b": "VIA·L führt zusammen, was dein Tracker bereits gemessen hat, und was du selbst notiert hast: Schlaf, Ruhepuls, Herzratenvariabilität, Energie, Befinden. Anschließend zeigt die App die Zusammenhänge in klarer Sprache. Sie ist ein Wellness-Werkzeug zur Beobachtung des Lebensstils: keine Diagnose, keine Behandlung, kein Ersatz für ärztlichen Rat.", "s2_t": "Was ein Tracker misst — und was nicht", "s2_b": "Ein Tracker misst Puls und Herzratenvariabilität, Schlafdauer und -struktur, Hauttemperatur, Sauerstoffsättigung und Bewegung. Er misst keine Hormone, keinen Blutzucker, keine Entzündung und keine Eisenspeicher — solche Sensoren gibt es darin nicht. Alles zu diesen Themen stammt daher allein aus deinen eigenen Angaben und wird als Beobachtung dargestellt, nie als Messwert.", "s3_t": "Deine eigene Basislinie statt fremder Normen", "s3_b": "Herzratenvariabilität und Ruhepuls unterscheiden sich zwischen Menschen um ein Vielfaches: ein Wert, der für die eine Person normal ist, bedeutet für die andere etwas ganz anderes. Deshalb vergleichen wir den heutigen Tag nicht mit einer Bevölkerungstabelle, sondern mit deinem eigenen Median der letzten Wochen. Solange zu wenige Tage vorliegen, sagt die App das offen.", "s4_t": "Ein einzelner Tag beweist nichts", "s4_b": "Sensoren rauschen: Ring oder Band verrutscht, kaltes Schlafzimmer, spätes Abendessen — und der Wert wandert. Das gilt besonders für Sauerstoffsättigung und Nachttemperatur. Deshalb lesen wir die Richtung über mehrere Tage statt eines einzelnen Werts und sagen immer, wenn die Daten für eine Aussage nicht reichen.", "s5_t": "Wie der Tagesindex entsteht", "s5_b": "Der Index ist ein Komposit aus deinen eigenen Daten, keine Messung im Körper. Es gibt keine Publikation nach dem Muster «eine Hitzewallung = minus fünfzehn Punkte», deshalb halten wir die Gewichte bewusst flach und begrenzen den Beitrag jedes Blocks. Der Grund: eine gewichtete und eine ungewichtete Skala liefern praktisch dasselbe — der direkte Vergleich zweier klassischer Menopause-Fragebögen an 306 Frauen ergab r = 0,91. Das «exakte» Gewicht zu suchen bringt nichts; entscheidend ist der Verlauf.", "s6_t": "Zyklus und Tracker-Werte", "s6_b": "In der zweiten Zyklushälfte ist die Nachttemperatur erwartungsgemäß höher, der Ruhepuls etwas höher und die Herzratenvariabilität niedriger — das ist normale Physiologie, keine Verschlechterung, und wir lesen es als Kontext. Wichtiger Hinweis für 35+: mit nahender Menopause flacht dieser Rhythmus zuerst ab und verschwindet dann — mehr als die Hälfte der späten Perimenopause-Zyklen verläuft ohne Eisprung, und Kalenderphasen verlieren ihren Sinn. Dann stützt sich die App nur auf deine persönliche Basislinie.", "s7_t": "Blutdruck, den du selbst gemessen hast", "s7_b": "Wenn du eine häusliche Messung einträgst, beschreibt die App sie anhand häuslicher Richtwerte und verknüpft sie mit dem, was in deinem Tag sichtbar ist — Schlaf, Ruhepuls, Belastung. Eine einzelne Messung sagt wenig: entscheidend ist, wie die Werte über Tage bleiben. Bleiben sie über dem Richtwert, empfiehlt die App klar, die Messungen ärztlich zeigen zu lassen — und nennt es nie eine Krankheit und rät nie zu Medikamenten.", "s8_t": "Warum wir kein Kalorienzählen verlangen", "s8_b": "Tägliches Kalorienzählen hält kaum jemand durch, und die meisten schätzen das Gegessene stark falsch ein — genauer als der eigene Fehler kann man nicht zählen. Deshalb geben wir eine Orientierung zur Zusammensetzung des Tellers und arbeiten mit dem, was sich wochenlang wiederholen lässt: Eiweiß zu jeder Mahlzeit, Gemüse, Bewegung nach dem Essen, ein stabiler Schlafrhythmus.", "s9_t": "Worauf wir uns stützen", "s9_b": "Schlaf und zirkadiane Rhythmen. Herzratenvariabilität und autonome Regulation. Physiologie der Stressreaktion. Hormonelle Übergänge der Lebensmitte — Perimenopause, Menopause, Andropause. Ernährung und Stoffwechsel. Kraft- und Ausdauertraining, einschließlich altersbedingtem Muskelverlust. Häusliche Blutdruckmessung. Wir lesen Übersichtsarbeiten und Metaanalysen aus diesen Feldern und übersetzen sie in Beobachtungen zu deinem Tag — ohne Behandlungsprotokolle, Verordnungen oder Ergebnisversprechen.", "disc": "Die Inhalte dieser App dienen der Information, sind kein ärztliches Urteil und ersetzen keine ärztliche Beratung. Die App ist nicht zur Diagnose, Behandlung oder Vorbeugung von Krankheiten bestimmt.", "nav_today": "Heute", "nav_approach": "Ansatz", "nav_guide": "Mein Begleiter", "nav_card": "Mein Profil"}, "pt": {"page_title": "Base científica", "page_sub": "No que se apoia o que você lê na análise — e onde estão os limites das nossas conclusões.", "s1_t": "O que o aplicativo faz", "s1_b": "O VIA·L reúne o que o seu monitor já mediu e o que você anotou: sono, pulso em repouso, variabilidade do ritmo, energia, como se sente. Depois mostra como esses sinais se conectam, em linguagem simples. É uma ferramenta de bem-estar para observar o estilo de vida: não diagnostica, não prescreve tratamento e não substitui o médico.", "s2_t": "O que o monitor mede e o que não mede", "s2_b": "O monitor mede pulso e sua variabilidade, duração e estrutura do sono, temperatura da pele, oxigênio no sangue e movimento. Ele não mede hormônios, glicose, inflamação nem reservas de ferro — não possui esses sensores. Por isso, tudo ligado a esses temas vem apenas do que você anotou e é apresentado como observação, nunca como medição.", "s3_t": "Sua própria base, não a norma alheia", "s3_b": "A variabilidade cardíaca e o pulso em repouso variam muito entre pessoas: um número normal para uma significa outra coisa para outra. Por isso comparamos o seu dia não com uma tabela populacional, mas com a sua própria mediana das semanas anteriores. Enquanto houver poucos dias, o app diz com franqueza: ainda não há com o que comparar.", "s4_t": "Um dia não prova nada", "s4_b": "Sensores têm ruído: o anel ou a pulseira se deslocou, o quarto estava frio, o jantar foi tarde — e o número muda. Isso vale sobretudo para oxigênio no sangue e temperatura noturna. Por isso lemos a direção ao longo de vários dias, não um valor isolado, e sempre dizemos quando há poucos dados para concluir.", "s5_t": "Como é calculado o «Índice do dia»", "s5_b": "O índice é um composto dos seus próprios dados, não uma medição de algo no organismo. Não existem publicações do tipo «uma onda de calor = menos quinze pontos», por isso mantemos os pesos suavizados e limitamos a contribuição de cada bloco. O motivo é simples: uma escala com pesos e outra sem dão praticamente o mesmo resultado — a comparação direta de dois questionários clássicos da menopausa em 306 mulheres deu r = 0,91. Buscar o peso «exato» não faz sentido; o valor está na tendência.", "s6_t": "O ciclo e os dados do monitor", "s6_b": "Na segunda metade do ciclo a temperatura noturna é previsivelmente mais alta, o pulso em repouso um pouco maior e a variabilidade menor — é fisiologia comum, não piora, e lemos isso como contexto. Ressalva importante para 35+: com a aproximação da menopausa esse ritmo primeiro se atenua e depois desaparece — mais da metade dos ciclos da perimenopausa tardia ocorre sem ovulação e os rótulos de fase perdem sentido. Nesses casos o app usa apenas a sua base pessoal.", "s7_t": "A pressão que você mediu", "s7_b": "Se você registra uma medição caseira, o app a descreve pelas faixas de referência domésticas e a liga ao que aparece no seu dia — sono, pulso em repouso, carga. Uma medição isolada diz pouco: importa como os números se mantêm dia após dia. Quando permanecem acima da referência, o app sugere claramente mostrar suas medições ao médico — e nunca chama isso de doença nem indica medicamentos.", "s8_t": "Por que não pedimos contar calorias", "s8_b": "Contar calorias todo dia é difícil de manter, e a maioria erra muito ao estimar o que comeu — não dá para contar com mais precisão do que o próprio erro. Por isso damos uma referência da composição do prato e trabalhamos com o que a pessoa consegue repetir por semanas: proteína em cada refeição, vegetais, caminhada após comer, sono regular.", "s9_t": "As áreas em que nos apoiamos", "s9_b": "Sono e ritmos circadianos. Variabilidade cardíaca e regulação autonômica. Fisiologia da resposta ao estresse. Transições hormonais da meia-idade — perimenopausa, menopausa, andropausa. Nutrição e metabolismo. Treino de força e aeróbico, incluindo perda muscular ligada à idade. Medição da pressão em casa. Lemos revisões e metanálises dessas áreas e as traduzimos em observações sobre o seu dia — sem protocolos de tratamento, prescrições ou promessas de resultado.", "disc": "O conteúdo do aplicativo é informativo, não é um parecer médico e não substitui a consulta ao médico. O aplicativo não se destina a diagnosticar, tratar ou prevenir doenças.", "nav_today": "Hoje", "nav_approach": "Abordagem", "nav_guide": "Meu guia", "nav_card": "Meu perfil"}, "fr": {"page_title": "Base scientifique", "page_sub": "Sur quoi repose ce que vous lisez dans le bilan — et où s’arrêtent nos conclusions.", "s1_t": "Ce que fait l’application", "s1_b": "VIA·L rassemble ce que votre montre a déjà mesuré et ce que vous avez noté : sommeil, pouls au repos, variabilité cardiaque, énergie, ressenti. Il montre ensuite comment ces signaux se relient, en langage clair. C’est un outil de bien-être pour observer son mode de vie : il ne pose pas de diagnostic, ne prescrit pas de traitement et ne remplace pas un médecin.", "s2_t": "Ce que la montre mesure — et ce qu’elle ne mesure pas", "s2_b": "La montre mesure le pouls et sa variabilité, la durée et la structure du sommeil, la température cutanée, l’oxygène sanguin et le mouvement. Elle ne mesure ni hormones, ni glycémie, ni inflammation, ni réserves de fer : ces capteurs n’existent pas. Tout ce qui touche à ces sujets provient donc uniquement de ce que vous avez noté et est présenté comme une observation, jamais comme une mesure.", "s3_t": "Votre propre base, pas la norme des autres", "s3_b": "La variabilité cardiaque et le pouls au repos varient fortement d’une personne à l’autre : un chiffre normal pour l’un signifie tout autre chose pour l’autre. Nous comparons donc votre journée non pas à une table de population, mais à votre propre médiane des semaines précédentes. Tant que les jours sont trop peu nombreux, l’application le dit clairement.", "s4_t": "Une journée ne prouve rien", "s4_b": "Les capteurs sont bruités : bague ou bracelet déplacé, chambre froide, dîner tardif — et le chiffre dérive. C’est particulièrement vrai pour l’oxygène sanguin et la température nocturne. Nous lisons donc la tendance sur plusieurs jours plutôt qu’une valeur isolée, et nous disons toujours quand les données sont insuffisantes.", "s5_t": "Comment est calculé l’« Indice du jour »", "s5_b": "L’indice est un composite de vos propres données, non une mesure de quelque chose dans le corps. Aucune publication ne dit « une bouffée de chaleur = moins quinze points » ; nous gardons donc des pondérations volontairement plates et plafonnons l’apport de chaque bloc. La raison est simple : une échelle pondérée et une échelle non pondérée donnent quasiment le même résultat — la comparaison directe de deux questionnaires classiques de la ménopause chez 306 femmes a donné r = 0,91. Chercher le poids « exact » n’a donc pas de sens ; la valeur est dans la tendance.", "s6_t": "Le cycle et les mesures de la montre", "s6_b": "Dans la seconde moitié du cycle, la température nocturne est logiquement plus haute, le pouls au repos un peu plus élevé et la variabilité plus basse : c’est de la physiologie ordinaire, pas une dégradation, et nous le lisons comme un contexte. Réserve importante pour les 35+ : à l’approche de la ménopause ce rythme s’atténue puis disparaît — plus de la moitié des cycles de périménopause tardive se déroulent sans ovulation, et les étiquettes de phase perdent leur sens. L’application s’appuie alors uniquement sur votre base personnelle.", "s7_t": "La tension que vous avez mesurée", "s7_b": "Si vous saisissez une mesure à domicile, l’application la décrit selon les repères domestiques et la relie à ce que montre votre journée : sommeil, pouls au repos, charge. Une mesure isolée dit peu : ce qui compte, c’est la tenue des chiffres jour après jour. S’ils restent au-dessus du repère, l’application propose clairement de montrer vos mesures à un médecin — sans jamais parler de maladie ni conseiller de médicament.", "s8_t": "Pourquoi nous ne demandons pas de compter les calories", "s8_b": "Compter les calories chaque jour tient rarement, et la plupart des gens se trompent largement en estimant ce qu’ils ont mangé — on ne peut pas compter plus précisément que son erreur. Nous donnons donc un repère sur la composition de l’assiette et travaillons ce qui se répète pendant des semaines : protéines à chaque repas, légumes, marche après le repas, sommeil régulier.", "s9_t": "Les domaines sur lesquels nous nous appuyons", "s9_b": "Sommeil et rythmes circadiens. Variabilité cardiaque et régulation autonome. Physiologie de la réponse au stress. Transitions hormonales de la quarantaine — périménopause, ménopause, andropause. Nutrition et métabolisme. Renforcement musculaire et endurance, y compris la perte musculaire liée à l’âge. Mesure de la tension à domicile. Nous lisons revues et méta-analyses de ces domaines et les traduisons en observations sur votre journée — sans protocoles de traitement, sans prescriptions et sans promesses de résultat.", "disc": "Les contenus de l’application sont informatifs, ne constituent pas un avis médical et ne remplacent pas une consultation. L’application n’est pas destinée à diagnostiquer, traiter ou prévenir une maladie.", "nav_today": "Aujourd'hui", "nav_approach": "Approche", "nav_guide": "Mon guide", "nav_card": "Mon profil"}, "pl": {"page_title": "Podstawa naukowa", "page_sub": "Na czym opiera się to, co czytasz w analizie — i gdzie kończą się nasze wnioski.", "s1_t": "Co robi aplikacja", "s1_b": "VIA·L łączy w jeden obraz to, co zmierzył twój tracker, i to, co zaznaczyłeś sam: sen, tętno spoczynkowe, zmienność rytmu, energię, samopoczucie. Następnie pokazuje związki między tymi sygnałami prostym językiem. To narzędzie wellness do obserwacji stylu życia: nie stawia diagnoz, nie zaleca leczenia i nie zastępuje lekarza.", "s2_t": "Co mierzy tracker, a czego nie", "s2_b": "Tracker mierzy tętno i jego zmienność, długość i strukturę snu, temperaturę skóry, wysycenie krwi tlenem oraz ruch. Nie mierzy hormonów, cukru, stanu zapalnego ani zapasów żelaza — nie ma takich czujników. Dlatego wszystko, co dotyczy tych tematów, pochodzi wyłącznie z twoich zapisów i jest podawane jako obserwacja, nigdy jako pomiar.", "s3_t": "Twoja własna baza zamiast cudzych norm", "s3_b": "Zmienność rytmu serca i tętno spoczynkowe różnią się między ludźmi wielokrotnie: liczba normalna dla jednej osoby u innej znaczy coś zupełnie innego. Dlatego porównujemy dzisiejszy dzień nie z tabelą populacyjną, lecz z twoją własną medianą z minionych tygodni. Dopóki dni jest za mało, aplikacja mówi wprost: nie ma jeszcze z czym porównywać.", "s4_t": "Jeden dzień niczego nie dowodzi", "s4_b": "Czujniki szumią: przesunął się pierścień lub opaska, sypialnia była zimna, kolacja późna — i liczba ucieka. Dotyczy to zwłaszcza tlenu we krwi i temperatury nocnej. Dlatego czytamy kierunek z kilku dni, a nie pojedynczą wartość, i zawsze mówimy, gdy danych jest za mało.", "s5_t": "Jak liczony jest „Indeks dnia”", "s5_b": "Indeks to złożenie twoich własnych danych, a nie pomiar czegoś w organizmie. Nie ma publikacji w rodzaju „uderzenie gorąca = minus piętnaście punktów”, dlatego celowo trzymamy wagi wypłaszczone i ograniczamy udział każdego bloku. Powód jest prosty: skala z wagami i bez wag dają praktycznie ten sam wynik — bezpośrednie porównanie dwóch klasycznych kwestionariuszy menopauzy u 306 kobiet dało r = 0,91. Pogoń za „dokładną” wagą nie ma sensu; wartość jest w trendzie.", "s6_t": "Cykl a dane trackera", "s6_b": "W drugiej połowie cyklu temperatura nocna jest wyższa, tętno spoczynkowe nieco wyższe, a zmienność rytmu niższa — to zwykła fizjologia, nie pogorszenie, i czytamy to jako kontekst. Ważne zastrzeżenie dla 35+: wraz ze zbliżaniem się menopauzy ten rytm najpierw się wygładza, a potem znika — ponad połowa późnych cykli okołomenopauzalnych przebiega bez owulacji, a kalendarzowe etykiety faz tracą sens. Wtedy aplikacja opiera się tylko na twojej bazie osobistej.", "s7_t": "Ciśnienie zmierzone przez ciebie", "s7_b": "Jeśli wpiszesz pomiar domowy, aplikacja opisze go według domowych punktów odniesienia i powiąże z tym, co widać w twoim dniu — snem, tętnem spoczynkowym, obciążeniem. Pojedynczy pomiar mówi niewiele: liczy się, jak wartości trzymają się dzień po dniu. Gdy utrzymują się powyżej odniesienia, aplikacja wprost proponuje pokazać pomiary lekarzowi — i nigdy nie nazywa tego chorobą ani nie doradza leków.", "s8_t": "Dlaczego nie prosimy o liczenie kalorii", "s8_b": "Codzienne liczenie kalorii trudno utrzymać, a większość ludzi mocno myli się w ocenie tego, co zjadła — nie da się liczyć dokładniej niż własny błąd. Dlatego dajemy wskazówkę co do składu talerza i pracujemy z tym, co można powtarzać tygodniami: białko w każdym posiłku, warzywa, ruch po jedzeniu, regularny sen.", "s9_t": "Dziedziny, na których się opieramy", "s9_b": "Sen i rytmy okołodobowe. Zmienność rytmu serca i regulacja autonomiczna. Fizjologia reakcji stresowej. Hormonalne przejścia wieku średniego — perimenopauza, menopauza, andropauza. Żywienie i metabolizm. Trening siłowy i tlenowy, w tym utrata mięśni z wiekiem. Domowy pomiar ciśnienia. Czytamy przeglądy i metaanalizy z tych dziedzin i przekładamy je na obserwacje o twoim dniu — bez protokołów leczenia, zaleceń lekowych i obietnic wyników.", "disc": "Materiały w aplikacji mają charakter informacyjny, nie są opinią medyczną i nie zastępują konsultacji lekarskiej. Aplikacja nie służy do diagnozowania, leczenia ani zapobiegania chorobom.", "nav_today": "Dziś", "nav_approach": "Podejście", "nav_guide": "Mój przewodnik", "nav_card": "Mój profil"}, "it": {"page_title": "Base scientifica", "page_sub": "Su cosa si basa ciò che leggi nell’analisi — e dove finiscono le nostre conclusioni.", "s1_t": "Cosa fa l’app", "s1_b": "VIA·L mette insieme ciò che il tuo dispositivo ha già misurato e ciò che hai annotato: sonno, battito a riposo, variabilità del ritmo, energia, come stai. Poi mostra come questi segnali si collegano, con parole semplici. È uno strumento di benessere per osservare lo stile di vita: non fa diagnosi, non prescrive terapie e non sostituisce il medico.", "s2_t": "Cosa misura il dispositivo e cosa no", "s2_b": "Il dispositivo misura battito e variabilità, durata e struttura del sonno, temperatura cutanea, ossigeno nel sangue e movimento. Non misura ormoni, glicemia, infiammazione o riserve di ferro: quei sensori non esistono. Perciò tutto ciò che riguarda questi temi deriva solo da quanto hai annotato ed è presentato come osservazione, mai come misura.", "s3_t": "La tua base personale, non la norma altrui", "s3_b": "La variabilità cardiaca e il battito a riposo variano molto tra le persone: un valore normale per uno significa altro per un altro. Per questo confrontiamo la tua giornata non con una tabella di popolazione, ma con la tua mediana delle settimane precedenti. Finché i giorni sono pochi, l’app lo dice chiaramente.", "s4_t": "Un solo giorno non dimostra nulla", "s4_b": "I sensori fanno rumore: anello o bracciale spostato, camera fredda, cena tardiva — e il numero si sposta. Vale soprattutto per ossigeno nel sangue e temperatura notturna. Perciò leggiamo la direzione su più giorni invece di un singolo valore, e diciamo sempre quando i dati non bastano.", "s5_t": "Come si calcola l’«Indice del giorno»", "s5_b": "L’indice è un composito dei tuoi dati, non la misura di qualcosa nel corpo. Non esistono pubblicazioni del tipo «una vampata = meno quindici punti», perciò teniamo i pesi volutamente piatti e limitiamo il contributo di ogni blocco. Il motivo è semplice: una scala con pesi e una senza danno praticamente lo stesso risultato — il confronto diretto di due questionari classici sulla menopausa in 306 donne ha dato r = 0,91. Inseguire il peso «esatto» è inutile; il valore sta nell’andamento.", "s6_t": "Il ciclo e i dati del dispositivo", "s6_b": "Nella seconda metà del ciclo la temperatura notturna è prevedibilmente più alta, il battito a riposo un po’ più alto e la variabilità più bassa: è fisiologia normale, non un peggioramento, e la leggiamo come contesto. Avvertenza importante per 35+: avvicinandosi la menopausa questo ritmo prima si attenua e poi scompare — più della metà dei cicli della perimenopausa tardiva avviene senza ovulazione e le etichette di fase perdono senso. In quei casi l’app usa solo la tua base personale.", "s7_t": "La pressione che hai misurato", "s7_b": "Se inserisci una misurazione a casa, l’app la descrive secondo i riferimenti domestici e la collega a ciò che si vede nella tua giornata: sonno, battito a riposo, carico. Una singola misurazione dice poco: conta come i numeri si mantengono giorno dopo giorno. Se restano sopra il riferimento, l’app suggerisce chiaramente di mostrare le misurazioni al medico — e non lo chiama mai malattia né consiglia farmaci.", "s8_t": "Perché non chiediamo di contare le calorie", "s8_b": "Contare le calorie ogni giorno è difficile da mantenere e la maggior parte sbaglia molto nello stimare ciò che ha mangiato: non si può contare più precisamente del proprio errore. Perciò diamo un riferimento sulla composizione del piatto e lavoriamo su ciò che si può ripetere per settimane: proteine a ogni pasto, verdure, camminata dopo mangiato, sonno regolare.", "s9_t": "Gli ambiti su cui ci basiamo", "s9_b": "Sonno e ritmi circadiani. Variabilità cardiaca e regolazione autonomica. Fisiologia della risposta allo stress. Transizioni ormonali della mezza età — perimenopausa, menopausa, andropausa. Nutrizione e metabolismo. Allenamento di forza e aerobico, inclusa la perdita muscolare legata all’età. Misurazione domiciliare della pressione. Leggiamo revisioni e meta-analisi di questi ambiti e le traduciamo in osservazioni sulla tua giornata — senza protocolli terapeutici, prescrizioni o promesse di risultato.", "disc": "I contenuti dell’app sono informativi, non costituiscono un parere medico e non sostituiscono il consulto medico. L’app non è destinata a diagnosticare, curare o prevenire malattie.", "nav_today": "Oggi", "nav_approach": "Approccio", "nav_guide": "La mia guida", "nav_card": "Il mio profilo"}, "he": {"page_title": "הבסיס המדעי", "page_sub": "על מה מבוסס מה שאתם קוראים בסקירה — והיכן עוברים גבולות המסקנות שלנו.", "s1_t": "מה האפליקציה עושה", "s1_b": "‏VIA·L מחבר לתמונה אחת את מה שהמכשיר שלכם כבר מדד ואת מה שציינתם בעצמכם: שינה, דופק במנוחה, שונות קצב הלב, אנרגיה, תחושה. לאחר מכן הוא מראה כיצד הסימנים מתחברים, בשפה פשוטה. זהו כלי וולנס למעקב אחרי אורח החיים: הוא אינו מאבחן, אינו רושם טיפול ואינו מחליף רופא.", "s2_t": "מה המכשיר מודד ומה לא", "s2_b": "‏המכשיר מודד דופק ושונות שלו, משך ומבנה שינה, טמפרטורת עור, ריווי חמצן ותנועה. הוא אינו מודד הורמונים, סוכר בדם, דלקת או מאגרי ברזל — אין בו חיישנים כאלה. לכן כל מה שנוגע לנושאים האלה נובע רק ממה שציינתם, ומוצג כתצפית ולא כמדידה.", "s3_t": "קו הבסיס שלכם, לא נורמה של אחרים", "s3_b": "‏שונות קצב הלב והדופק במנוחה שונים מאוד בין אנשים: מספר שנחשב רגיל אצל אחד מציין משהו אחר לגמרי אצל אחר. לכן אנחנו משווים את היום שלכם לא לטבלה כללית אלא לחציון שלכם מהשבועות הקודמים. כל עוד יש מעט ימים, האפליקציה אומרת זאת בפירוש.", "s4_t": "יום אחד לא מוכיח דבר", "s4_b": "‏חיישנים רועשים: הטבעת או הצמיד זזו, חדר השינה היה קר, ארוחת הערב הייתה מאוחרת — והמספר זז. נכון במיוחד לחמצן בדם ולטמפרטורת לילה. לכן אנחנו קוראים את הכיוון לאורך כמה ימים ולא ערך בודד, ותמיד אומרים כשאין מספיק נתונים.", "s5_t": "איך מחושב «מדד היום»", "s5_b": "‏המדד הוא הרכב של הנתונים שלכם, לא מדידה של משהו בגוף. אין פרסום שאומר «גל חום = מינוס חמש-עשרה נקודות», ולכן אנחנו שומרים על משקלים מוחלקים ומגבילים את התרומה של כל בלוק. הסיבה פשוטה: סולם עם משקלים וסולם בלעדיהם נותנים תוצאה כמעט זהה — השוואה ישירה של שני שאלוני גיל המעבר הקלאסיים אצל 306 נשים נתנה r = 0.91. לכן אין טעם לרדוף אחרי משקל «מדויק»; הערך הוא במגמה.", "s6_t": "המחזור ונתוני המכשיר", "s6_b": "‏במחצית השנייה של המחזור טמפרטורת הלילה גבוהה יותר, הדופק במנוחה מעט גבוה יותר ושונות הקצב נמוכה יותר — זו פיזיולוגיה רגילה ולא הידרדרות, ואנחנו קוראים אותה כהקשר. הסתייגות חשובה לגיל 35+: עם ההתקרבות לגיל המעבר הקצב הזה קודם נחלש ואז נעלם — יותר ממחצית המחזורים בשלב המאוחר עוברים ללא ביוץ, ותוויות השלבים מאבדות משמעות. במקרים כאלה האפליקציה נשענת רק על קו הבסיס האישי שלכם.", "s7_t": "לחץ הדם שמדדתם בעצמכם", "s7_b": "‏אם אתם מזינים מדידה ביתית, האפליקציה מתארת אותה לפי טווחי ייחוס ביתיים ומקשרת אותה למה שנראה ביום שלכם — שינה, דופק במנוחה, עומס. מדידה אחת אומרת מעט: חשוב איך המספרים נשמרים מיום ליום. כשהם נשארים מעל טווח הייחוס, האפליקציה מציעה בפירוש להראות את המדידות לרופא — ולעולם לא מכנה זאת מחלה ולא ממליצה על תרופות.", "s8_t": "למה איננו מבקשים לספור קלוריות", "s8_b": "‏ספירת קלוריות יומית קשה לשימור, ורוב האנשים טועים מאוד בהערכת מה שאכלו — אי אפשר לספור בדיוק גבוה יותר מהטעות שלכם. לכן אנחנו נותנים כיוון להרכב הצלחת ועובדים עם מה שאפשר לחזור עליו שבועות: חלבון בכל ארוחה, ירקות, הליכה אחרי האוכל, שינה סדירה.", "s9_t": "התחומים שעליהם אנו נשענים", "s9_b": "‏שינה ומקצבים צירקדיים. שונות קצב הלב וויסות אוטונומי. פיזיולוגיה של תגובת הדחק. מעברים הורמונליים בגיל הביניים — פרימנופאוזה, מנופאוזה, אנדרופאוזה. תזונה וחילוף חומרים. אימוני כוח ואירובי, כולל אובדן שריר עם הגיל. מדידת לחץ דם בבית. אנחנו קוראים סקירות ומטא-אנליזות בתחומים האלה ומתרגמים אותם לתצפיות על היום שלכם — בלי פרוטוקולי טיפול, בלי מרשמים ובלי הבטחות לתוצאה.", "disc": "‏התכנים באפליקציה הם מידע בלבד, אינם חוות דעת רפואית ואינם מחליפים ייעוץ רופא. האפליקציה אינה מיועדת לאבחון, טיפול או מניעה של מחלות.", "nav_today": "היום", "nav_approach": "הגישה שלנו", "nav_guide": "המלווה שלי", "nav_card": "הפרופיל שלי"}, "ja": {"page_title": "科学的な土台", "page_sub": "毎日のまとめが何に基づいているか、そして私たちの結論の限界について。", "s1_t": "アプリがすること", "s1_b": "VIA·L は、トラッカーが計測した値と、あなた自身が記録した内容（睡眠、安静時心拍、心拍変動、エネルギー、体調）を一つの絵にまとめます。そのうえで、それらのつながりを平易な言葉で示します。生活習慣を観察するためのウェルネスツールであり、診断も治療の指示も行わず、医師の代わりにもなりません。", "s2_t": "トラッカーが測れるもの・測れないもの", "s2_b": "トラッカーが測るのは、脈拍とその変動、睡眠の長さと構造、皮膚温、血中酸素、動きです。ホルモン、血糖、炎症、鉄の貯蔵量は測れません（そのセンサーはありません）。ですからこれらに関わる内容は、あなたの記録だけから導かれ、測定値ではなく観察として示されます。", "s3_t": "他人の基準ではなく、あなた自身の基準", "s3_b": "心拍変動や安静時心拍は個人差が数倍あり、ある人にとって普通の数値が、別の人ではまったく違う意味を持ちます。そのため今日の値は集団の表ではなく、これまでの数週間のあなた自身の中央値と比べます。日数が足りないうちは、その旨をはっきり伝えます。", "s4_t": "一日では何も分からない", "s4_b": "センサーにはノイズがあります。リングやバンドがずれた、寝室が寒かった、夕食が遅かった——それだけで数値は動きます。とくに血中酸素と夜間体温はそうです。ですから単発の値ではなく数日の方向を読み、判断に足るデータがないときはそう伝えます。", "s5_t": "「今日の指数」の作り方", "s5_b": "指数は、あなたのデータを合成したものであり、体内の何かを測った値ではありません。「ほてり＝マイナス15点」といった研究は存在しないため、重みは意図的にならし、各ブロックの寄与に上限を設けています。理由は単純で、重み付きの尺度と重みなしの尺度はほぼ同じ結果になるからです。更年期の代表的な2つの質問票を306人で直接比較すると r = 0.91 でした。「正確な」重みを追う意味は薄く、価値は推移にあります。", "s6_t": "月経周期とトラッカーの数値", "s6_b": "周期の後半は夜間体温がやや高く、安静時心拍もやや高く、心拍変動は低めになります。これは通常の生理であって悪化ではなく、文脈として読みます。35歳以上で重要な点：閉経が近づくとこのリズムはまず弱まり、やがて消えます。周閉経期後半の周期の半数以上は排卵を伴わず、カレンダー上の「期」のラベルは意味を失います。その場合は個人の基準だけを使い、周期のロジックは適用しません。", "s7_t": "ご自身で測った血圧", "s7_b": "家庭で測った血圧を入力すると、家庭血圧の目安に沿って説明し、その日の睡眠・安静時心拍・負荷と結びつけます。1回の測定でわかることは少なく、日々どう推移するかが重要です。目安を上回る状態が続く場合は、測定記録を医師に見せるよう率直に勧めます。病名を付けることも、薬を勧めることもありません。", "s8_t": "カロリー計算を求めない理由", "s8_b": "毎日のカロリー計算は続きにくく、食べた量の見積もり誤差も大きいのが実情です。自分の誤差より細かくは数えられません。そこで私たちは皿の組み立ての目安を示し、数週間くり返せることに取り組みます。毎食のたんぱく質、野菜、食後の歩行、安定した睡眠です。", "s9_t": "拠りどころとする分野", "s9_b": "睡眠と概日リズム。心拍変動と自律神経の調節。ストレス応答の生理学。中年期のホルモン移行——周閉経期、閉経、男性の加齢性変化。栄養と代謝。筋力・有酸素トレーニング（加齢による筋肉量の減少を含む）。家庭血圧の測定。これらの分野のレビューやメタ分析を読み、あなたの一日についての観察へと翻訳します。治療プロトコル、処方、成果の約束は行いません。", "disc": "本アプリの内容は情報提供のみを目的とし、医学的判断ではなく、医師の診察に代わるものではありません。疾患の診断・治療・予防を目的としていません。", "nav_today": "今日", "nav_approach": "アプローチ", "nav_guide": "マイガイド", "nav_card": "マイプロフィール"}, "ko": {"page_title": "과학적 근거", "page_sub": "매일의 요약이 무엇에 근거하는지, 그리고 결론의 한계는 어디까지인지.", "s1_t": "앱이 하는 일", "s1_b": "VIA·L은 트래커가 이미 측정한 값과 직접 기록한 내용(수면, 안정시 맥박, 심박변이, 에너지, 컨디션)을 하나의 그림으로 모읍니다. 그런 다음 신호들이 어떻게 연결되는지 쉬운 말로 보여줍니다. 생활습관을 관찰하기 위한 웰니스 도구이며, 진단이나 치료 처방을 하지 않고 의사를 대신하지도 않습니다.", "s2_t": "트래커가 재는 것과 재지 못하는 것", "s2_b": "트래커는 맥박과 그 변이, 수면의 길이와 구조, 피부 온도, 혈중 산소, 움직임을 측정합니다. 호르몬, 혈당, 염증, 철 저장량은 측정하지 못합니다 — 그런 센서가 없습니다. 따라서 이런 주제와 관련된 내용은 오직 기록한 것에서만 나오며, 측정값이 아니라 관찰로 제시됩니다.", "s3_t": "남의 기준이 아니라 자신의 기준", "s3_b": "심박변이와 안정시 맥박은 사람마다 몇 배씩 차이가 납니다. 한 사람에게 정상인 수치가 다른 사람에게는 전혀 다른 의미일 수 있습니다. 그래서 오늘을 인구 집단 표가 아니라 지난 몇 주간의 자신의 중앙값과 비교합니다. 데이터가 적을 때는 비교할 것이 아직 없다고 분명히 말합니다.", "s4_t": "하루로는 아무것도 알 수 없습니다", "s4_b": "센서에는 잡음이 있습니다. 반지나 밴드가 밀리거나 침실이 춥거나 저녁을 늦게 먹어도 수치는 흔들립니다. 특히 혈중 산소와 야간 체온이 그렇습니다. 그래서 하나의 값이 아니라 며칠간의 방향을 읽고, 판단할 데이터가 부족하면 그렇게 말합니다.", "s5_t": "‘하루 지수’ 계산 방식", "s5_b": "지수는 당신의 데이터를 합성한 값이며, 몸속 무언가를 측정한 수치가 아닙니다. ‘안면홍조 = 마이너스 15점’ 같은 연구는 존재하지 않으므로 가중치를 의도적으로 평탄하게 두고 각 항목의 기여를 제한합니다. 이유는 간단합니다. 가중치가 있는 척도와 없는 척도가 사실상 같은 결과를 냅니다 — 폐경 관련 고전 설문 두 가지를 306명에서 직접 비교하니 r = 0.91이었습니다. ‘정확한’ 가중치를 좇을 이유가 없고, 가치는 흐름에 있습니다.", "s6_t": "주기와 트래커 수치", "s6_b": "주기 후반에는 야간 체온이 예상대로 높아지고 안정시 맥박이 약간 오르며 심박변이는 낮아집니다. 이는 정상적인 생리이지 악화가 아니며, 맥락으로 읽습니다. 35세 이상에서 중요한 점: 폐경이 가까워지면 이 리듬은 먼저 약해지고 이후 사라집니다. 후기 폐경이행기 주기의 절반 이상이 배란 없이 지나가며 달력상의 국면 표시는 의미를 잃습니다. 그럴 때는 개인 기준만 사용하고 주기 논리를 적용하지 않습니다.", "s7_t": "직접 잰 혈압", "s7_b": "집에서 잰 값을 입력하면 가정 혈압 기준에 따라 설명하고, 그날의 수면·안정시 맥박·부하와 연결합니다. 한 번의 측정으로는 알기 어렵고, 며칠에 걸친 유지 여부가 중요합니다. 기준보다 계속 높다면 측정 기록을 의사에게 보여주라고 분명히 권합니다. 병명을 붙이거나 약을 권하지는 않습니다.", "s8_t": "칼로리를 세라고 하지 않는 이유", "s8_b": "매일 칼로리를 세는 일은 유지하기 어렵고, 대부분은 먹은 양을 크게 잘못 추정합니다. 자기 오차보다 정밀하게 셀 수는 없습니다. 그래서 접시 구성의 기준을 제시하고, 몇 주간 반복할 수 있는 것에 집중합니다. 매 끼니 단백질, 채소, 식후 걷기, 규칙적인 수면입니다.", "s9_t": "근거로 삼는 분야", "s9_b": "수면과 일주기 리듬. 심박변이와 자율신경 조절. 스트레스 반응의 생리학. 중년의 호르몬 전환 — 폐경이행기, 폐경, 남성 갱년기. 영양과 대사. 근력 및 유산소 운동, 나이에 따른 근육 손실 포함. 가정 혈압 측정. 이 분야의 리뷰와 메타분석을 읽고 당신의 하루에 대한 관찰로 옮깁니다. 치료 프로토콜, 처방, 결과 약속은 하지 않습니다.", "disc": "이 앱의 내용은 정보 제공용이며 의학적 소견이 아니고 의사 진료를 대신하지 않습니다. 질병의 진단, 치료, 예방을
