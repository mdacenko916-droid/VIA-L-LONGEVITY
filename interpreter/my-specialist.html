<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<style>html{background:#181e28}</style><!-- без белой вспышки при переходе с вкладки на вкладку (2026-10-11) -->
<style>
/* Отдельная страница «Специалист» — оболочка над specialist.js (2026-10-16). Внутри приложения та же вкладка
   живёт панелью (interpreter-via-l.html → #specPanel), без перезагрузки; сюда приходят с лендинга,
   science.html, research-consent.html и по старым ссылкам. Разметка, стили и тексты ×12 — в specialist.js. */
@view-transition{navigation:auto;}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIA‑L · My specialist</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="phosphor/style.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold-lt:#E2B95A;}   /* цвет подписей нижней строки — как было на этой странице */
html{height:100%;height:-webkit-fill-available;scrollbar-width:none;-ms-overflow-style:none;background:#181e28}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}
html[data-lang="he"]{direction:rtl}
body{background-color:transparent;min-height:100%;min-height:-webkit-fill-available;position:relative;-webkit-font-smoothing:antialiased;}   /* фон — градиент в body::before, html под ним #181e28 */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,#242c39 0%,#1b2029 60%,#181e28 100%);   /* единый графит — как «Профиль» и «Мой прогресс» (2026-10-10) */
}
body.chat-open{overflow:hidden}
/* ── Нижняя навигация: копия #bottombar приложения, чтобы бар не «прыгал» при переходе между вкладками. ── */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:200;}
.bottom-nav{
  display:flex;align-items:center;justify-content:space-around;
  padding:9px 10px calc(7px + env(safe-area-inset-bottom,0px)/3);
  background:linear-gradient(180deg,#242c39,#171d27);
  border-top:1px solid rgba(226,185,90,.38);
}
.bottom-nav-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;letter-spacing:0;text-transform:uppercase;white-space:nowrap;
  color:var(--gold-lt,#EEC77A);cursor:pointer;text-decoration:none;
  background:none;border:none;padding:2px 4px;border-radius:12px;
  font-family:-apple-system,'SF Pro Text',BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;   /* как в приложении: DM Sans шире и выше — из-за него бар не совпадал по высоте со вкладками (2026-08-25) */
}
.bottom-nav-item i{font-size:23px;}
.bottom-nav-item.active i{filter:drop-shadow(0 0 9px rgba(226,185,90,.85));}
.bottom-nav-item:not(.active){opacity:.72;}
@media (min-width:600px){
  .bottom-nav{padding:16px 16px calc(12px + env(safe-area-inset-bottom,0px)/3);}
  .bottom-nav-item{font-size:12px;letter-spacing:.5px;gap:6px;padding:4px 12px;}
}
</style>
</head>
<body>
<div id="spHost"></div>

<!-- Мост покупок: разовый «Разбор со специалистом». На вебе все функции no-op — блок разбора не показывается. -->
<script src="iap-bridge.js"></script>
<script src="specialist.js"></script>
<script>
(function(){
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ q=null; }
  var g=function(k){ try{ return q ? q.get(k) : null; }catch(e){ return null; } };
  vialSp.mount(document.getElementById('spHost'), {
    standalone: true,
    home: './interpreter-via-l.html',   // app/sync-web.sh заменяет на index.html
    lang: g('lang') || '',
    want: { chat: g('chat')==='1' || location.hash==='#chat', review: g('review')==='1' }   // #chat — из пуша
  });
})();
</script>

<!-- Вкладки приложения. «Специалист» — активная; остальные ведут в приложение с ?tab=… -->
<div id="bottombar">
<nav class="bottom-nav" id="vialNav"></nav>
</div>
<script src="bottom-nav.js"></script>
<script src="help.js"></script>
<script>vialBottomNav.mount({ active:'guide', home:'./interpreter-via-l.html', lang:vialSp.lang() });</script>
<script src="push-bridge.js"></script>
</body>
</html>
