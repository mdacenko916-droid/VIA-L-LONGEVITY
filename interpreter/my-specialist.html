<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIA‑L · My specialist</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#10131A; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.07);
  --gold:#C49A3C; --gold-lt:#E2B95A; --gold-dim:rgba(196,154,60,.28);
  --t1:rgba(255,255,255,.96); --t2:rgba(255,255,255,.82); --t3:rgba(255,255,255,.55);
  --ok:#4ECCA3; --ok-dim:rgba(78,204,163,.13); --alert:#FF6B8A;
  --b1:rgba(255,255,255,.07); --b2:rgba(196,154,60,.20);
}
html{height:100%;height:-webkit-fill-available}
html[data-lang="ja"] body{font-family:'Noto Sans JP',sans-serif}
html[data-lang="ko"] body{font-family:'Noto Sans KR',sans-serif}
body{
  font-family:'DM Sans',sans-serif;font-weight:300;color:var(--t1);
  background-color:#10131A;min-height:100%;min-height:-webkit-fill-available;
  -webkit-font-smoothing:antialiased;position:relative;padding:28px 18px 48px;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background-image:url('./images-bg/galaxy-pro.jpg');
  background-size:cover;background-position:center;
}
.wrap{max-width:480px;margin:0 auto}
.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.back{font-size:13px;color:var(--t3);text-decoration:none;letter-spacing:.5px}
.back:hover{color:var(--t1)}
.langsel{
  background:var(--surface);border:1px solid var(--b1);color:var(--t2);
  font-family:inherit;font-size:13px;padding:7px 10px;border-radius:10px;cursor:pointer;
}
.card{
  background:var(--surface);border:1px solid var(--b1);border-radius:22px;
  padding:32px 26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.eyebrow{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold-lt);margin-bottom:12px;text-align:center}
h1{font-family:'Playfair Display',serif;font-weight:400;font-size:25px;text-align:center;margin-bottom:12px}
.intro{font-size:13.5px;color:var(--t2);line-height:1.7;text-align:center;margin-bottom:28px}
label.fld{display:block;margin-bottom:18px}
label.fld .lbl{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
label.fld .opt{text-transform:none;letter-spacing:0;color:var(--t3)}
input.in{
  width:100%;background:var(--surface-2);border:1px solid var(--b1);border-radius:12px;
  color:var(--t1);font-family:inherit;font-size:15px;font-weight:300;padding:13px 15px;
}
input.in::placeholder{color:var(--t3)}
input.in:focus{outline:none;border-color:var(--b2);box-shadow:0 0 0 3px var(--gold-dim)}
input.in.err{border-color:var(--alert)}
#code{text-transform:uppercase;letter-spacing:2px}
.specfound{
  display:none;margin:-8px 0 18px;padding:11px 14px;border-radius:12px;
  background:var(--ok-dim);border:1px solid rgba(78,204,163,.3);font-size:13.5px;color:var(--t1);
}
.specfound b{color:var(--ok);font-weight:500}
.consent{display:flex;gap:11px;align-items:flex-start;margin-bottom:24px;cursor:pointer}
.consent input{margin-top:3px;width:17px;height:17px;flex-shrink:0;accent-color:var(--gold)}
.consent span{font-size:12.5px;color:var(--t2);line-height:1.65}
.btn{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-lt));
  color:#1a1408;border:none;border-radius:12px;font-family:inherit;font-size:15px;
  font-weight:500;letter-spacing:.5px;padding:15px;cursor:pointer;transition:transform .15s,opacity .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.ghost{background:none;border:1px solid var(--b1);color:var(--t2);margin-top:12px}
.formerr{display:none;font-size:12.5px;color:var(--alert);text-align:center;margin-top:14px}
.formerr.show{display:block}
/* success / connected */
#done{display:none;text-align:center}
.tick{width:58px;height:58px;border-radius:50%;background:var(--ok-dim);border:1px solid rgba(78,204,163,.35);
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--ok);margin:0 auto 20px}
.codebox{
  margin:22px 0 6px;padding:16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--b2);
  font-family:'Playfair Display',serif;font-size:26px;letter-spacing:4px;color:var(--gold-lt);
}
.codehint{font-size:11.5px;color:var(--t3);line-height:1.6;margin-bottom:26px}
.unlink{background:none;border:none;color:var(--t3);font-family:inherit;font-size:12.5px;
  text-decoration:underline;cursor:pointer;margin-top:18px}
.unlink:hover{color:var(--alert)}
html[data-lang="he"]{direction:rtl}
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <a class="back" href="./index.html" onclick="if(history.length>1){history.back();return false;}" data-t="back">← Back</a>
    <select class="langsel" id="langsel" aria-label="Language" onchange="setLang(this.value)"></select>
  </div>

  <div class="card">
    <!-- ── FORM ─────────────────────────────── -->
    <div id="form">
      <div class="eyebrow">VIA·L</div>
      <h1 data-t="title">My guide</h1>
      <p class="intro" data-t="intro">Enter your guide's code so they can see your readings and guide you.</p>

      <label class="fld">
        <span class="lbl" data-t="code_label">Guide code</span>
        <input class="in" id="code" autocomplete="off" maxlength="20" placeholder="AB12CD">
      </label>
      <div class="specfound" id="specfound"></div>

      <label class="fld">
        <span class="lbl" data-t="email_label">Your email</span>
        <input class="in" id="email" type="email" autocomplete="email" placeholder="you@email.com">
      </label>

      <label class="fld">
        <span class="lbl"><span data-t="name_label">Your name</span> <span class="opt" data-t="name_opt">(optional)</span></span>
        <input class="in" id="name" autocomplete="name" maxlength="80">
      </label>

      <label class="consent">
        <input type="checkbox" id="consent" aria-label="Consent">
        <span id="consentText"></span>
      </label>

      <button type="button" class="btn" id="connectBtn" onclick="connect()" data-t="connect">Connect</button>
      <div class="formerr" id="formerr"></div>

      <!-- Нет кода → 15-мин знакомство (пока только uk/ru → основатель; язык спеца = язык клиента в будущем) -->
      <div id="noCode" style="display:none;margin-top:24px;border-top:1px solid var(--b1);padding-top:20px;text-align:center;">
        <p class="intro" data-t="nocode_q" style="margin-bottom:14px;">Нет кода наставника?</p>
        <a class="btn" id="bookIntro" href="https://cal.com/marynaviael/%D0%B1%D0%B5%D1%81%D0%BF%D0%BB%D0%B0%D1%82%D0%BD%D0%B0%D1%8F-%D0%BA%D0%BE%D0%BD%D1%81%D1%83%D0%BB%D1%8C%D1%82%D0%B0%D1%86%D0%B8%D1%8F" target="_blank" rel="noopener" style="display:block;text-decoration:none;text-align:center;" data-t="nocode_book">📅 Записаться на знакомство (15 мин) →</a>
      </div>
    </div>

    <!-- ── DONE / CONNECTED ─────────────────── -->
    <div id="done">
      <div class="tick">✓</div>
      <h1 id="doneTitle" data-t="ok_title">You're connected</h1>
      <p class="intro" id="doneDesc" style="margin-bottom:0"></p>
      <div class="codebox" id="doneCode" style="display:none"></div>
      <p class="codehint" id="codeHint" style="display:none" data-t="code_hint">Save this code — it's your sign‑in to the Interpreter.</p>
      <a class="btn" href="./interpreter-pro.html" style="display:block;text-decoration:none;text-align:center;margin-top:22px" data-t="open_ip">Open the Interpreter →</a>
      <button type="button" class="unlink" id="unlinkBtn" onclick="unlink()" data-t="unlink">Withdraw consent and disconnect</button>
    </div>
  </div>
</div>

let lang='en';
let specName='';   // подтверждённое имя специалиста по коду (для consent + успеха)

function tr(k){return (T[lang]&&T[lang][k]!==undefined)?T[lang][k]:(T.en[k]!==undefined?T.en[k]:k);}

function setLang(l){
  if(!T[l]) l='en';
  lang=l;
  try{localStorage.setItem('vial_lang',l);}catch(e){}
  document.documentElement.setAttribute('data-lang',l);
  document.documentElement.lang=l;
  document.getElementById('langsel').value=l;
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(T[l][k]!==undefined)el.textContent=T[l][k];});
  // блок «нет кода → 15-мин знакомство» пока только для uk/ru (специалист = основатель)
  var nc=document.getElementById('noCode');if(nc)nc.style.display=(l==='ru'||l==='uk')?'block':'none';
  renderConsent();
  // если экран «подключено» уже виден — обновим тексты с подстановкой имени
  if(document.getElementById('done').style.display==='block') refreshDone();
}

function renderConsent(){
  const el=document.getElementById('consentText');
  el.textContent = specName ? tr('consent_with').replace('{spec}',specName) : tr('consent_generic');
}

// ── язык-пикер ──
(function buildLangSel(){
  const sel=document.getElementById('langsel');
  Object.keys(LANG_NAMES).forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=LANG_NAMES[l];sel.appendChild(o);});
})();

// ── предпросмотр специалиста по коду ──
let previewTimer=null;
const codeEl=document.getElementById('code');
codeEl.addEventListener('input',()=>{
  specName='';
  document.getElementById('specfound').style.display='none';
  renderConsent();
  clearTimeout(previewTimer);
  const v=codeEl.value.trim().toUpperCase().replace(/\s+/g,'');
  if(v.length<4) return;
  previewTimer=setTimeout(()=>previewSpecialist(v),400);
});

async function previewSpecialist(ref){
  try{
    const r=await fetch(WORKER+'/specialist-by-ref?ref='+encodeURIComponent(ref));
    const d=await r.json();
    if(d&&d.ok&&d.name){
      specName=d.name;
      const box=document.getElementById('specfound');
      box.innerHTML=tr('spec_prefix')+' <b>'+esc(d.name)+'</b>';
      box.style.display='block';
      renderConsent();
    }
  }catch(e){/* тихо: подтверждение всё равно на /connect */}
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}
function showErr(msg){const el=document.getElementById('formerr');el.textContent=msg;el.classList.add('show');}

async function connect(){
  const code=codeEl.value.trim().toUpperCase().replace(/\s+/g,'');
  const email=document.getElementById('email').value.trim();
  const name=document.getElementById('name').value.trim();
  const consent=document.getElementById('consent').checked;
  const err=document.getElementById('formerr');err.classList.remove('show');
  ['code','email'].forEach(id=>document.getElementById(id).classList.remove('err'));

  if(!code){showErr(tr('err_code'));document.getElementById('code').classList.add('err');return;}
  if(!validEmail(email)){showErr(tr('err_email'));document.getElementById('email').classList.add('err');return;}
  if(!consent){showErr(tr('err_consent'));return;}

  const btn=document.getElementById('connectBtn');
  btn.disabled=true;btn.textContent=tr('connecting');
  try{
    const r=await fetch(WORKER+'/specialist/connect',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ref_code:code,email,name,consent:true})
    });
    const d=await r.json();
    if(!r.ok||!d.ok){
      btn.disabled=false;btn.textContent=tr('connect');
      showErr(d.error==='specialist_not_found'?tr('err_notfound'):tr('err_net'));
      return;
    }
    const link={code:d.code||'',name:d.specialist_name||specName||''};
    try{localStorage.setItem(LINK_KEY,JSON.stringify(link));}catch(e){}
    showDone(link,true);
  }catch(e){
    btn.disabled=false;btn.textContent=tr('connect');
    showErr(tr('err_net'));
  }
}

function showDone(link,fresh){
  specName=link.name||specName;
  document.getElementById('form').style.display='none';
  const done=document.getElementById('done');done.style.display='block';
  // свежее подключение показывает код доступа; повторный визит — только статус
  const showCode=fresh&&link.code;
  const cb=document.getElementById('doneCode'),ch=document.getElementById('codeHint');
  if(showCode){cb.textContent=link.code;cb.style.display='block';ch.style.display='block';}
  else{cb.style.display='none';ch.style.display='none';}
  window._link=link;window._fresh=fresh;
  refreshDone();
}

function refreshDone(){
  const link=window._link||{};const nm=link.name||tr('spec_prefix');
  document.getElementById('doneTitle').textContent= window._fresh ? tr('ok_title') : tr('linked_to').replace('{name}',link.name||'');
  document.getElementById('doneDesc').textContent= window._fresh
    ? tr('ok_desc').replace('{name}',link.name||'')
    : '';
  document.getElementById('unlinkBtn').textContent=tr('unlink');
}

async function unlink(){
  const link=window._link||{};
  if(!link.code){return;}
  if(!confirm(tr('unlink_confirm')))return;
  const btn=document.getElementById('unlinkBtn');btn.textContent=tr('unlinking');
  try{
    await fetch(WORKER+'/specialist/unlink',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:link.code})});
  }catch(e){/* всё равно очищаем локально */}
  try{localStorage.removeItem(LINK_KEY);}catch(e){}
  // вернуть к форме
  document.getElementById('done').style.display='none';
  document.getElementById('form').style.display='block';
  document.getElementById('connectBtn').disabled=false;
  document.getElementById('connectBtn').textContent=tr('connect');
  ['code','email','name'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('consent').checked=false;
  specName='';document.getElementById('specfound').style.display='none';
  renderConsent();
  alert(tr('unlinked'));
}

// ── init ──
codeEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('email').focus();}});
setLang((function(){try{var p=new URLSearchParams(location.search).get('lang');if(p)return p;return localStorage.getItem('vial_lang')||'en';}catch(e){return 'en';}})());
// уже подключён?
(function(){
  let link=null;try{link=JSON.parse(localStorage.getItem(LINK_KEY)||'null');}catch(e){}
  if(link&&link.code) showDone(link,false);
})();
</script>
