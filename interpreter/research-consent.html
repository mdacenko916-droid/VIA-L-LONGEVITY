/* Информированное согласие на исследовательский синк (opt-in, путь B — см.

   отложенной и общей. Ни одной ссылки наружу. 2026-08-25. */
/* Научная база VIA-L. СОБСТВЕННАЯ страница базового тарифа — НЕ копия methodology.html:
   та описывает клинические протоколы специалиста (названия состояний, добавки, дозы) и связывает

   feedback_via_l_appstore_isolation). Здесь — только принципы работы приложения и границы выводов.

:root{
  --dark:#10131A; --card:#1b2029; --t1:#F5F3EF; --t2:rgba(245,243,239,.78); --t3:rgba(245,243,239,.5);
  --gold:#C4963C; --gold-lt:#EEC77A; --beige:#EAE1C9;
  --fs-cap:13px; --fs-body:15px; --fs-title:18px; --fs-hero:24px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--beige);}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;}
.topline{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;background:var(--beige);}
.brand{font-family:'Playfair Display',serif;font-size:var(--fs-title);letter-spacing:2.5px;color:#8B6030;white-space:nowrap;}
.tl-left{display:flex;align-items:center;gap:12px;min-width:0;}
/* Крестик — тот же, что в приложении: 34px, border-box, чтобы вставать вровень с кнопкой языка.
   На my-specialist.html ✕ в своё время убрали (2026-08-25) — но та страница сама по себе вкладка,
   выход через нижнюю навигацию логичен. Здесь страница открывается ИЗ профиля, и закрыть её было
   нечем: человек упирался в текст и мог уйти только по нижней навигации. 2026-09-01. */
.x-close{width:34px;height:34px;box-sizing:border-box;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  /* Тёмный кружок, как у ✕ в самом приложении (#funnelHome): на бежевом фоне светлый крестик
     терялся. Владелец: «нужно на тёмном кружке — так его лучше видно». 2026-09-01. */
  background:rgba(16,20,28,.88);border:1px solid rgba(226,185,90,.75);color:#EEC77A;border-radius:50%;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
  font-size:var(--fs-title);line-height:1;cursor:pointer;font-family:inherit;padding:0;

.x-close:active{transform:scale(.88);}
.lang-wrap{position:relative;}

  padding:6px 14px;border-radius:50px;border:1px solid rgba(226,185,90,.5);background:#20242E;color:#EEAF54;cursor:pointer;font-family:inherit;}
.lang-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#181e28;border:1px solid rgba(226,185,90,.3);
  border-radius:14px;padding:6px;min-width:150px;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:60vh;overflow-y:auto;}
.lang-menu.open{display:block;}
.lang-opt{padding:9px 12px;border-radius:9px;color:var(--t2);font-size:var(--fs-body);cursor:pointer;}
.lang-opt:hover{background:rgba(226,185,90,.12);color:var(--t1);}
.wrap{max-width:760px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));}
h1{font-family:'Playfair Display',serif;font-size:var(--fs-hero);font-weight:500;color:#2E2010;margin:6px 0 8px;line-height:1.2;}
.sub{font-size:var(--fs-body);color:#5A4A35;line-height:1.6;margin:0 0 18px;}
.sec{background:linear-gradient(160deg,#242c39,#1b2029 60%,#181e28);border:1px solid rgba(226,185,90,.28);
  border-radius:18px;padding:18px 17px;margin-bottom:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);}
.sec h2{font-family:'Playfair Display',serif;font-size:var(--fs-title);font-weight:500;color:var(--gold-lt);margin:0 0 8px;line-height:1.25;}

.disc{font-size:var(--fs-cap);line-height:1.6;color:#5A4A35;margin:16px 2px 0;}
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:200;}
.bottom-nav{display:flex;align-items:center;justify-content:space-around;
  padding:9px 10px calc(7px + env(safe-area-inset-bottom,0px)/3);
  background:linear-gradient(180deg,#242c39,#171d27);border-top:1.5px solid rgba(238,199,122,.62);}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;letter-spacing:0;
  text-transform:uppercase;white-space:nowrap;color:var(--gold-lt);text-decoration:none;background:none;border:none;
  padding:2px 4px;border-radius:12px;cursor:pointer;
  font-family:-apple-system,'SF Pro Text',BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}   /* как в приложении — иначе бар выше, чем на вкладках */
.bottom-nav-item i{font-size:23px;}
.bottom-nav-item:not(.active){opacity:.72;}
.bottom-nav-item.active i{filter:drop-shadow(0 0 9px rgba(226,185,90,.85));}
@media (min-width:600px){
  :root{ --fs-cap:14px; --fs-body:17px; --fs-title:20px; --fs-hero:28px; }
  .bottom-nav{padding:16px 16px calc(12px + env(safe-area-inset-bottom,0px)/3);}
  .bottom-nav-item{font-size:12px;letter-spacing:.5px;gap:6px;padding:4px 12px;}
}
/* Блок управления согласием */
.rc-panel{background:linear-gradient(160deg,#2a3340,#1e2530 60%,#181e28);border:1px solid rgba(226,185,90,.4);
  border-radius:18px;padding:18px 17px;margin:16px 0 12px;}
.rc-row{display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
.rc-row input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:#C4963C;}
.rc-row span{font-size:var(--fs-body);line-height:1.6;color:var(--t1);}
.rc-state{margin-top:12px;font-size:var(--fs-cap);letter-spacing:.5px;text-transform:uppercase;color:var(--t3);}
.rc-state.on{color:#4ECCA3;}
.rc-del{margin-top:14px;background:none;border:1px solid rgba(255,255,255,.22);color:var(--t2);
  border-radius:10px;padding:10px 16px;font-size:var(--fs-cap);font-family:inherit;cursor:pointer;}
.rc-del:hover{border-color:rgba(255,120,140,.5);color:#FF98A8;}
.rc-msg{margin-top:10px;font-size:var(--fs-cap);color:var(--t3);line-height:1.5;}
</style>

<script>
// Закрытие страницы. Сначала обычный history.back(); в webview Capacitor он иногда молча не
// срабатывает — тогда через 250 мс уходим в профиль принудительно. Адрес один для веба и
// приложения: в бандле рядом лежит заглушка interpreter-via-l.html, переводящая на index.html
// с сохранением ?tab (см. app/sync-web.sh). Грабля с back описана в my-specialist.html. 2026-09-01.
function rcClose(){
  var before = location.href;
  try{ history.back(); }catch(e){}
  setTimeout(function(){
    if (location.href !== before) return;
    location.href = './interpreter-via-l.html?tab=card';
  }, 250);
}
const T = {"en": {"title": "Help improve VIA·L", "sub": "A voluntary, anonymous contribution to how the app is calibrated. Your daily numbers help it tell an ordinary fluctuation from a change worth noticing. Sharing is off by default, can be switched off at any time, and the data is never used to train AI models. Read this page before deciding.", "s1_t": "Why we ask", "s1_b": "VIA·L reads your daily numbers against your own baseline. The more real days the app has seen — across ages, cycles, sleep patterns and trackers — the better it can tell an ordinary fluctuation from a change worth noticing, and the more honestly it can be calibrated. Today that calibration rests on published studies alone; your numbers would let us check it against real life and correct what the app treats as usual.", "s2_t": "What is sent", "s2_b": "Only the numbers and choices of your day: heart-rate variability, resting pulse, sleep duration and deep sleep, blood oxygen, temperature deviation, VO₂max and readiness if your tracker provides them; your ratings of energy and sleep; hot-flush frequency and intensity; memory and mental clarity; stress and alcohol; timing of your last meal and late caffeine; home blood-pressure readings you entered; weight and waist; whether the day came from a tracker or manual entry; and the version numbers of our schema and weights.", "s3_t": "What is never sent", "s3_b": "Anything you wrote in your own words stays on your device: what brought you here, notes about events of the day, new symptoms, your questions to the assistant and the text of your overviews. Free text is what most often makes a record recognisable, so the server refuses it — the filter sits on our side and does not depend on the app being up to date. There is no account in VIA·L, so there is no name, no email and no phone number to send. Numbers that arrive through a direct Oura account connection are not included either: Oura’s API terms do not allow their data in a research set, so the server drops those readings even when sharing is on.", "s4_t": "How it stays anonymous", "s4_b": "Each installation generates a random identifier when the app first runs. It is not derived from your device, your phone number or anything about you, and it is stored only on your device. Records arrive under that identifier and nothing else. We cannot look at a row and say whose it is — and neither can we link two people, or link you to a purchase.", "s5_t": "It is voluntary", "s5_b": "The switch is off until you turn it on, and you can turn it off again at any moment — the app works exactly the same either way. Nothing is unlocked by agreeing and nothing is taken away by refusing: your overviews, your history and your subscription do not depend on this choice.", "s6_t": "You can delete your contribution", "s6_b": "«Delete my contribution» removes every record sent from this installation. Because the identifier lives only on your device, deletion can be requested only from it — so do it before you delete the app or move to a new phone, otherwise the link is gone and the anonymous rows can no longer be found. Aggregate statistics already computed are not affected: they contain no records, only counts and ranges, and there is nothing in them to take back out.", "s7_t": "Where it is stored and for how long", "s7_b": "Records go over an encrypted connection to our processing service on Cloudflare and are stored in a database there. Each record is deleted 24 months after it arrives. Deletion is automatic and rolling — record by record, on its own day, not in one batch. Once a month we compute aggregate statistics over the records we hold: how many observations, the middle value and the usual range. Those aggregates carry no identifier and no individual days, so they are kept without a time limit — calibration needs distributions, not particular days. Records are never sold, never used for advertising, and never handed to insurers or employers. If a specialist guides you in VIA·L EXPERT, that is a separate story with its own consent: this switch does not send anything to any specialist.", "s8_t": "Benefits and risks, honestly", "s8_b": "You get no personal benefit from agreeing: your own overviews do not become better or faster. The benefit is shared and comes later — a better calibrated app for people in the same period of life. The risk is small but not zero: no set of health measurements is absolutely impossible to re-identify, especially if someone already holds a matching dataset. We reduce that risk by refusing free text, by using a random identifier and by keeping the record to a fixed list of values. If that residual risk is not acceptable to you, do not turn the switch on — that is a perfectly reasonable choice.", "s9_t": "Legal basis and contact", "s9_b": "Health data is a special category, so we process it only on your explicit consent — GDPR Article 6(1)(a) together with Article 9(2)(a). Consent given here can be withdrawn at any time by turning the switch off; withdrawal does not affect processing that already happened. Questions and requests: privacy@via-l.com. This page is part of our privacy policy and is updated together with it.", "agree": "I have read this page and agree to share my anonymised daily numbers", "on": "Sharing is on", "off": "Sharing is off", "del": "Delete my contribution", "del_ok": "Deleted. Nothing from this installation is left on the server.", "del_err": "Could not reach the server. Try again later.", "del_confirm": "Delete every record sent from this device? This cannot be undone.", "nav_today": "Today", "nav_approach": "Our approach", "nav_guide": "My guide", "nav_card": "My Profile"}, "es": {"title": "Ayuda a mejorar VIA·L", "sub": "Una aportación voluntaria y anónima a la forma en que la app está calibrada. Sus cifras diarias la ayudan a distinguir una fluctuación normal de un cambio que merece atención. Está desactivado por defecto, puede desactivarse en cualquier momento y los datos nunca se usan para entrenar modelos de IA. Lea esta página antes de decidir.", "s1_t": "Por qué te lo pedimos", "s1_b": "VIA·L lee sus cifras diarias frente a su propia línea de base. Cuantos más días reales haya visto la app —en distintas edades, ciclos, patrones de sueño y dispositivos—, mejor distingue una fluctuación normal de un cambio que merece atención, y con más honestidad puede calibrarse. Hoy esa calibración se apoya solo en estudios publicados; sus cifras permitirían contrastarla con la vida real y corregir lo que la app considera habitual.", "s2_t": "Qué se envía", "s2_b": "Solo las cifras y las respuestas de tu día: variabilidad de la frecuencia cardiaca, pulso en reposo, duración del sueño y sueño profundo, oxígeno en sangre, desviación de temperatura, VO₂máx y disposición (readiness) si tu tracker los ofrece; tus valoraciones de energía y sueño; frecuencia e intensidad de los sofocos; memoria y claridad mental; estrés y alcohol; la hora de tu última comida y la cafeína tardía; las lecturas de tensión arterial en casa que hayas introducido; peso y cintura; si el día procede de un tracker o de entrada manual; y los números de versión de nuestro esquema y de los pesos.", "s3_t": "Qué no se envía nunca", "s3_b": "Todo lo que escribes con tus propias palabras se queda en tu dispositivo: qué te trajo aquí, las notas sobre los hechos del día, los síntomas nuevos, tus preguntas al asistente y el texto de tus análisis. El texto libre es lo que más a menudo hace reconocible un registro, por eso el servidor lo rechaza: el filtro está de nuestro lado y no depende de que la app esté actualizada. En VIA·L no hay cuenta, así que no hay nombre, ni correo, ni teléfono que enviar. Tampoco se incluyen los datos que llegan por conexión directa con una cuenta Oura: los términos de la API de Oura no permiten usarlos en un conjunto de investigación, así que el servidor los descarta aunque el interruptor esté activado.", "s4_t": "Cómo se mantiene el anonimato", "s4_b": "Cada instalación genera un identificador aleatorio la primera vez que se abre la app. No se deriva de tu dispositivo, ni de tu número de teléfono, ni de nada tuyo, y se guarda solo en tu dispositivo. Los registros llegan bajo ese identificador y nada más. No podemos mirar una fila y decir de quién es, ni enlazar a dos personas, ni vincularte a una compra.", "s5_t": "Es voluntario", "s5_b": "El interruptor está apagado hasta que tú lo enciendas, y puedes apagarlo de nuevo en cualquier momento: la app funciona exactamente igual en ambos casos. Aceptar no desbloquea nada y negarse no quita nada: tus análisis, tu historial y tu suscripción no dependen de esta decisión.", "s6_t": "Puedes borrar tu aportación", "s6_b": "«Eliminar mi aportación» borra todos los registros enviados desde esta instalación. Como el identificador vive solo en su dispositivo, la eliminación solo puede pedirse desde él: hágalo antes de borrar la app o cambiar de teléfono, porque después el vínculo se pierde y las filas anónimas ya no se pueden encontrar. Los resúmenes ya calculados no se ven afectados: no contienen registros, solo recuentos y rangos, y no hay nada que retirar de ellos.", "s7_t": "Dónde se guarda y durante cuánto tiempo", "s7_b": "Los registros viajan por una conexión cifrada a nuestro servicio de procesamiento en Cloudflare y se guardan en una base de datos allí. Cada registro se elimina 24 meses después de su llegada. El borrado es automático y progresivo: registro a registro, en su propio día, no todo de golpe. Una vez al mes calculamos resúmenes sobre los registros que tenemos: cuántas observaciones, el valor central y el rango habitual. Esos resúmenes no llevan identificador ni días concretos, por lo que se conservan sin límite de tiempo: la calibración necesita distribuciones, no días particulares. Los registros nunca se venden, nunca se usan para publicidad y nunca se entregan a aseguradoras ni a empleadores. Si un especialista le acompaña en VIA·L EXPERT, eso es otra historia con su propio consentimiento: este interruptor no envía nada a ningún especialista.", "s8_t": "Beneficios y riesgos, con honestidad", "s8_b": "Aceptar no te aporta ningún beneficio personal: tus análisis no serán mejores ni más rápidos. El beneficio es compartido y llega más tarde: una app mejor calibrada para personas en la misma etapa de la vida. El riesgo es pequeño, pero no es cero: ningún conjunto de mediciones de salud es absolutamente imposible de reidentificar, sobre todo si alguien ya dispone de un conjunto de datos que encaje. Reducimos ese riesgo rechazando el texto libre, usando un identificador aleatorio y limitando el registro a una lista fija de valores. Si ese riesgo residual no te resulta aceptable, no actives el interruptor: es una decisión perfectamente razonable.", "s9_t": "Base jurídica y contacto", "s9_b": "Los datos de salud son una categoría especial, por eso los tratamos únicamente con tu consentimiento explícito — artículo 6(1)(a) junto con el artículo 9(2)(a) del RGPD. El consentimiento dado aquí puede retirarse en cualquier momento apagando el interruptor; la retirada no afecta al tratamiento ya realizado. Preguntas y solicitudes: privacy@via-l.com. Esta página forma parte de nuestra política de privacidad y se actualiza junto con ella.", "agree": "He leído esta página y acepto compartir mis cifras diarias anonimizadas", "on": "Compartir está activado", "off": "Compartir está desactivado", "del": "Borrar mi aportación", "del_ok": "Borrado. No queda nada de esta instalación en el servidor.", "del_err": "No se ha podido contactar con el servidor. Inténtalo más tarde.", "del_confirm": "¿Borrar todos los registros enviados desde este dispositivo? Esta acción no se puede deshacer.", "nav_today": "Hoy", "nav_approach": "Enfoque", "nav_guide": "Mi guía", "nav_card": "Mi perfil"}, "uk": {"title": "Допомогти покращити VIA·L", "sub": "Добровільний знеособлений внесок у те, як застосунок відкалібровано. Ваші щоденні показники допомагають йому відрізняти звичайне коливання від зміни, на яку варто звернути увагу. Вимкнено за замовчуванням, вимкнути можна будь-коли, дані ніколи не використовуються для навчання ШІ-моделей. Прочитайте цю сторінку перед рішенням.", "s1_t": "Навіщо ми просимо", "s1_b": "VIA·L читає ваші показники відносно вашої ж особистої бази. Що більше реальних днів застосунок бачив — у різному віці, циклах, режимах сну й з різними трекерами, — то точніше він відрізняє звичайне коливання від зміни, на яку варто звернути увагу, і то чесніше його можна відкалібрувати. Зараз ця калібровка спирається лише на опубліковані дослідження; ваші показники дали б змогу звірити її з реальним життям і виправити те, що застосунок вважає звичайним.", "s2_t": "Що передається", "s2_b": "Лише числа й вибори вашого дня: варіабельність серцевого ритму, пульс спокою, тривалість сну та глибокий сон, кисень крові, відхилення температури, VO₂max і готовність, якщо їх дає ваш трекер; ваші оцінки енергії та сну; частота й інтенсивність припливів; пам’ять і ясність мислення; стрес та алкоголь; час останнього прийому їжі й пізній кофеїн; домашні заміри тиску, які ви внесли; вага й талія; прийшов день із трекера чи введений вручну; і номери версій нашої схеми та ваг.", "s3_t": "Що не передається ніколи", "s3_b": "Усе, що ви писали своїми словами, залишається на пристрої: з чим ви прийшли, нотатки про події дня, нові симптоми, ваші запитання раднику й тексти ваших розборів. Саме вільний текст найчастіше робить запис упізнаваним, тому сервер його не приймає — фільтр стоїть на нашому боці й не залежить від того, чи оновлено застосунок. Облікового запису у VIA·L немає взагалі, тож немає ні імені, ні пошти, ні телефону, які можна було б передати. Показники, що надходять через пряме під’єднання акаунта Oura, теж не включаються: умови API Oura не дозволяють використовувати їх у дослідницькому наборі, тому сервер відкидає ці значення навіть за увімкненого перемикача.", "s4_t": "Як це залишається знеособленим", "s4_b": "Під час першого запуску застосунок створює випадковий ідентифікатор встановлення. Він не виводиться ні з вашого пристрою, ні з номера телефону, ні з чогось про вас і зберігається лише на вашому пристрої. Записи надходять під цим ідентифікатором і жодним іншим. Ми не можемо, дивлячись на рядок, сказати, чий він, — як не можемо й пов’язати двох людей між собою чи пов’язати вас із покупкою.", "s5_t": "Це добровільно", "s5_b": "Перемикач вимкнено, доки ви його не увімкнете, і вимкнути назад можна будь-якої миті — застосунок працює однаково в обох випадках. Згода нічого не відкриває, а відмова нічого не забирає: ваші розбори, ваша історія і ваша підписка від цього вибору не залежать.", "s6_t": "Ви можете видалити свій внесок", "s6_b": "Кнопка «Видалити мій внесок» стирає всі записи, надіслані з цього встановлення. Ідентифікатор живе лише на вашому пристрої, тому видалення можна запросити тільки з нього — зробіть це до видалення застосунку чи переходу на новий телефон, інакше зв’язок втрачено й знеособлені рядки вже не знайти. Уже порахованих зведень це не стосується: у них немає записів, лише кількості та діапазони, і вилучати звідти нічого.", "s7_t": "Де зберігається і скільки", "s7_b": "Записи йдуть шифрованим з’єднанням у наш сервіс обробки на Cloudflare і зберігаються в базі там. Кожен запис видаляється через 24 місяці після надходження. Видалення автоматичне й ковзне — по одному запису, у свій день, а не разом. Раз на місяць ми рахуємо за наявними записами зведення: скільки спостережень, серединне значення і звичайний розкид. У зведеннях немає ні ідентифікатора, ні окремих днів, тому вони зберігаються без строку — калібровці потрібні розподіли, а не конкретні дні. Записи ніколи не продають, не використовують для реклами і не передають страховим компаніям чи роботодавцям. Якщо вас веде фахівець у VIA·L EXPERT — це окрема історія зі своєю згодою: цей перемикач фахівцю не надсилає нічого.", "s8_t": "Користь і ризики, чесно", "s8_b": "Особисто вам згода не дає нічого: ваші розбори не стануть кращими чи швидшими. Користь спільна й відкладена — точніше відкалібрований застосунок для людей у тому ж періоді життя. Ризик невеликий, але не нульовий: жоден набір вимірювань про здоров’я не можна вважати абсолютно невпізнаваним, особливо якщо в когось уже є зіставний масив даних. Ми знижуємо цей ризик тим, що не приймаємо вільний текст, використовуємо випадковий ідентифікатор і тримаємо запис у межах фіксованого списку значень. Якщо залишковий ризик для вас неприйнятний — не вмикайте перемикач, це цілком розумний вибір.", "s9_t": "Правова підстава і контакт", "s9_b": "Дані про здоров’я — особлива категорія, тому ми обробляємо їх лише за вашою явною згодою: GDPR Стаття 6(1)(a) разом зі Статтею 9(2)(a). Згоду, надану тут, можна відкликати будь-якої миті, вимкнувши перемикач; відкликання не стосується обробки, що вже відбулася. Питання та запити: privacy@via-l.com. Ця сторінка — частина нашої політики конфіденційності й оновлюється разом із нею.", "agree": "Я прочитав(ла) цю сторінку і згоден(на) передавати знеособлені показники моїх днів", "on": "Передавання увімкнено", "off": "Передавання вимкнено", "del": "Видалити мій внесок", "del_ok": "Видалено. З цього встановлення на сервері нічого не залишилось.", "del_err": "Не вдалося зв’язатися із сервером. Спробуйте пізніше.", "del_confirm": "Видалити всі записи, надіслані з цього пристрою? Скасувати це буде неможливо.", "nav_today": "Сьогодні", "nav_approach": "Наш підхід", "nav_guide": "Мій наставник", "nav_card": "Мій профіль"}, "ru": {"title": "Помочь улучшить VIA·L", "sub": "Добровольный обезличенный вклад в то, как приложение откалибровано. Ваши дневные показатели помогают ему отличать обычное колебание от изменения, на которое стоит обратить внимание. По умолчанию выключено, отключить можно в любой момент, данные никогда не используются для обучения ИИ-моделей. Прочитайте эту страницу перед решением.", "s1_t": "Зачем мы просим", "s1_b": "VIA·L читает ваши показатели относительно вашей же личной базы. Чем больше реальных дней приложение видело — в разных возрастах, циклах, режимах сна и с разными трекерами, — тем точнее оно отличает обычное колебание от изменения, на которое стоит обратить внимание, и тем честнее его можно откалибровать. Сейчас эта калибровка опирается только на опубликованные исследования; ваши показатели позволили бы сверить её с реальной жизнью и поправить то, что приложение считает обычным.", "s2_t": "Что передаётся", "s2_b": "Только числа и выборы вашего дня: вариабельность сердечного ритма, пульс покоя, длительность сна и глубокий сон, кислород крови, отклонение температуры, VO₂max и готовность, если их даёт ваш трекер; ваши оценки энергии и сна; частота и интенсивность приливов; память и ясность мышления; стресс и алкоголь; время последнего приёма пищи и поздний кофеин; домашние замеры давления, которые вы внесли; вес и талия; пришёл день с трекера или введён вручную; и номера версий нашей схемы и весов.", "s3_t": "Что не передаётся никогда", "s3_b": "Всё, что вы писали своими словами, остаётся на устройстве: с чем вы пришли, заметки о событиях дня, новые симптомы, ваши вопросы советнику и тексты ваших разборов. Именно свободный текст чаще всего делает запись узнаваемой, поэтому сервер его не принимает — фильтр стоит на нашей стороне и не зависит от того, обновлено ли приложение. Аккаунта в VIA·L нет вовсе, поэтому нет ни имени, ни почты, ни телефона, которые можно было бы передать. Показатели, приходящие через прямое подключение аккаунта Oura, тоже не включаются: условия API Oura не разрешают использовать их в исследовательской выборке, поэтому сервер отбрасывает эти значения даже при включённом переключателе.", "s4_t": "Как это остаётся обезличенным", "s4_b": "При первом запуске приложение создаёт случайный идентификатор установки. Он не выводится ни из вашего устройства, ни из номера телефона, ни из чего-либо о вас и хранится только на вашем устройстве. Записи приходят под этим идентификатором и больше ни под каким. Мы не можем, глядя на строку, сказать, чья она, — как не можем и связать двух людей между собой или связать вас с покупкой.", "s5_t": "Это добровольно", "s5_b": "Переключатель выключен, пока вы его не включите, и выключить обратно можно в любой момент — приложение работает одинаково в обоих случаях. Согласие ничего не открывает, а отказ ничего не отнимает: ваши разборы, ваша история и ваша подписка от этого выбора не зависят.", "s6_t": "Вы можете удалить свой вклад", "s6_b": "Кнопка «Удалить мой вклад» стирает все записи, отправленные с этой установки. Идентификатор живёт только на вашем устройстве, поэтому удаление можно запросить только с него — сделайте это до удаления приложения или перехода на новый телефон, иначе связь потеряна и обезличенные строки уже не найти. Уже посчитанных сводок это не касается: в них нет записей, только количества и диапазоны, и изымать оттуда нечего.", "s7_t": "Где хранится и сколько", "s7_b": "Записи уходят по шифрованному соединению в наш сервис обработки на Cloudflare и хранятся в базе там. Каждая запись удаляется через 24 месяца после того, как пришла. Удаление автоматическое и скользящее — по одной записи, в свой день, а не разом. Раз в месяц мы считаем по имеющимся записям сводку: сколько наблюдений, срединное значение и обычный разброс. В сводках нет ни идентификатора, ни отдельных дней, поэтому они хранятся без срока — калибровке нужны распределения, а не конкретные дни. Записи никогда не продают, не используют для рекламы и не передают страховым компаниям или работодателям. Если вас ведёт специалист в VIA·L EXPERT — это отдельная история со своим согласием: этот переключатель специалисту не отправляет ничего.", "s8_t": "Польза и риски, честно", "s8_b": "Лично вам согласие не даёт ничего: ваши разборы не станут лучше или быстрее. Польза общая и отложенная — точнее откалиброванное приложение для людей в том же периоде жизни. Риск невелик, но не нулевой: ни один набор измерений о здоровье нельзя считать абсолютно неопознаваемым, особенно если у кого-то уже есть сопоставимый массив данных. Мы снижаем этот риск тем, что не принимаем свободный текст, используем случайный идентификатор и держим запись в пределах фиксированного списка значений. Если остаточный риск для вас неприемлем — не включайте переключатель, это совершенно разумный выбор.", "s9_t": "Правовое основание и контакт", "s9_b": "Данные о здоровье — особая категория, поэтому мы обрабатываем их только с вашего явного согласия: GDPR Статья 6(1)(a) вместе со Статьёй 9(2)(a). Согласие, данное здесь, можно отозвать в любой момент, выключив переключатель; отзыв не затрагивает обработку, которая уже произошла. Вопросы и запросы: privacy@via-l.com. Эта страница — часть нашей политики конфиденциальности и обновляется вместе с ней.", "agree": "Я прочитал(а) эту страницу и согласен(на) передавать обезличенные показатели моих дней", "on": "Передача включена", "off": "Передача выключена", "del": "Удалить мой вклад", "del_ok": "Удалено. С этой установки на сервере ничего не осталось.", "del_err": "Не удалось связаться с сервером. Попробуйте позже.", "del_confirm": "Удалить все записи, отправленные с этого устройства? Отменить это будет нельзя.", "nav_today": "Сегодня", "nav_approach": "Наш подход", "nav_guide": "Мой наставник", "nav_card": "Мой профиль"}, "de": {"title": "VIA·L verbessern helfen", "sub": "Ein freiwilliger, anonymer Beitrag dazu, wie die App kalibriert ist. Ihre täglichen Werte helfen ihr, eine gewöhnliche Schwankung von einer Veränderung zu unterscheiden, die Beachtung verdient. Standardmäßig ausgeschaltet, jederzeit abschaltbar, und die Daten werden nie zum Training von KI-Modellen verwendet. Lesen Sie diese Seite, bevor Sie entscheiden.", "s1_t": "Warum wir fragen", "s1_b": "VIA·L liest Ihre täglichen Werte im Vergleich zu Ihrer eigenen Basislinie. Je mehr reale Tage die App gesehen hat — über Altersgruppen, Zyklen, Schlafmuster und Tracker hinweg —, desto besser unterscheidet sie eine gewöhnliche Schwankung von einer Veränderung, die Beachtung verdient, und desto ehrlicher lässt sie sich kalibrieren. Heute stützt sich diese Kalibrierung allein auf veröffentlichte Studien; Ihre Werte würden es erlauben, sie am realen Leben zu prüfen und zu korrigieren, was die App als üblich ansieht.", "s2_t": "Was gesendet wird", "s2_b": "Nur die Zahlen und Angaben Ihres Tages: Herzratenvariabilität, Ruhepuls, Schlafdauer und Tiefschlaf, Sauerstoffsättigung, Temperaturabweichung, VO₂max und Readiness, sofern Ihr Tracker sie liefert; Ihre Bewertungen von Energie und Schlaf; Häufigkeit und Intensität von Hitzewallungen; Gedächtnis und geistige Klarheit; Stress und Alkohol; der Zeitpunkt Ihrer letzten Mahlzeit und späten Koffeins; die von Ihnen eingetragenen Blutdruckwerte aus der Selbstmessung; Gewicht und Taillenumfang; ob der Tag von einem Tracker oder aus manueller Eingabe stammt; sowie die Versionsnummern unseres Schemas und unserer Gewichte.", "s3_t": "Was niemals gesendet wird", "s3_b": "Alles, was Sie in eigenen Worten schreiben, bleibt auf Ihrem Gerät: was Sie hergeführt hat, Notizen zu den Ereignissen des Tages, neue Symptome, Ihre Fragen an den Assistenten und der Text Ihrer Auswertungen. Freitext macht einen Datensatz am ehesten wiedererkennbar, deshalb weist der Server ihn zurück – der Filter liegt auf unserer Seite und hängt nicht davon ab, ob die App aktuell ist. In VIA·L gibt es kein Konto, also gibt es weder Namen noch E-Mail noch Telefonnummer zu senden. Auch Werte aus einer direkten Oura-Kontoverbindung sind ausgenommen: Die Oura-API-Bedingungen erlauben ihre Verwendung in einem Forschungsdatensatz nicht, daher verwirft der Server diese Messwerte selbst bei aktiviertem Schalter.", "s4_t": "Wie die Anonymität gewahrt bleibt", "s4_b": "Jede Installation erzeugt beim ersten Start eine zufällige Kennung. Sie wird nicht aus Ihrem Gerät, Ihrer Telefonnummer oder irgendetwas Persönlichem abgeleitet und liegt nur auf Ihrem Gerät. Die Datensätze treffen unter dieser Kennung ein und sonst nichts. Wir können an einer Zeile nicht ablesen, zu wem sie gehört – und ebenso wenig zwei Menschen miteinander oder Sie mit einem Kauf verknüpfen.", "s5_t": "Es ist freiwillig", "s5_b": "Der Schalter ist aus, bis Sie ihn einschalten, und Sie können ihn jederzeit wieder ausschalten – die App funktioniert in beiden Fällen genau gleich. Eine Zustimmung schaltet nichts frei, eine Ablehnung nimmt nichts weg: Ihre Auswertungen, Ihr Verlauf und Ihr Abo hängen von dieser Entscheidung nicht ab.", "s6_t": "Sie können Ihren Beitrag löschen", "s6_b": "«Meinen Beitrag löschen» entfernt jeden von dieser Installation gesendeten Datensatz. Da die Kennung nur auf Ihrem Gerät lebt, kann die Löschung nur von dort verlangt werden — tun Sie es, bevor Sie die App löschen oder das Telefon wechseln, sonst ist die Verbindung fort und die anonymen Zeilen sind nicht mehr auffindbar. Bereits berechnete Auswertungen sind nicht betroffen: Sie enthalten keine Datensätze, nur Anzahlen und Spannen, und es gibt darin nichts zurückzunehmen.", "s7_t": "Wo und wie lange gespeichert wird", "s7_b": "Die Datensätze gehen über eine verschlüsselte Verbindung an unseren Verarbeitungsdienst bei Cloudflare und werden dort in einer Datenbank gespeichert. Jeder Datensatz wird 24 Monate nach seinem Eingang gelöscht. Die Löschung ist automatisch und gleitend — Datensatz für Datensatz, an seinem eigenen Tag, nicht in einem Schwung. Einmal im Monat berechnen wir Auswertungen über die vorhandenen Datensätze: wie viele Beobachtungen, den mittleren Wert und die übliche Spanne. Diese Auswertungen tragen keine Kennung und keine einzelnen Tage, deshalb werden sie ohne zeitliche Begrenzung aufbewahrt — die Kalibrierung braucht Verteilungen, nicht einzelne Tage. Datensätze werden nie verkauft, nie für Werbung genutzt und nie an Versicherer oder Arbeitgeber weitergegeben. Wenn Sie eine Fachkraft in VIA·L EXPERT begleitet, ist das eine eigene Sache mit eigener Einwilligung: Dieser Schalter sendet nichts an eine Fachkraft.", "s8_t": "Nutzen und Risiken, ehrlich benannt", "s8_b": "Für Sie persönlich bringt die Zustimmung keinen Vorteil: Ihre eigenen Auswertungen werden dadurch weder besser noch schneller. Der Nutzen ist gemeinsam und kommt später – eine besser kalibrierte App für Menschen in derselben Lebensphase. Das Risiko ist klein, aber nicht null: keine Sammlung von Gesundheitsmesswerten ist absolut sicher vor einer Re-Identifizierung, besonders wenn jemand bereits über einen passenden Datenbestand verfügt. Wir senken dieses Risiko, indem wir Freitext zurückweisen, eine zufällige Kennung verwenden und den Datensatz auf eine feste Liste von Werten beschränken. Wenn Ihnen dieses Restrisiko nicht annehmbar erscheint, schalten Sie den Schalter nicht ein – das ist eine völlig vernünftige Entscheidung.", "s9_t": "Rechtsgrundlage und Kontakt", "s9_b": "Gesundheitsdaten sind eine besondere Kategorie, deshalb verarbeiten wir sie ausschließlich auf Grundlage Ihrer ausdrücklichen Einwilligung – Art. 6 Abs. 1 lit. a in Verbindung mit Art. 9 Abs. 2 lit. a DSGVO. Die hier erteilte Einwilligung können Sie jederzeit widerrufen, indem Sie den Schalter ausschalten; der Widerruf berührt die bereits erfolgte Verarbeitung nicht. Fragen und Anliegen: privacy@via-l.com. Diese Seite ist Teil unserer Datenschutzerklärung und wird gemeinsam mit ihr aktualisiert.", "agree": "Ich habe diese Seite gelesen und stimme zu, meine anonymisierten Tageswerte zu teilen", "on": "Teilen ist eingeschaltet", "off": "Teilen ist ausgeschaltet", "del": "Meinen Beitrag löschen", "del_ok": "Gelöscht. Von dieser Installation ist nichts mehr auf dem Server.", "del_err": "Der Server war nicht erreichbar. Bitte später erneut versuchen.", "del_confirm": "Alle von diesem Gerät gesendeten Datensätze löschen? Das lässt sich nicht rückgängig machen.", "nav_today": "Heute", "nav_approach": "Ansatz", "nav_guide": "Mein Begleiter", "nav_card": "Mein Profil"}, "pt": {"title": "Ajude a melhorar o VIA·L", "sub": "Uma contribuição voluntária e anónima para a forma como o app é calibrado. Os seus números diários ajudam-no a distinguir uma flutuação comum de uma mudança que merece atenção. Está desligado por padrão, pode ser desligado a qualquer momento, e os dados nunca são usados para treinar modelos de IA. Leia esta página antes de decidir.", "s1_t": "Por que pedimos", "s1_b": "O VIA·L lê os seus números diários em relação à sua própria linha de base. Quanto mais dias reais o app tiver visto — em diferentes idades, ciclos, padrões de sono e dispositivos —, melhor distingue uma flutuação comum de uma mudança que merece atenção, e mais honestamente pode ser calibrado. Hoje essa calibração apoia-se apenas em estudos publicados; os seus números permitiriam confrontá-la com a vida real e corrigir o que o app considera habitual.", "s2_t": "O que é enviado", "s2_b": "Somente os números e as respostas do seu dia: variabilidade da frequência cardíaca, pulso em repouso, duração do sono e sono profundo, oxigênio no sangue, desvio de temperatura, VO₂máx e prontidão (readiness) se o seu tracker os fornecer; as suas avaliações de energia e sono; frequência e intensidade das ondas de calor; memória e clareza mental; estresse e álcool; o horário da última refeição e da cafeína tardia; as medições de pressão arterial em casa que você inseriu; peso e cintura; se o dia veio de um tracker ou de entrada manual; e os números de versão do nosso esquema e dos pesos.", "s3_t": "O que nunca é enviado", "s3_b": "Tudo o que você escreve com as suas próprias palavras fica no seu aparelho: o que o trouxe até aqui, as anotações sobre os acontecimentos do dia, sintomas novos, as suas perguntas ao assistente e o texto das suas análises. O texto livre é o que mais frequentemente torna um registro reconhecível, por isso o servidor o recusa — o filtro está do nosso lado e não depende de o app estar atualizado. No VIA·L não existe conta, portanto não há nome, e-mail nem telefone a enviar. Também não entram os números vindos de uma conexão direta com a conta Oura: os termos da API da Oura não permitem seu uso em um conjunto de pesquisa, então o servidor descarta essas leituras mesmo com o compartilhamento ligado.", "s4_t": "Como o anonimato se mantém", "s4_b": "Cada instalação gera um identificador aleatório na primeira vez que o app é aberto. Ele não deriva do seu aparelho, do seu número de telefone nem de nada seu, e fica guardado somente no seu aparelho. Os registros chegam sob esse identificador e nada mais. Não conseguimos olhar para uma linha e dizer de quem ela é — nem ligar duas pessoas entre si, nem ligar você a uma compra.", "s5_t": "É voluntário", "s5_b": "A chave fica desligada até você ligá-la, e você pode desligá-la de novo a qualquer momento — o app funciona exatamente igual nos dois casos. Concordar não libera nada e recusar não tira nada: as suas análises, o seu histórico e a sua assinatura não dependem desta escolha.", "s6_t": "Você pode apagar a sua contribuição", "s6_b": "«Excluir minha contribuição» remove todos os registros enviados desta instalação. Como o identificador vive apenas no seu dispositivo, a exclusão só pode ser pedida a partir dele — faça isso antes de excluir o app ou mudar de telefone, senão o vínculo se perde e as linhas anónimas já não podem ser encontradas. Os resumos já calculados não são afetados: não contêm registros, apenas contagens e intervalos, e não há neles nada a retirar.", "s7_t": "Onde fica guardado e por quanto tempo", "s7_b": "Os registros seguem por uma ligação encriptada até o nosso serviço de processamento na Cloudflare e ficam guardados numa base de dados ali. Cada registro é excluído 24 meses após a sua chegada. A exclusão é automática e progressiva — registro a registro, no seu próprio dia, e não de uma só vez. Uma vez por mês calculamos resumos sobre os registros que temos: quantas observações, o valor central e o intervalo habitual. Esses resumos não têm identificador nem dias individuais, por isso são mantidos sem prazo — a calibração precisa de distribuições, não de dias específicos. Os registros nunca são vendidos, nunca usados para publicidade e nunca entregues a seguradoras ou empregadores. Se um especialista o acompanha no VIA·L EXPERT, isso é outra história com o seu próprio consentimento: este interruptor não envia nada a nenhum especialista.", "s8_t": "Benefícios e riscos, com honestidade", "s8_b": "Concordar não traz nenhum benefício pessoal para você: as suas próprias análises não ficam melhores nem mais rápidas. O benefício é coletivo e vem depois — um app mais bem calibrado para pessoas na mesma fase da vida. O risco é pequeno, mas não é zero: nenhum conjunto de medições de saúde é absolutamente impossível de reidentificar, sobretudo se alguém já tiver em mãos um conjunto de dados correspondente. Reduzimos esse risco recusando texto livre, usando um identificador aleatório e limitando o registro a uma lista fixa de valores. Se esse risco residual não lhe parecer aceitável, não ligue a chave — é uma escolha perfeitamente razoável.", "s9_t": "Base legal e contato", "s9_b": "Dados de saúde são uma categoria especial, por isso os tratamos somente com o seu consentimento explícito — artigo 6(1)(a) em conjunto com o artigo 9(2)(a) do RGPD. O consentimento dado aqui pode ser retirado a qualquer momento desligando a chave; a retirada não afeta o tratamento já realizado. Dúvidas e solicitações: privacy@via-l.com. Esta página faz parte da nossa política de privacidade e é atualizada junto com ela.", "agree": "Li esta página e concordo em compartilhar os meus números diários anonimizados", "on": "Compartilhamento ligado", "off": "Compartilhamento desligado", "del": "Apagar minha contribuição", "del_ok": "Apagado. Não resta nada desta instalação no servidor.", "del_err": "Não foi possível falar com o servidor. Tente mais tarde.", "del_confirm": "Apagar todos os registros enviados deste aparelho? Isso não pode ser desfeito.", "nav_today": "Hoje", "nav_approach": "Abordagem", "nav_guide": "Meu guia", "nav_card": "Meu perfil"}, "fr": {"title": "Aider à améliorer VIA·L", "sub": "Une contribution volontaire et anonyme à la façon dont l’application est calibrée. Vos chiffres quotidiens l’aident à distinguer une fluctuation ordinaire d’un changement qui mérite attention. Désactivé par défaut, désactivable à tout moment, et les données ne servent jamais à entraîner des modèles d’IA. Lisez cette page avant de décider.", "s1_t": "Pourquoi nous le demandons", "s1_b": "VIA·L lit vos chiffres quotidiens par rapport à votre propre référence. Plus l’application a vu de journées réelles — à travers les âges, les cycles, les rythmes de sommeil et les capteurs —, mieux elle distingue une fluctuation ordinaire d’un changement qui mérite attention, et plus honnêtement elle peut être calibrée. Aujourd’hui, ce calibrage repose uniquement sur des études publiées ; vos chiffres permettraient de le confronter à la vie réelle et de corriger ce que l’application tient pour habituel.", "s2_t": "Ce qui est envoyé", "s2_b": "Uniquement les chiffres et les réponses de votre journée : variabilité de la fréquence cardiaque, pouls au repos, durée du sommeil et sommeil profond, oxygène sanguin, écart de température, VO₂max et readiness si votre tracker les fournit ; vos évaluations d’énergie et de sommeil ; la fréquence et l’intensité des bouffées de chaleur ; la mémoire et la clarté mentale ; le stress et l’alcool ; l’heure de votre dernier repas et de la caféine tardive ; les mesures de tension artérielle à domicile que vous avez saisies ; le poids et le tour de taille ; si la journée provient d’un tracker ou d’une saisie manuelle ; et les numéros de version de notre schéma et de nos pondérations.", "s3_t": "Ce qui n’est jamais envoyé", "s3_b": "Tout ce que vous écrivez avec vos propres mots reste sur votre appareil : ce qui vous a amené ici, les notes sur les événements de la journée, les nouveaux symptômes, vos questions à l’assistant et le texte de vos analyses. Le texte libre est ce qui rend le plus souvent un enregistrement reconnaissable ; c’est pourquoi le serveur le refuse — le filtre se trouve de notre côté et ne dépend pas de la mise à jour de l’application. Il n’y a pas de compte dans VIA·L : il n’y a donc ni nom, ni e-mail, ni numéro de téléphone à envoyer. Les données provenant d’une connexion directe au compte Oura sont également exclues : les conditions de l’API Oura n’autorisent pas leur usage dans un jeu de recherche, le serveur les écarte donc même si le partage est activé.", "s4_t": "Comment l’anonymat est préservé", "s4_b": "Chaque installation génère un identifiant aléatoire au premier lancement. Il n’est dérivé ni de votre appareil, ni de votre numéro de téléphone, ni de quoi que ce soit qui vous concerne, et il n’est conservé que sur votre appareil. Les enregistrements arrivent sous cet identifiant et rien d’autre. Nous ne pouvons pas regarder une ligne et dire à qui elle appartient — ni relier deux personnes entre elles, ni vous relier à un achat.", "s5_t": "C’est volontaire", "s5_b": "L’interrupteur est éteint tant que vous ne l’allumez pas, et vous pouvez l’éteindre à tout moment — l’application fonctionne exactement de la même façon dans les deux cas. Accepter ne débloque rien et refuser n’enlève rien : vos analyses, votre historique et votre abonnement ne dépendent pas de ce choix.", "s6_t": "Vous pouvez supprimer votre contribution", "s6_b": "« Supprimer ma contribution » efface tous les enregistrements envoyés depuis cette installation. Comme l’identifiant ne vit que sur votre appareil, la suppression ne peut être demandée que depuis lui — faites-le avant de supprimer l’application ou de changer de téléphone, sinon le lien est perdu et les lignes anonymes deviennent introuvables. Les synthèses déjà calculées ne sont pas concernées : elles ne contiennent aucun enregistrement, seulement des effectifs et des intervalles, et il n’y a rien à en retirer.", "s7_t": "Où et combien de temps c’est conservé", "s7_b": "Les enregistrements transitent par une connexion chiffrée vers notre service de traitement chez Cloudflare et y sont conservés dans une base de données. Chaque enregistrement est supprimé 24 mois après son arrivée. La suppression est automatique et glissante — enregistrement par enregistrement, à sa propre date, et non en une seule fois. Une fois par mois, nous calculons des synthèses sur les enregistrements détenus : combien d’observations, la valeur médiane et l’intervalle habituel. Ces synthèses ne portent ni identifiant ni journées individuelles, elles sont donc conservées sans limite de durée — le calibrage a besoin de distributions, pas de journées particulières. Les enregistrements ne sont jamais vendus, jamais utilisés pour la publicité et jamais remis à des assureurs ou à des employeurs. Si un spécialiste vous accompagne dans VIA·L EXPERT, c’est une autre histoire avec son propre consentement : cet interrupteur n’envoie rien à aucun spécialiste.", "s8_t": "Bénéfices et risques, honnêtement", "s8_b": "Accepter ne vous apporte aucun bénéfice personnel : vos propres analyses n’en deviennent ni meilleures ni plus rapides. Le bénéfice est collectif et arrive plus tard — une application mieux calibrée pour les personnes qui traversent la même période de vie. Le risque est faible mais non nul : aucun ensemble de mesures de santé n’est absolument impossible à ré-identifier, surtout si quelqu’un dispose déjà d’un jeu de données correspondant. Nous réduisons ce risque en refusant le texte libre, en utilisant un identifiant aléatoire et en limitant l’enregistrement à une liste fixe de valeurs. Si ce risque résiduel ne vous paraît pas acceptable, n’activez pas l’interrupteur — c’est un choix parfaitement raisonnable.", "s9_t": "Base légale et contact", "s9_b": "Les données de santé constituent une catégorie particulière : nous ne les traitons donc que sur la base de votre consentement explicite — article 6(1)(a) combiné à l’article 9(2)(a) du RGPD. Le consentement donné ici peut être retiré à tout moment en éteignant l’interrupteur ; le retrait n’affecte pas le traitement déjà effectué. Questions et demandes : privacy@via-l.com. Cette page fait partie de notre politique de confidentialité et est mise à jour en même temps qu’elle.", "agree": "J’ai lu cette page et j’accepte de partager mes chiffres quotidiens anonymisés", "on": "Le partage est activé", "off": "Le partage est désactivé", "del": "Supprimer ma contribution", "del_ok": "Supprimé. Il ne reste rien de cette installation sur le serveur.", "del_err": "Le serveur est injoignable. Réessayez plus tard.", "del_confirm": "Supprimer tous les enregistrements envoyés depuis cet appareil ? Cette action est irréversible.", "nav_today": "Aujourd'hui", "nav_approach": "Approche", "nav_guide": "Mon guide", "nav_card": "Mon profil"}, "pl": {"title": "Pomóż ulepszyć VIA·L", "sub": "Dobrowolny, anonimowy wkład w to, jak aplikacja jest skalibrowana. Twoje dzienne wartości pomagają jej odróżnić zwykłe wahanie od zmiany wartej uwagi. Domyślnie wyłączone, można wyłączyć w każdej chwili, a dane nigdy nie służą do trenowania modeli SI. Przeczytaj tę stronę przed decyzją.", "s1_t": "Dlaczego o to prosimy", "s1_b": "VIA·L czyta Twoje dzienne wartości względem Twojej własnej bazy. Im więcej realnych dni aplikacja zobaczyła — w różnym wieku, cyklach, rytmach snu i z różnymi urządzeniami — tym lepiej odróżnia zwykłe wahanie od zmiany wartej uwagi i tym uczciwiej można ją skalibrować. Dziś ta kalibracja opiera się wyłącznie na opublikowanych badaniach; Twoje wartości pozwoliłyby zestawić ją z realnym życiem i poprawić to, co aplikacja uznaje za zwykłe.", "s2_t": "Co jest wysyłane", "s2_b": "Tylko liczby i odpowiedzi z Twojego dnia: zmienność rytmu serca, tętno spoczynkowe, długość snu i sen głęboki, natlenienie krwi, odchylenie temperatury, VO₂max i gotowość (readiness), jeśli Twój tracker je podaje; Twoje oceny energii i snu; częstość i nasilenie uderzeń gorąca; pamięć i jasność umysłu; stres i alkohol; porę ostatniego posiłku i późnej kofeiny; domowe pomiary ciśnienia, które wpisałeś(-aś); wagę i obwód talii; to, czy dzień pochodzi z trackera, czy z ręcznego wpisu; oraz numery wersji naszego schematu i wag.", "s3_t": "Czego nie wysyłamy nigdy", "s3_b": "Wszystko, co piszesz własnymi słowami, zostaje na Twoim urządzeniu: co Cię tu przywiodło, notatki o wydarzeniach dnia, nowe objawy, Twoje pytania do asystenta i tekst Twoich analiz. To swobodny tekst najczęściej czyni zapis rozpoznawalnym, dlatego serwer go odrzuca — filtr stoi po naszej stronie i nie zależy od tego, czy aplikacja jest aktualna. W VIA·L nie ma konta, więc nie ma imienia, adresu e-mail ani numeru telefonu do wysłania. Nie trafiają tu również dane z bezpośredniego połączenia z kontem Oura: warunki API Oura nie pozwalają używać ich w zbiorze badawczym, więc serwer odrzuca te odczyty nawet przy włączonym przełączniku.", "s4_t": "Jak zachowana jest anonimowość", "s4_b": "Każda instalacja tworzy losowy identyfikator przy pierwszym uruchomieniu. Nie wywodzi się on z Twojego urządzenia, numeru telefonu ani niczego, co Cię dotyczy, i przechowywany jest wyłącznie na Twoim urządzeniu. Zapisy trafiają do nas pod tym identyfikatorem i niczym więcej. Nie potrafimy spojrzeć na wiersz i powiedzieć, czyj on jest — ani powiązać dwóch osób ze sobą, ani powiązać Ciebie z zakupem.", "s5_t": "To dobrowolne", "s5_b": "Przełącznik jest wyłączony, dopóki go nie włączysz, i możesz go wyłączyć w każdej chwili — aplikacja działa dokładnie tak samo w obu przypadkach. Zgoda niczego nie odblokowuje, a odmowa niczego nie zabiera: Twoje analizy, historia i subskrypcja nie zależą od tego wyboru.", "s6_t": "Możesz usunąć swój wkład", "s6_b": "„Usuń mój wkład” kasuje wszystkie rekordy wysłane z tej instalacji. Ponieważ identyfikator żyje tylko na Twoim urządzeniu, usunięcia można zażądać wyłącznie z niego — zrób to przed usunięciem aplikacji lub zmianą telefonu, inaczej powiązanie znika i anonimowych wierszy nie da się już odnaleźć. Już policzonych zestawień to nie dotyczy: nie zawierają rekordów, tylko liczebności i zakresy, i nie ma z nich czego wycofywać.", "s7_t": "Gdzie i jak długo są przechowywane", "s7_b": "Rekordy idą szyfrowanym połączeniem do naszej usługi przetwarzania w Cloudflare i są tam przechowywane w bazie danych. Każdy rekord jest usuwany 24 miesiące po nadejściu. Usuwanie jest automatyczne i przesuwające się — rekord po rekordzie, w swoim dniu, a nie wszystkie naraz. Raz w miesiącu liczymy zestawienia z posiadanych rekordów: ile obserwacji, wartość środkową i typowy rozrzut. Zestawienia nie zawierają ani identyfikatora, ani pojedynczych dni, dlatego przechowujemy je bezterminowo — kalibracja potrzebuje rozkładów, a nie konkretnych dni. Rekordów nigdy nie sprzedajemy, nie używamy do reklam i nie przekazujemy ubezpieczycielom ani pracodawcom. Jeśli prowadzi Cię specjalista w VIA·L EXPERT, to osobna sprawa z własną zgodą: ten przełącznik nie wysyła specjaliście niczego.", "s8_t": "Korzyści i ryzyka, uczciwie", "s8_b": "Zgoda nie daje Ci osobistej korzyści: Twoje własne analizy nie stają się przez nią ani lepsze, ani szybsze. Korzyść jest wspólna i przychodzi później — lepiej skalibrowana aplikacja dla osób w tym samym okresie życia. Ryzyko jest małe, ale nie zerowe: żadnego zbioru pomiarów zdrowotnych nie da się uznać za absolutnie niemożliwy do ponownej identyfikacji, zwłaszcza gdy ktoś dysponuje już pasującym zbiorem danych. Zmniejszamy to ryzyko, odrzucając swobodny tekst, używając losowego identyfikatora i ograniczając zapis do stałej listy wartości. Jeśli to resztkowe ryzyko nie jest dla Ciebie do przyjęcia, nie włączaj przełącznika — to całkowicie rozsądny wybór.", "s9_t": "Podstawa prawna i kontakt", "s9_b": "Dane o zdrowiu to szczególna kategoria, dlatego przetwarzamy je wyłącznie na podstawie Twojej wyraźnej zgody — art. 6 ust. 1 lit. a w związku z art. 9 ust. 2 lit. a RODO. Udzieloną tu zgodę możesz wycofać w każdej chwili, wyłączając przełącznik; wycofanie nie wpływa na przetwarzanie, które już się odbyło. Pytania i wnioski: privacy@via-l.com. Ta strona jest częścią naszej polityki prywatności i jest aktualizowana razem z nią.", "agree": "Przeczytałem(-am) tę stronę i zgadzam się udostępniać moje zanonimizowane dzienne liczby", "on": "Udostępnianie włączone", "off": "Udostępnianie wyłączone", "del": "Usuń mój wkład", "del_ok": "Usunięto. Z tej instalacji nie zostało na serwerze nic.", "del_err": "Nie udało się połączyć z serwerem. Spróbuj później.", "del_confirm": "Usunąć wszystkie zapisy wysłane z tego urządzenia? Tego nie da się cofnąć.", "nav_today": "Dziś", "nav_approach": "Podejście", "nav_guide": "Mój przewodnik", "nav_card": "Mój profil"}, "it": {"title": "Aiuta a migliorare VIA·L", "sub": "Un contributo volontario e anonimo al modo in cui l’app è calibrata. I tuoi numeri quotidiani la aiutano a distinguere una fluttuazione ordinaria da un cambiamento che merita attenzione. È disattivato per impostazione predefinita, puoi disattivarlo in qualsiasi momento e i dati non vengono mai usati per addestrare modelli di IA. Leggi questa pagina prima di decidere.", "s1_t": "Perché te lo chiediamo", "s1_b": "VIA·L legge i tuoi numeri quotidiani rispetto alla tua base personale. Più giorni reali l’app ha visto — tra età, cicli, ritmi di sonno e dispositivi diversi — meglio distingue una fluttuazione ordinaria da un cambiamento che merita attenzione, e più onestamente può essere calibrata. Oggi questa calibrazione poggia solo su studi pubblicati; i tuoi numeri permetterebbero di confrontarla con la vita reale e correggere ciò che l’app considera abituale.", "s2_t": "Che cosa viene inviato", "s2_b": "Solo i numeri e le risposte della tua giornata: variabilità della frequenza cardiaca, battito a riposo, durata del sonno e sonno profondo, ossigeno nel sangue, scostamento della temperatura, VO₂max e readiness se il tuo tracker li fornisce; le tue valutazioni di energia e sonno; frequenza e intensità delle vampate; memoria e lucidità mentale; stress e alcol; l’orario dell’ultimo pasto e della caffeina serale; i valori di pressione misurati a casa che hai inserito; peso e girovita; se la giornata proviene da un tracker o da inserimento manuale; e i numeri di versione del nostro schema e dei pesi.", "s3_t": "Che cosa non viene mai inviato", "s3_b": "Tutto ciò che scrivi con parole tue resta sul tuo dispositivo: che cosa ti ha portato qui, le note sugli eventi della giornata, i sintomi nuovi, le tue domande all’assistente e il testo delle tue analisi. Il testo libero è ciò che più spesso rende riconoscibile un record, perciò il server lo rifiuta — il filtro sta dalla nostra parte e non dipende dal fatto che l’app sia aggiornata. In VIA·L non esiste un account, quindi non c’è nome, né e-mail, né numero di telefono da inviare. Non rientrano nemmeno i dati che arrivano da un collegamento diretto all’account Oura: i termini dell’API di Oura non ne consentono l’uso in un set di ricerca, quindi il server li scarta anche a condivisione attiva.", "s4_t": "Come resta anonimo", "s4_b": "Ogni installazione genera un identificatore casuale al primo avvio. Non deriva dal tuo dispositivo, dal tuo numero di telefono o da qualcosa che ti riguarda, ed è conservato solo sul tuo dispositivo. I record arrivano sotto quell’identificatore e nient’altro. Non possiamo guardare una riga e dire di chi è — né collegare due persone tra loro, né collegare te a un acquisto.", "s5_t": "È volontario", "s5_b": "L’interruttore è spento finché non lo accendi, e puoi spegnerlo di nuovo in qualsiasi momento: l’app funziona esattamente allo stesso modo in entrambi i casi. Acconsentire non sblocca nulla e rifiutare non toglie nulla: le tue analisi, la tua cronologia e il tuo abbonamento non dipendono da questa scelta.", "s6_t": "Puoi cancellare il tuo contributo", "s6_b": "«Elimina il mio contributo» cancella tutti i record inviati da questa installazione. Poiché l’identificatore vive solo sul tuo dispositivo, la cancellazione può essere richiesta solo da lì — fallo prima di eliminare l’app o cambiare telefono, altrimenti il collegamento è perso e le righe anonime non si possono più trovare. I riepiloghi già calcolati non sono interessati: non contengono record, solo conteggi e intervalli, e non c’è nulla da ritirare.", "s7_t": "Dove vengono conservati e per quanto", "s7_b": "I record viaggiano su una connessione cifrata verso il nostro servizio di elaborazione su Cloudflare e sono conservati lì in un database. Ogni record viene eliminato 24 mesi dopo il suo arrivo. La cancellazione è automatica e progressiva — record per record, nel proprio giorno, non tutti insieme. Una volta al mese calcoliamo riepiloghi sui record che abbiamo: quante osservazioni, il valore centrale e l’intervallo abituale. Questi riepiloghi non portano identificatori né giorni singoli, perciò sono conservati senza limite di tempo: la calibrazione ha bisogno di distribuzioni, non di giorni particolari. I record non vengono mai venduti, mai usati per pubblicità e mai consegnati ad assicuratori o datori di lavoro. Se un professionista ti segue in VIA·L EXPERT, è una storia a parte con il proprio consenso: questo interruttore non invia nulla a nessun professionista.", "s8_t": "Benefici e rischi, con onestà", "s8_b": "Acconsentire non ti porta alcun beneficio personale: le tue analisi non diventano né migliori né più veloci. Il beneficio è comune e arriva dopo — un’app calibrata meglio per chi attraversa lo stesso periodo della vita. Il rischio è piccolo ma non nullo: nessun insieme di misure di salute è assolutamente impossibile da re-identificare, soprattutto se qualcuno dispone già di un insieme di dati corrispondente. Riduciamo quel rischio rifiutando il testo libero, usando un identificatore casuale e limitando il record a un elenco fisso di valori. Se questo rischio residuo non ti sembra accettabile, non accendere l’interruttore: è una scelta del tutto ragionevole.", "s9_t": "Base giuridica e contatti", "s9_b": "I dati sulla salute sono una categoria particolare, perciò li trattiamo solo con il tuo consenso esplicito — articolo 6(1)(a) in combinato disposto con l’articolo 9(2)(a) del GDPR. Il consenso prestato qui può essere revocato in qualsiasi momento spegnendo l’interruttore; la revoca non pregiudica il trattamento già avvenuto. Domande e richieste: privacy@via-l.com. Questa pagina fa parte della nostra informativa sulla privacy e viene aggiornata insieme a essa.", "agree": "Ho letto questa pagina e acconsento a condividere i miei numeri quotidiani anonimizzati", "on": "Condivisione attiva", "off": "Condivisione disattivata", "del": "Cancella il mio contributo", "del_ok": "Cancellato. Sul server non resta nulla di questa installazione.", "del_err": "Non è stato possibile raggiungere il server. Riprova più tardi.", "del_confirm": "Cancellare tutti i record inviati da questo dispositivo? L’operazione non è reversibile.", "nav_today": "Oggi", "nav_approach": "Approccio", "nav_guide": "La mia guida", "nav_card": "Il mio profilo"}, "he": {"title": "לעזור לשפר את VIA·L", "sub": "תרומה התנדבותית ואנונימית לאופן שבו האפליקציה מכוילת. המספרים היומיים שלכם עוזרים לה להבחין בין תנודה רגילה לבין שינוי שראוי לשים לב אליו. כבוי כברירת מחדל, אפשר לכבות בכל רגע, והנתונים לעולם אינם משמשים לאימון מודלי בינה מלאכותית. קראו את הדף הזה לפני שתחליטו.", "s1_t": "למה אנחנו מבקשים", "s1_b": "VIA·L קוראת את המספרים היומיים שלכם ביחס לבסיס האישי שלכם. ככל שהאפליקציה ראתה יותר ימים אמיתיים — בגילים, מחזורים, דפוסי שינה ומכשירים שונים — כך היא מבחינה טוב יותר בין תנודה רגילה לשינוי שראוי לשים לב אליו, וכך אפשר לכייל אותה בכנות רבה יותר. כיום הכיול נשען על מחקרים שפורסמו בלבד; המספרים שלכם יאפשרו להשוות אותו לחיים האמיתיים ולתקן את מה שהאפליקציה מחשיבה כרגיל.", "s2_t": "מה נשלח", "s2_b": "רק המספרים והתשובות של היום שלכם: שונות קצב הלב, דופק במנוחה, משך השינה ושינה עמוקה, ריווי חמצן בדם, סטיית טמפרטורה, VO₂max ומוכנות (readiness) אם מכשיר המעקב שלכם מספק אותם; הדירוגים שלכם לאנרגיה ולשינה; תדירות גלי החום ועוצמתם; זיכרון וצלילות מחשבתית; מתח ואלכוהול; שעת הארוחה האחרונה וקפאין מאוחר; מדידות לחץ דם ביתיות שהזנתם; משקל והיקף מותניים; האם היום הגיע ממכשיר מעקב או מהזנה ידנית; ומספרי הגרסה של הסכימה ושל המשקלים שלנו.", "s3_t": "מה לעולם לא נשלח", "s3_b": "כל מה שכתבתם במילים שלכם נשאר במכשיר שלכם: מה הביא אתכם לכאן, הערות על אירועי היום, תסמינים חדשים, השאלות שלכם לעוזר והטקסט של הניתוחים שלכם. טקסט חופשי הוא מה שהופך רשומה לזיהוי לרוב, ולכן השרת מסרב לקבל אותו — המסנן נמצא בצד שלנו ואינו תלוי בכך שהאפליקציה מעודכנת. ב-VIA·L אין חשבון, ולכן אין שם, אין דוא\"ל ואין מספר טלפון לשלוח. גם נתונים שמגיעים מחיבור ישיר לחשבון Oura אינם נכללים: תנאי ה-API של Oura אינם מתירים שימוש בהם במאגר מחקרי, ולכן השרת מסלק אותם גם כשהשיתוף פעיל.", "s4_t": "איך נשמרת האנונימיות", "s4_b": "כל התקנה יוצרת מזהה אקראי בהפעלה הראשונה. הוא אינו נגזר מהמכשיר שלכם, ממספר הטלפון שלכם או מכל דבר שקשור אליכם, והוא נשמר רק במכשיר שלכם. הרשומות מגיעות תחת המזהה הזה ותו לא. איננו יכולים להסתכל בשורה ולומר של מי היא — ואיננו יכולים לקשר בין שני אנשים או לקשר אתכם לרכישה.", "s5_t": "זה בהתנדבות", "s5_b": "המתג כבוי עד שתדליקו אותו, ואפשר לכבות אותו בחזרה בכל רגע — האפליקציה עובדת בדיוק אותו הדבר כך או כך. הסכמה אינה פותחת שום דבר וסירוב אינו לוקח שום דבר: הניתוחים שלכם, ההיסטוריה שלכם והמנוי שלכם אינם תלויים בבחירה הזאת.", "s6_t": "אפשר למחוק את התרומה שלכם", "s6_b": "«מחיקת התרומה שלי» מוחקת כל רשומה שנשלחה מהתקנה זו. המזהה חי רק במכשיר שלכם, ולכן אפשר לבקש מחיקה רק ממנו — עשו זאת לפני מחיקת האפליקציה או מעבר לטלפון חדש, אחרת הקשר אובד ואי אפשר עוד למצוא את השורות האנונימיות. סיכומים שכבר חושבו אינם מושפעים: אין בהם רשומות, רק ספירות וטווחים, ואין ממה לחזור בהם.", "s7_t": "היכן נשמר ולכמה זמן", "s7_b": "הרשומות עוברות בחיבור מוצפן אל שירות העיבוד שלנו ב-Cloudflare ונשמרות שם במסד נתונים. כל רשומה נמחקת 24 חודשים לאחר הגעתה. המחיקה אוטומטית ומתגלגלת — רשומה אחר רשומה, ביום שלה, ולא בבת אחת. פעם בחודש אנו מחשבים סיכומים על הרשומות שברשותנו: כמה תצפיות, הערך האמצעי והטווח הרגיל. בסיכומים אין מזהה ואין ימים בודדים, ולכן הם נשמרים ללא הגבלת זמן — הכיול זקוק להתפלגויות, לא לימים מסוימים. הרשומות לעולם אינן נמכרות, אינן משמשות לפרסום ואינן נמסרות לחברות ביטוח או למעסיקים. אם מלווה אתכם מומחה ב-VIA·L EXPERT, זהו עניין נפרד עם הסכמה משלו: המתג הזה אינו שולח דבר לאף מומחה.", "s8_t": "תועלת וסיכון, בכנות", "s8_b": "ההסכמה אינה מביאה לכם תועלת אישית: הניתוחים שלכם לא ייעשו טובים או מהירים יותר. התועלת משותפת ומגיעה מאוחר יותר — אפליקציה מכוילת טוב יותר עבור אנשים באותה תקופת חיים. הסיכון קטן אך אינו אפס: שום אוסף של מדדי בריאות אינו בלתי ניתן לזיהוי מחדש באופן מוחלט, בייחוד אם למישהו כבר יש מאגר נתונים תואם. אנחנו מקטינים את הסיכון הזה בכך שאנו מסרבים לטקסט חופשי, משתמשים במזהה אקראי ומגבילים את הרשומה לרשימה קבועה של ערכים. אם הסיכון השיורי הזה אינו מקובל עליכם, אל תדליקו את המתג — זו בחירה סבירה לחלוטין.", "s9_t": "בסיס חוקי ויצירת קשר", "s9_b": "נתוני בריאות הם קטגוריה מיוחדת, ולכן אנו מעבדים אותם רק על סמך הסכמתכם המפורשת — סעיף 6(1)(a) יחד עם סעיף 9(2)(a) ל-GDPR. את ההסכמה שניתנה כאן אפשר לבטל בכל עת על ידי כיבוי המתג; הביטול אינו משפיע על עיבוד שכבר בוצע. שאלות ובקשות: privacy@via-l.com. העמוד הזה הוא חלק ממדיניות הפרטיות שלנו ומתעדכן יחד איתה.", "agree": "קראתי את העמוד הזה ואני מסכים/ה לשתף את המספרים היומיים שלי באופן אנונימי", "on": "השיתוף פעיל", "off": "השיתוף כבוי", "del": "מחיקת התרומה שלי", "del_ok": "נמחק. לא נשאר בשרת דבר מההתקנה הזאת.", "del_err": "לא הצלחנו להגיע לשרת. נסו שוב מאוחר יותר.", "del_confirm": "למחוק כל רשומה שנשלחה מהמכשיר הזה? אי אפשר לבטל את הפעולה.", "nav_today": "היום", "nav_approach": "הגישה שלנו", "nav_guide": "המלווה שלי", "nav_card": "הפרופיל שלי"}, "ja": {"title": "VIA·L の改善に協力する", "sub": "アプリの調整（キャリブレーション）への、任意で匿名の協力です。あなたの毎日の数値は、通常の揺らぎと注意に値する変化とを見分ける助けになります。初期設定はオフで、いつでもオフにでき、データがAIモデルの学習に使われることはありません。決める前にこのページをお読みください。", "s1_t": "お願いする理由", "s1_b": "VIA·L はあなたの毎日の数値を、あなた自身のベースラインと照らして読みます。年齢、周期、睡眠のパターン、トラッカーの違いを超えて、実際の日数を多く見ているほど、通常の揺らぎと注意に値する変化を見分けやすくなり、より誠実に調整できます。現在この調整は公表された研究だけに依拠しています。あなたの数値があれば、それを実生活と照らし合わせ、アプリが「いつも通り」とみなす範囲を正すことができます。", "s2_t": "送られるもの", "s2_b": "送られるのはその日の数値と選択だけです。心拍変動、安静時脈拍、睡眠時間と深い睡眠、血中酸素、体温の偏差、VO₂max とレディネス（トラッカーが対応している場合）、エネルギーと睡眠の自己評価、ほてりの回数と強さ、記憶と頭の冴え、ストレスと飲酒、最後の食事の時刻と遅い時間のカフェイン、ご自身で入力した家庭血圧の測定値、体重と腹囲、その日がトラッカー由来か手入力かの別、そして当社のスキーマと重み付けのバージョン番号です。", "s3_t": "決して送られないもの", "s3_b": "ご自身の言葉で書いたものはすべて端末に残ります。ここに来たきっかけ、その日の出来事のメモ、新しい症状、アシスタントへの質問、分析結果の本文などです。自由記述こそ記録を特定しやすくするものなので、サーバー側で受け取りを拒否します。フィルターは当社側にあり、アプリが最新かどうかに左右されません。VIA·L にはアカウントがないため、送るべき氏名もメールアドレスも電話番号も存在しません。 Oura アカウントとの直接連携から届く数値も対象外です。Oura の API 規約が研究用データセットでの利用を認めていないため、共有がオンでもサーバー側で破棄されます。", "s4_t": "匿名性が保たれるしくみ", "s4_b": "インストールごとに、初回起動時にランダムな識別子が作られます。端末や電話番号、その他あなたに関する情報から導かれるものではなく、端末の中だけに保存されます。記録はその識別子のみを伴って届きます。当社は一行を見て誰のものかを言うことはできず、二人を結びつけることも、あなたと購入履歴を結びつけることもできません。", "s5_t": "任意です", "s5_b": "スイッチはあなたが入れるまでオフのままで、いつでも切り直せます。どちらでもアプリの動作はまったく変わりません。同意しても何かが開放されることはなく、断っても何かが失われることはありません。分析も履歴もサブスクリプションも、この選択に左右されません。", "s6_t": "提供した分は削除できます", "s6_b": "「協力データを削除」は、この端末から送られたすべての記録を削除します。識別子はあなたの端末にしか存在しないため、削除の要求はその端末からしかできません。アプリを削除する前、または機種変更の前に行ってください。そうしないと結び付きが失われ、匿名の行を見つけられなくなります。すでに計算された集計は影響を受けません。そこには記録はなく、件数と範囲だけがあり、取り戻すものがありません。", "s7_t": "保管場所と保管期間", "s7_b": "記録は暗号化された通信で Cloudflare 上の処理サービスに送られ、そこのデータベースに保管されます。各記録は到着から24か月後に削除されます。削除は自動かつ順次で、まとめてではなく一件ずつ、その日が来たときに行われます。月に一度、保有している記録から集計を計算します。観測数、中央の値、通常の範囲です。集計には識別子も個々の日付も含まれないため、期限なく保管します。調整に必要なのは分布であって、特定の日ではないからです。記録が販売されること、広告に使われること、保険会社や雇用主に渡されることは決してありません。VIA·L EXPERT で専門家の伴走を受けている場合は、別の同意による別の話です。このスイッチは専門家には何も送りません。", "s8_t": "利点とリスクを正直に", "s8_b": "同意してもあなた個人に利点はありません。ご自身の分析が良くなることも速くなることもありません。利点は共有されるもので、後から訪れます。同じ時期を生きる人々のために、よりよく較正されたアプリになるということです。リスクは小さいものの、ゼロではありません。健康の測定値の集まりで、再識別が絶対に不可能なものは存在しません。とくに、対応するデータをすでに持っている相手がいる場合はそうです。当社は自由記述を受け取らないこと、ランダムな識別子を使うこと、記録を決まった項目に限ることで、このリスクを下げています。この残余のリスクが受け入れがたいと感じるなら、スイッチは入れないでください。それはまったく理にかなった選択です。", "s9_t": "法的根拠と連絡先", "s9_b": "健康データは特別な種類の個人データであるため、当社はあなたの明示的な同意に基づいてのみ取り扱います（GDPR 第6条1項(a) および第9条2項(a)）。ここでの同意はスイッチを切ることでいつでも撤回できます。撤回は、それまでに行われた処理には影響しません。ご質問・ご依頼は privacy@via-l.com へ。このページは当社プライバシーポリシーの一部であり、ポリシーと同時に更新されます。"   lang = T[l] ? l : 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang==='he') ? 'rtl' : 'ltr';   // иврит: как в самом приложении
  document.querySelectorAll('[data-t]').forEach(function(el){
    const v = tr(el.getAttribute('data-t'));
    if (v) el.textContent = v;
  });
  document.getElementById('langBtn').textContent = lang.toUpperCase();
  rcRender();
  try{ localStorage.setItem('selectedLang', lang); }catch(e){}
}
function toggleLang(){ document.getElementById('langMenu').classList.toggle('open'); }
// Согласие живёт в том же ключе, что читает приложение (_researchConsent → vialp_research_consent).
function rcOn(){ try{ return localStorage.getItem('vialp_research_consent')==='1'; }catch(e){ return false; } }
function rcRender(){
  const on = rcOn();
  document.getElementById('rcAgree').checked = on;
  const st = document.getElementById('rcState');
  st.textContent = on ? tr('on') : tr('off');
  st.classList.toggle('on', on);
}
function rcToggle(on){
  try{ localStorage.setItem('vialp_research_consent', on ? '1' : '0'); }catch(e){}
  document.getElementById('rcMsg').textContent = '';
  rcRender();
}
// Удаление вклада: pid живёт только на устройстве, поэтому запросить удаление может лишь оно.
async function rcForget(){
  let pid=''; try{ pid=localStorage.getItem('vialp_pid')||''; }catch(e){}
  const msg=document.getElementById('rcMsg');
  if(!pid){ msg.textContent = tr('del_ok'); return; }
  if(!confirm(tr('del_confirm'))) return;
  try{
    const r = await fetch(API+'/research/forget', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid:pid})});
    const j = await r.json();
    msg.textContent = (j&&j.ok) ? tr('del_ok') : tr('del_err');
  }catch(e){ msg.textContent = tr('del_err'); }
}
(function(){
  const m = document.getElementById('langMenu');
  LANG_ORDER.filter(function(l){ return T[l]; }).forEach(function(l){
    const d = document.createElement('div');
    d.className='lang-opt'; d.textContent = LANG_NAMES[l] || l;
    d.onclick = function(){ applyLang(l); m.classList.remove('open'); };
    m.appendChild(d);
  });
  document.addEventListener('click', function(e){ if(!e.target.closest('.lang-wrap')) m.classList.remove('open'); });
  applyLang(lang);
})();
</script>
