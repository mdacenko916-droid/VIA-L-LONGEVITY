:root{
  --dark:#10131A; --card:#1b2029; --t1:#F5F3EF; --t2:rgba(245,243,239,.78); --t3:rgba(245,243,239,.5);
  --gold:#C4963C; --gold-lt:#EEC77A; --beige:#EAE1C9;
  --fs-cap:13px; --fs-body:15px; --fs-title:18px; --fs-hero:24px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--beige);}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;}
.topline{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;background:var(--beige);}
.brand{font-family:'Playfair Display',serif;font-size:var(--fs-title);letter-spacing:2.5px;color:#8B6030;white-space:nowrap;}
.lang-wrap{position:relative;}
.lang-btn{display:flex;align-items:center;gap:6px;font-size:var(--fs-cap);letter-spacing:2px;text-transform:uppercase;
  padding:6px 14px;border-radius:50px;border:1px solid rgba(226,185,90,.5);background:#20242E;color:#EEAF54;cursor:pointer;font-family:inherit;}
.lang-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#181e28;border:1px solid rgba(226,185,90,.3);
  border-radius:14px;padding:6px;min-width:150px;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:60vh;overflow-y:auto;}
.lang-menu.open{display:block;}
.lang-opt{padding:9px 12px;border-radius:9px;color:var(--t2);font-size:var(--fs-body);cursor:pointer;}
.lang-opt:hover{background:rgba(226,185,90,.12);color:var(--t1);}
.wrap{max-width:760px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));}
h1{font-family:'Playfair Display',serif;font-size:var(--fs-hero);font-weight:500;color:#2E2010;margin:6px 0 8px;line-height:1.2;}
.sub{font-size:var(--fs-body);color:#5A4A35;line-height:1.6;margin:0 0 18px;}
.sec{background:linear-gradient(160deg,#242c39,#1b2029 60%,#181e28);border:1px solid rgba(226,185,90,.28);
  border-radius:18px;padding:18px 17px;margin-bottom:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);}
.sec h2{font-family:'Playfair Display',serif;font-size:var(--fs-title);font-weight:500;color:var(--gold-lt);margin:0 0 8px;line-height:1.25;}
.sec p{font-size:var(--fs-body);line-height:1.72;color:var(--t2);margin:0;}
.disc{font-size:var(--fs-cap);line-height:1.6;color:#5A4A35;margin:16px 2px 0;}
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:200;}
.bottom-nav{display:flex;align-items:center;justify-content:space-around;
  padding:9px 10px calc(7px + env(safe-area-inset-bottom,0px)/3);
  background:linear-gradient(180deg,#242c39,#171d27);border-top:1.5px solid rgba(238,199,122,.62);}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;letter-spacing:0;
  text-transform:uppercase;white-space:nowrap;color:var(--gold-lt);text-decoration:none;background:none;border:none;
  padding:2px 4px;border-radius:12px;cursor:pointer;
  font-family:-apple-system,'SF Pro Text',BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}   /* как в приложении — иначе бар выше, чем на вкладках */
.bottom-nav-item i{font-size:23px;}
.bottom-nav-item:not(.active){opacity:.72;}
.bottom-nav-item.active i{filter:drop-shadow(0 0 9px rgba(226,185,90,.85));}
@media (min-width:600px){
  :root{ --fs-cap:14px; --fs-body:17px; --fs-title:20px; --fs-hero:28px; }
  .bottom-nav{padding:16px 16px calc(12px + env(safe-area-inset-bottom,0px)/3);}
  .bottom-nav-item{font-size:12px;letter-spacing:.5px;gap:6px;padding:4px 12px;}
}
/* Блок управления согласием */
.rc-panel{background:linear-gradient(160deg,#2a3340,#1e2530 60%,#181e28);border:1px solid rgba(226,185,90,.4);
  border-radius:18px;padding:18px 17px;margin:16px 0 12px;}
.rc-row{display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
.rc-row input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:#C4963C;}
.rc-row span{font-size:var(--fs-body);line-height:1.6;color:var(--t1);}
.rc-state{margin-top:12px;font-size:var(--fs-cap);letter-spacing:.5px;text-transform:uppercase;color:var(--t3);}
.rc-state.on{color:#4ECCA3;}
.rc-del{margin-top:14px;background:none;border:1px solid rgba(255,255,255,.22);color:var(--t2);
  border-radius:10px;padding:10px 16px;font-size:var(--fs-cap);font-family:inherit;cursor:pointer;}
.rc-del:hover{border-color:rgba(255,120,140,.5);color:#FF98A8;}
.rc-msg{margin-top:10px;font-size:var(--fs-cap);color:var(--t3);line-height:1.5;}

<script>
const T = {"en": {"title": "Help improve VIA·L", "sub": "An optional way to contribute your anonymised daily numbers so the app can learn on real data. Off by default. Read this page before deciding.", "s1_t": "Why we ask", "s1_b": "VIA·L reads your daily numbers against your own baseline. The more real days the app has seen — across ages, cycles, sleep patterns and trackers — the better it can tell an ordinary fluctuation from a change worth noticing, and the more honestly it can be calibrated. Today that calibration rests on published research alone; your data would let us check it against real life and publish what we learn.", "s2_t": "What is sent", "s2_b": "Only the numbers and choices of your day: heart-rate variability, resting pulse, sleep duration and deep sleep, blood oxygen, temperature deviation, VO₂max and readiness if your tracker provides them; your ratings of energy and sleep; hot-flush frequency and intensity; memory and mental clarity; stress and alcohol; timing of your last meal and late caffeine; home blood-pressure readings you entered; weight and waist; whether the day came from a tracker or manual entry; and the version numbers of our schema and weights.", "s3_t": "What is never sent", "s3_b": "Anything you wrote in your own words stays on your device: what brought you here, notes about events of the day, new symptoms, your questions to the assistant and the text of your overviews. Free text is what most often makes a record recognisable, so the server refuses it — the filter sits on our side and does not depend on the app being up to date. There is no account in VIA·L, so there is no name, no email and no phone number to send.", "s4_t": "How it stays anonymous", "s4_b": "Each installation generates a random identifier when the app first runs. It is not derived from your device, your phone number or anything about you, and it is stored only on your device. Records arrive under that identifier and nothing else. We cannot look at a row and say whose it is — and neither can we link two people, or link you to a purchase.", "s5_t": "It is voluntary", "s5_b": "The switch is off until you turn it on, and you can turn it off again at any moment — the app works exactly the same either way. Nothing is unlocked by agreeing and nothing is taken away by refusing: your overviews, your history and your subscription do not depend on this choice.", "s6_t": "You can delete your contribution", "s6_b": "«Delete my contribution» removes every record sent from this installation. Because the identifier lives only on your device, deletion can be requested only from it — so do it before you delete the app or move to a new phone, otherwise the link is gone and the anonymous rows can no longer be found. Records already included in a published aggregate result cannot be pulled back out of that result.", "s7_t": "Where it is stored and for how long", "s7_b": "Records go over an encrypted connection to our processing service on Cloudflare and are stored in a database there. They are kept for as long as the research they serve — that is, without a fixed end date — because a calibration set loses its meaning if it is erased on a schedule. They are never sold, never used for advertising, and never handed to insurers or employers. If a specialist guides you in VIA·L EXPERT, that is a separate story with its own consent: this switch does not send anything to any specialist.", "s8_t": "Benefits and risks, honestly", "s8_b": "You get no personal benefit from agreeing: your own overviews do not become better or faster. The benefit is shared and comes later — a better calibrated app for people in the same period of life. The risk is small but not zero: no set of health measurements is absolutely impossible to re-identify, especially if someone already holds a matching dataset. We reduce that risk by refusing free text, by using a random identifier and by keeping the record to a fixed list of values. If that residual risk is not acceptable to you, do not turn the switch on — that is a perfectly reasonable choice.", "s9_t": "Legal basis and contact", "s9_b": "Health data is a special category, so we process it only on your explicit consent — GDPR Article 6(1)(a) together with Article 9(2)(a). Consent given here can be withdrawn at any time by turning the switch off; withdrawal does not affect processing that already happened. Questions and requests: privacy@via-l.com. This page is part of our privacy policy and is updated together with it.", "agree": "I have read this page and agree to share my anonymised daily numbers", "on": "Sharing is on", "off": "Sharing is off", "del": "Delete my contribution", "del_ok": "Deleted. Nothing from this installation is left on the server.", "del_err": "Could not reach the server. Try again later.", "del_confirm": "Delete every record sent from this device? This cannot be undone.", "nav_today": "Today", "nav_approach": "Our approach", "nav_guide": "My guide", "nav_card": "My Profile"}, "es": {"title": "Ayuda a mejorar VIA·L", "sub": "Una forma opcional de aportar tus cifras diarias anonimizadas para que la app aprenda con datos reales. Desactivado por defecto. Lee esta página antes de decidir.", "s1_t": "Por qué te lo pedimos", "s1_b": "VIA·L lee tus cifras diarias comparándolas con tu propia línea de base. Cuantos más días reales haya visto la app —de distintas edades, ciclos, patrones de sueño y trackers—, mejor distingue una fluctuación normal de un cambio que merece atención, y con más honestidad puede calibrarse. Hoy esa calibración se apoya únicamente en la investigación publicada; tus datos nos permitirían contrastarla con la vida real y publicar lo que aprendamos.", "s2_t": "Qué se envía", "s2_b": "Solo las cifras y las respuestas de tu día: variabilidad de la frecuencia cardiaca, pulso en reposo, duración del sueño y sueño profundo, oxígeno en sangre, desviación de temperatura, VO₂máx y disposición (readiness) si tu tracker los ofrece; tus valoraciones de energía y sueño; frecuencia e intensidad de los sofocos; memoria y claridad mental; estrés y alcohol; la hora de tu última comida y la cafeína tardía; las lecturas de tensión arterial en casa que hayas introducido; peso y cintura; si el día procede de un tracker o de entrada manual; y los números de versión de nuestro esquema y de los pesos.", "s3_t": "Qué no se envía nunca", "s3_b": "Todo lo que escribes con tus propias palabras se queda en tu dispositivo: qué te trajo aquí, las notas sobre los hechos del día, los síntomas nuevos, tus preguntas al asistente y el texto de tus análisis. El texto libre es lo que más a menudo hace reconocible un registro, por eso el servidor lo rechaza: el filtro está de nuestro lado y no depende de que la app esté actualizada. En VIA·L no hay cuenta, así que no hay nombre, ni correo, ni teléfono que enviar.", "s4_t": "Cómo se mantiene el anonimato", "s4_b": "Cada instalación genera un identificador aleatorio la primera vez que se abre la app. No se deriva de tu dispositivo, ni de tu número de teléfono, ni de nada tuyo, y se guarda solo en tu dispositivo. Los registros llegan bajo ese identificador y nada más. No podemos mirar una fila y decir de quién es, ni enlazar a dos personas, ni vincularte a una compra.", "s5_t": "Es voluntario", "s5_b": "El interruptor está apagado hasta que tú lo enciendas, y puedes apagarlo de nuevo en cualquier momento: la app funciona exactamente igual en ambos casos. Aceptar no desbloquea nada y negarse no quita nada: tus análisis, tu historial y tu suscripción no dependen de esta decisión.", "s6_t": "Puedes borrar tu aportación", "s6_b": "«Borrar mi aportación» elimina todos los registros enviados desde esta instalación. Como el identificador vive solo en tu dispositivo, el borrado solo puede pedirse desde él: hazlo antes de desinstalar la app o de cambiar de teléfono, porque después el vínculo desaparece y las filas anónimas ya no se pueden localizar. Los registros que ya formen parte de un resultado agregado publicado no pueden extraerse de ese resultado.", "s7_t": "Dónde se guarda y durante cuánto tiempo", "s7_b": "Los registros viajan por una conexión cifrada hasta nuestro servicio de procesamiento en Cloudflare y se guardan allí en una base de datos. Se conservan mientras dure la investigación a la que sirven, es decir, sin fecha final fija, porque un conjunto de calibración pierde su sentido si se borra por calendario. Nunca se venden, nunca se usan con fines publicitarios y nunca se entregan a aseguradoras ni a empleadores. Si un especialista te acompaña en VIA·L EXPERT, eso es algo aparte y tiene su propio consentimiento: este interruptor no envía nada a ningún especialista.", "s8_t": "Beneficios y riesgos, con honestidad", "s8_b": "Aceptar no te aporta ningún beneficio personal: tus análisis no serán mejores ni más rápidos. El beneficio es compartido y llega más tarde: una app mejor calibrada para personas en la misma etapa de la vida. El riesgo es pequeño, pero no es cero: ningún conjunto de mediciones de salud es absolutamente imposible de reidentificar, sobre todo si alguien ya dispone de un conjunto de datos que encaje. Reducimos ese riesgo rechazando el texto libre, usando un identificador aleatorio y limitando el registro a una lista fija de valores. Si ese riesgo residual no te resulta aceptable, no actives el interruptor: es una decisión perfectamente razonable.", "s9_t": "Base jurídica y contacto", "s9_b": "Los datos de salud son una categoría especial, por eso los tratamos únicamente con tu consentimiento explícito — artículo 6(1)(a) junto con el artículo 9(2)(a) del RGPD. El consentimiento dado aquí puede retirarse en cualquier momento apagando el interruptor; la retirada no afecta al tratamiento ya realizado. Preguntas y solicitudes: privacy@via-l.com. Esta página forma parte de nuestra política de privacidad y se actualiza junto con ella.", "agree": "He leído esta página y acepto compartir mis cifras diarias anonimizadas", "on": "Compartir está activado", "off": "Compartir está desactivado", "del": "Borrar mi aportación", "del_ok": "Borrado. No queda nada de esta instalación en el servidor.", "del_err": "No se ha podido contactar con el servidor. Inténtalo más tarde.", "del_confirm": "¿Borrar todos los registros enviados desde este dispositivo? Esta acción no se puede deshacer.", "nav_today": "Hoy", "nav_approach": "Enfoque", "nav_guide": "Mi guía", "nav_card": "Mi perfil"}, "uk": {"title": "Допомогти покращити VIA·L", "sub": "Необов’язкова можливість передавати знеособлені показники ваших днів, щоб застосунок навчався на реальних даних. За замовчуванням вимкнено. Прочитайте цю сторінку, перш ніж вирішувати.", "s1_t": "Навіщо ми просимо", "s1_b": "VIA·L читає ваші показники відносно вашої ж особистої бази. Що більше реальних днів застосунок бачив — у різному віці, циклах, режимах сну й з різними трекерами, — то точніше він відрізняє звичайне коливання від зміни, на яку варто звернути увагу, і то чесніше його можна відкалібрувати. Зараз ця калібровка спирається лише на опубліковані дослідження; ваші дані дали б змогу звірити її з реальним життям і опублікувати результат.", "s2_t": "Що передається", "s2_b": "Лише числа й вибори вашого дня: варіабельність серцевого ритму, пульс спокою, тривалість сну та глибокий сон, кисень крові, відхилення температури, VO₂max і готовність, якщо їх дає ваш трекер; ваші оцінки енергії та сну; частота й інтенсивність припливів; пам’ять і ясність мислення; стрес та алкоголь; час останнього прийому їжі й пізній кофеїн; домашні заміри тиску, які ви внесли; вага й талія; прийшов день із трекера чи введений вручну; і номери версій нашої схеми та ваг.", "s3_t": "Що не передається ніколи", "s3_b": "Усе, що ви писали своїми словами, залишається на пристрої: з чим ви прийшли, нотатки про події дня, нові симптоми, ваші запитання раднику й тексти ваших розборів. Саме вільний текст найчастіше робить запис упізнаваним, тому сервер його не приймає — фільтр стоїть на нашому боці й не залежить від того, чи оновлено застосунок. Облікового запису у VIA·L немає взагалі, тож немає ні імені, ні пошти, ні телефону, які можна було б передати.", "s4_t": "Як це залишається знеособленим", "s4_b": "Під час першого запуску застосунок створює випадковий ідентифікатор встановлення. Він не виводиться ні з вашого пристрою, ні з номера телефону, ні з чогось про вас і зберігається лише на вашому пристрої. Записи надходять під цим ідентифікатором і жодним іншим. Ми не можемо, дивлячись на рядок, сказати, чий він, — як не можемо й пов’язати двох людей між собою чи пов’язати вас із покупкою.", "s5_t": "Це добровільно", "s5_b": "Перемикач вимкнено, доки ви його не увімкнете, і вимкнути назад можна будь-якої миті — застосунок працює однаково в обох випадках. Згода нічого не відкриває, а відмова нічого не забирає: ваші розбори, ваша історія і ваша підписка від цього вибору не залежать.", "s6_t": "Ви можете видалити свій внесок", "s6_b": "Кнопка «Видалити мій внесок» стирає всі записи, надіслані з цього встановлення. Ідентифікатор живе лише на вашому пристрої, тому видалення можна запросити тільки з нього — зробіть це до видалення застосунку чи переходу на новий телефон, інакше зв’язок втрачено й знеособлені рядки вже не знайти. Записи, що потрапили в опублікований зведений результат, із цього результату не вилучаються.", "s7_t": "Де зберігається і скільки", "s7_b": "Записи йдуть шифрованим з’єднанням у наш сервіс обробки на Cloudflare і зберігаються в базі там. Ми тримаємо їх стільки, скільки живе дослідження, заради якого вони зібрані, — тобто без наперед призначеної дати видалення: калібрувальна вибірка втрачає сенс, якщо стирати її за розкладом. Їх ніколи не продають, не використовують для реклами і не передають страховим компаніям чи роботодавцям. Якщо вас веде фахівець у VIA·L EXPERT — це окрема історія зі своєю згодою: цей перемикач фахівцю не надсилає нічого.", "s8_t": "Користь і ризики, чесно", "s8_b": "Особисто вам згода не дає нічого: ваші розбори не стануть кращими чи швидшими. Користь спільна й відкладена — точніше відкалібрований застосунок для людей у тому ж періоді життя. Ризик невеликий, але не нульовий: жоден набір вимірювань про здоров’я не можна вважати абсолютно невпізнаваним, особливо якщо в когось уже є зіставний масив даних. Ми знижуємо цей ризик тим, що не приймаємо вільний текст, використовуємо випадковий ідентифікатор і тримаємо запис у межах фіксованого списку значень. Якщо залишковий ризик для вас неприйнятний — не вмикайте перемикач, це цілком розумний вибір.", "s9_t": "Правова підстава і контакт", "s9_b": "Дані про здоров’я — особлива категорія, тому ми обробляємо їх лише за вашою явною згодою: GDPR Стаття 6(1)(a) разом зі Статтею 9(2)(a). Згоду, надану тут, можна відкликати будь-якої миті, вимкнувши перемикач; відкликання не стосується обробки, що вже відбулася. Питання та запити: privacy@via-l.com. Ця сторінка — частина нашої політики конфіденційності й оновлюється разом із нею.", "agree": "Я прочитав(ла) цю сторінку і згоден(на) передавати знеособлені показники моїх днів", "on": "Передавання увімкнено", "off": "Передавання вимкнено", "del": "Видалити мій внесок", "del_ok": "Видалено. З цього встановлення на сервері нічого не залишилось.", "del_err": "Не вдалося зв’язатися із сервером. Спробуйте пізніше.", "del_confirm": "Видалити всі записи, надіслані з цього пристрою? Скасувати це буде неможливо.", "nav_today": "Сьогодні", "nav_approach": "Наш підхід", "nav_guide": "Мій наставник", "nav_card": "Мій профіль"}, "ru": {"title": "Помочь улучшить VIA·L", "sub": "Необязательная возможность передавать обезличенные показатели ваших дней, чтобы приложение училось на реальных данных. По умолчанию выключено. Прочитайте эту страницу, прежде чем решать.", "s1_t": "Зачем мы просим", "s1_b": "VIA·L читает ваши показатели относительно вашей же личной базы. Чем больше реальных дней приложение видело — в разных возрастах, циклах, режимах сна и с разными трекерами, — тем точнее оно отличает обычное колебание от изменения, на которое стоит обратить внимание, и тем честнее его можно откалибровать. Сейчас эта калибровка опирается только на опубликованные исследования; ваши данные позволили бы сверить её с реальной жизнью и опубликовать результат.", "s2_t": "Что передаётся", "s2_b": "Только числа и выборы вашего дня: вариабельность сердечного ритма, пульс покоя, длительность сна и глубокий сон, кислород крови, отклонение температуры, VO₂max и готовность, если их даёт ваш трекер; ваши оценки энергии и сна; частота и интенсивность приливов; память и ясность мышления; стресс и алкоголь; время последнего приёма пищи и поздний кофеин; домашние замеры давления, которые вы внесли; вес и талия; пришёл день с трекера или введён вручную; и номера версий нашей схемы и весов.", "s3_t": "Что не передаётся никогда", "s3_b": "Всё, что вы писали своими словами, остаётся на устройстве: с чем вы пришли, заметки о событиях дня, новые симптомы, ваши вопросы советнику и тексты ваших разборов. Именно свободный текст чаще всего делает запись узнаваемой, поэтому сервер его не принимает — фильтр стоит на нашей стороне и не зависит от того, обновлено ли приложение. Аккаунта в VIA·L нет вовсе, поэтому нет ни имени, ни почты, ни телефона, которые можно было бы передать.", "s4_t": "Как это остаётся обезличенным", "s4_b": "При первом запуске приложение создаёт случайный идентификатор установки. Он не выводится ни из вашего устройства, ни из номера телефона, ни из чего-либо о вас и хранится только на вашем устройстве. Записи приходят под этим идентификатором и больше ни под каким. Мы не можем, глядя на строку, сказать, чья она, — как не можем и связать двух людей между собой или связать вас с покупкой.", "s5_t": "Это добровольно", "s5_b": "Переключатель выключен, пока вы его не включите, и выключить обратно можно в любой момент — приложение работает одинаково в обоих случаях. Согласие ничего не открывает, а отказ ничего не отнимает: ваши разборы, ваша история и ваша подписка от этого выбора не зависят.", "s6_t": "Вы можете удалить свой вклад", "s6_b": "Кнопка «Удалить мой вклад» стирает все записи, отправленные с этой установки. Идентификатор живёт только на вашем устройстве, поэтому удаление можно запросить только с него — сделайте это до удаления приложения или перехода на новый телефон, иначе связь потеряна и обезличенные строки уже не найти. Записи, попавшие в опубликованный сводный результат, из этого результата не изымаются.", "s7_t": "Где хранится и сколько", "s7_b": "Записи уходят по шифрованному соединению в наш сервис обработки на Cloudflare и хранятся в базе там. Мы держим их столько, сколько живёт исследование, ради которого они собраны, — то есть без заранее назначенной даты удаления: калибровочная выборка теряет смысл, если стирать её по расписанию. Их никогда не продают, не используют для рекламы и не передают страховым компаниям или работодателям. Если вас ведёт специалист в VIA·L EXPERT — это отдельная история со своим согласием: этот переключатель специалисту не отправляет ничего.", "s8_t": "Польза и риски, честно", "s8_b": "Лично вам согласие не даёт ничего: ваши разборы не станут лучше или быстрее. Польза общая и отложенная — точнее откалиброванное приложение для людей в том же периоде жизни. Риск невелик, но не нулевой: ни один набор измерений о здоровье нельзя считать абсолютно неопознаваемым, особенно если у кого-то уже есть сопоставимый массив данных. Мы снижаем этот риск тем, что не принимаем свободный текст, используем случайный идентификатор и держим запись в пределах фиксированного списка значений. Если остаточный риск для вас неприемлем — не включайте переключатель, это совершенно разумный выбор.", "s9_t": "Правовое основание и контакт", "s9_b": "Данные о здоровье — особая категория, поэтому мы обрабатываем их только с вашего явного согласия: GDPR Статья 6(1)(a) вместе со Статьёй 9(2)(a). Согласие, данное здесь, можно отозвать в любой момент, выключив переключатель; отзыв не затрагивает обработку, которая уже произошла. Вопросы и запросы: privacy@via-l.com. Эта страница — часть нашей политики конфиденциальности и обновляется вместе с ней.", "agree": "Я прочитал(а) эту страницу и согласен(на) передавать обезличенные показатели моих дней", "on": "Передача включена", "off": "Передача выключена", "del": "Удалить мой вклад", "del_ok": "Удалено. С этой установки на сервере ничего не осталось.", "del_err": "Не удалось связаться с сервером. Попробуйте позже.", "del_confirm": "Удалить все записи, отправленные с этого устройства? Отменить это будет нельзя.", "nav_today": "Сегодня", "nav_approach": "Наш подход", "nav_guide": "Мой наставник", "nav_card": "Мой профиль"}, "de": {"title": "Helfen Sie, VIA·L zu verbessern", "sub": "Eine freiwillige Möglichkeit, Ihre anonymisierten Tageswerte beizusteuern, damit die App an echten Daten lernen kann. Standardmäßig aus. Lesen Sie diese Seite, bevor Sie entscheiden.", "s1_t": "Warum wir fragen", "s1_b": "VIA·L liest Ihre Tageswerte im Vergleich zu Ihrer eigenen Ausgangslage. Je mehr echte Tage die App gesehen hat – über Altersgruppen, Zyklen, Schlafmuster und Tracker hinweg –, desto besser unterscheidet sie eine gewöhnliche Schwankung von einer Veränderung, die Aufmerksamkeit verdient, und desto ehrlicher lässt sie sich kalibrieren. Heute stützt sich diese Kalibrierung allein auf veröffentlichte Forschung; Ihre Daten würden es uns erlauben, sie am wirklichen Leben zu prüfen und zu veröffentlichen, was wir lernen.", "s2_t": "Was gesendet wird", "s2_b": "Nur die Zahlen und Angaben Ihres Tages: Herzratenvariabilität, Ruhepuls, Schlafdauer und Tiefschlaf, Sauerstoffsättigung, Temperaturabweichung, VO₂max und Readiness, sofern Ihr Tracker sie liefert; Ihre Bewertungen von Energie und Schlaf; Häufigkeit und Intensität von Hitzewallungen; Gedächtnis und geistige Klarheit; Stress und Alkohol; der Zeitpunkt Ihrer letzten Mahlzeit und späten Koffeins; die von Ihnen eingetragenen Blutdruckwerte aus der Selbstmessung; Gewicht und Taillenumfang; ob der Tag von einem Tracker oder aus manueller Eingabe stammt; sowie die Versionsnummern unseres Schemas und unserer Gewichte.", "s3_t": "Was niemals gesendet wird", "s3_b": "Alles, was Sie in eigenen Worten schreiben, bleibt auf Ihrem Gerät: was Sie hergeführt hat, Notizen zu den Ereignissen des Tages, neue Symptome, Ihre Fragen an den Assistenten und der Text Ihrer Auswertungen. Freitext macht einen Datensatz am ehesten wiedererkennbar, deshalb weist der Server ihn zurück – der Filter liegt auf unserer Seite und hängt nicht davon ab, ob die App aktuell ist. In VIA·L gibt es kein Konto, also gibt es weder Namen noch E-Mail noch Telefonnummer zu senden.", "s4_t": "Wie die Anonymität gewahrt bleibt", "s4_b": "Jede Installation erzeugt beim ersten Start eine zufällige Kennung. Sie wird nicht aus Ihrem Gerät, Ihrer Telefonnummer oder irgendetwas Persönlichem abgeleitet und liegt nur auf Ihrem Gerät. Die Datensätze treffen unter dieser Kennung ein und sonst nichts. Wir können an einer Zeile nicht ablesen, zu wem sie gehört – und ebenso wenig zwei Menschen miteinander oder Sie mit einem Kauf verknüpfen.", "s5_t": "Es ist freiwillig", "s5_b": "Der Schalter ist aus, bis Sie ihn einschalten, und Sie können ihn jederzeit wieder ausschalten – die App funktioniert in beiden Fällen genau gleich. Eine Zustimmung schaltet nichts frei, eine Ablehnung nimmt nichts weg: Ihre Auswertungen, Ihr Verlauf und Ihr Abo hängen von dieser Entscheidung nicht ab.", "s6_t": "Sie können Ihren Beitrag löschen", "s6_b": "«Meinen Beitrag löschen» entfernt alle von dieser Installation gesendeten Datensätze. Da die Kennung nur auf Ihrem Gerät existiert, kann die Löschung auch nur von dort verlangt werden – tun Sie es also, bevor Sie die App löschen oder auf ein neues Telefon wechseln, sonst ist die Verbindung fort und die anonymen Zeilen sind nicht mehr auffindbar. Datensätze, die bereits in ein veröffentlichtes aggregiertes Ergebnis eingegangen sind, lassen sich daraus nicht mehr herauslösen.", "s7_t": "Wo und wie lange gespeichert wird", "s7_b": "Die Datensätze gehen über eine verschlüsselte Verbindung an unseren Verarbeitungsdienst bei Cloudflare und werden dort in einer Datenbank gespeichert. Sie bleiben so lange erhalten wie die Forschung, der sie dienen – also ohne festes Enddatum –, denn ein Kalibrierungsdatensatz verliert seinen Sinn, wenn er nach Kalender gelöscht wird. Sie werden nie verkauft, nie für Werbung verwendet und nie an Versicherer oder Arbeitgeber weitergegeben. Wenn Sie eine Fachperson in VIA·L EXPERT begleitet, ist das eine eigene Sache mit eigener Einwilligung: dieser Schalter sendet nichts an eine Fachperson.", "s8_t": "Nutzen und Risiken, ehrlich benannt", "s8_b": "Für Sie persönlich bringt die Zustimmung keinen Vorteil: Ihre eigenen Auswertungen werden dadurch weder besser noch schneller. Der Nutzen ist gemeinsam und kommt später – eine besser kalibrierte App für Menschen in derselben Lebensphase. Das Risiko ist klein, aber nicht null: keine Sammlung von Gesundheitsmesswerten ist absolut sicher vor einer Re-Identifizierung, besonders wenn jemand bereits über einen passenden Datenbestand verfügt. Wir senken dieses Risiko, indem wir Freitext zurückweisen, eine zufällige Kennung verwenden und den Datensatz auf eine feste Liste von Werten beschränken. Wenn Ihnen dieses Restrisiko nicht annehmbar erscheint, schalten Sie den Schalter nicht ein – das ist eine völlig vernünftige Entscheidung.", "s9_t": "Rechtsgrundlage und Kontakt", "s9_b": "Gesundheitsdaten sind eine besondere Kategorie, deshalb verarbeiten wir sie ausschließlich auf Grundlage Ihrer ausdrücklichen Einwilligung – Art. 6 Abs. 1 lit. a in Verbindung mit Art. 9 Abs. 2 lit. a DSGVO. Die hier erteilte Einwilligung können Sie jederzeit widerrufen, indem Sie den Schalter ausschalten; der Widerruf berührt die bereits erfolgte Verarbeitung nicht. Fragen und Anliegen: privacy@via-l.com. Diese Seite ist Teil unserer Datenschutzerklärung und wird gemeinsam mit ihr aktualisiert.", "agree": "Ich habe diese Seite gelesen und stimme zu, meine anonymisierten Tageswerte zu teilen", "on": "Teilen ist eingeschaltet", "off": "Teilen ist ausgeschaltet", "del": "Meinen Beitrag löschen", "del_ok": "Gelöscht. Von dieser Installation ist nichts mehr auf dem Server.", "del_err": "Der Server war nicht erreichbar. Bitte später erneut versuchen.", "del_confirm": "Alle von diesem Gerät gesendeten Datensätze löschen? Das lässt sich nicht rückgängig machen.", "nav_today": "Heute", "nav_approach": "Ansatz", "nav_guide": "Mein Begleiter", "nav_card": "Mein Profil"}, "pt": {"title": "Ajude a melhorar o VIA·L", "sub": "Uma forma opcional de contribuir com os seus números diários anonimizados para que o app aprenda com dados reais. Desligado por padrão. Leia esta página antes de decidir.", "s1_t": "Por que pedimos", "s1_b": "O VIA·L lê os seus números diários comparando-os com a sua própria linha de base. Quanto mais dias reais o app tiver visto — de idades, ciclos, padrões de sono e trackers diferentes —, melhor ele distingue uma oscilação comum de uma mudança que merece atenção, e com mais honestidade pode ser calibrado. Hoje essa calibração se apoia apenas em pesquisas publicadas; os seus dados nos permitiriam confrontá-la com a vida real e publicar o que aprendermos.", "s2_t": "O que é enviado", "s2_b": "Somente os números e as respostas do seu dia: variabilidade da frequência cardíaca, pulso em repouso, duração do sono e sono profundo, oxigênio no sangue, desvio de temperatura, VO₂máx e prontidão (readiness) se o seu tracker os fornecer; as suas avaliações de energia e sono; frequência e intensidade das ondas de calor; memória e clareza mental; estresse e álcool; o horário da última refeição e da cafeína tardia; as medições de pressão arterial em casa que você inseriu; peso e cintura; se o dia veio de um tracker ou de entrada manual; e os números de versão do nosso esquema e dos pesos.", "s3_t": "O que nunca é enviado", "s3_b": "Tudo o que você escreve com as suas próprias palavras fica no seu aparelho: o que o trouxe até aqui, as anotações sobre os acontecimentos do dia, sintomas novos, as suas perguntas ao assistente e o texto das suas análises. O texto livre é o que mais frequentemente torna um registro reconhecível, por isso o servidor o recusa — o filtro está do nosso lado e não depende de o app estar atualizado. No VIA·L não existe conta, portanto não há nome, e-mail nem telefone a enviar.", "s4_t": "Como o anonimato se mantém", "s4_b": "Cada instalação gera um identificador aleatório na primeira vez que o app é aberto. Ele não deriva do seu aparelho, do seu número de telefone nem de nada seu, e fica guardado somente no seu aparelho. Os registros chegam sob esse identificador e nada mais. Não conseguimos olhar para uma linha e dizer de quem ela é — nem ligar duas pessoas entre si, nem ligar você a uma compra.", "s5_t": "É voluntário", "s5_b": "A chave fica desligada até você ligá-la, e você pode desligá-la de novo a qualquer momento — o app funciona exatamente igual nos dois casos. Concordar não libera nada e recusar não tira nada: as suas análises, o seu histórico e a sua assinatura não dependem desta escolha.", "s6_t": "Você pode apagar a sua contribuição", "s6_b": "«Apagar minha contribuição» remove todos os registros enviados desta instalação. Como o identificador vive apenas no seu aparelho, o apagamento só pode ser pedido a partir dele — faça isso antes de excluir o app ou de mudar de telefone, senão o vínculo se perde e as linhas anônimas não podem mais ser encontradas. Registros que já entraram em um resultado agregado publicado não podem ser retirados desse resultado.", "s7_t": "Onde fica guardado e por quanto tempo", "s7_b": "Os registros seguem por uma conexão criptografada até o nosso serviço de processamento na Cloudflare e são guardados ali em um banco de dados. Eles permanecem enquanto durar a pesquisa a que servem — ou seja, sem data final fixa —, porque um conjunto de calibração perde o sentido se for apagado por calendário. Nunca são vendidos, nunca são usados para publicidade e nunca são entregues a seguradoras ou empregadores. Se um especialista acompanha você no VIA·L EXPERT, isso é outra história, com o seu próprio consentimento: esta chave não envia nada a nenhum especialista.", "s8_t": "Benefícios e riscos, com honestidade", "s8_b": "Concordar não traz nenhum benefício pessoal para você: as suas próprias análises não ficam melhores nem mais rápidas. O benefício é coletivo e vem depois — um app mais bem calibrado para pessoas na mesma fase da vida. O risco é pequeno, mas não é zero: nenhum conjunto de medições de saúde é absolutamente impossível de reidentificar, sobretudo se alguém já tiver em mãos um conjunto de dados correspondente. Reduzimos esse risco recusando texto livre, usando um identificador aleatório e limitando o registro a uma lista fixa de valores. Se esse risco residual não lhe parecer aceitável, não ligue a chave — é uma escolha perfeitamente razoável.", "s9_t": "Base legal e contato", "s9_b": "Dados de saúde são uma categoria especial, por isso os tratamos somente com o seu consentimento explícito — artigo 6(1)(a) em conjunto com o artigo 9(2)(a) do RGPD. O consentimento dado aqui pode ser retirado a qualquer momento desligando a chave; a retirada não afeta o tratamento já realizado. Dúvidas e solicitações: privacy@via-l.com. Esta página faz parte da nossa política de privacidade e é atualizada junto com ela.", "agree": "Li esta página e concordo em compartilhar os meus números diários anonimizados", "on": "Compartilhamento ligado", "off": "Compartilhamento desligado", "del": "Apagar minha contribuição", "del_ok": "Apagado. Não resta nada desta instalação no servidor.", "del_err": "Não foi possível falar com o servidor. Tente mais tarde.", "del_confirm": "Apagar todos os registros enviados deste aparelho? Isso não pode ser desfeito.", "nav_today": "Hoje", "nav_approach": "Abordagem", "nav_guide": "Meu guia", "nav_card": "Meu perfil"}, "fr": {"title": "Aidez-nous à améliorer VIA·L", "sub": "Une façon facultative de contribuer vos chiffres quotidiens anonymisés pour que l’application apprenne sur des données réelles. Désactivé par défaut. Lisez cette page avant de décider.", "s1_t": "Pourquoi nous le demandons", "s1_b": "VIA·L lit vos chiffres quotidiens en les comparant à votre propre référence. Plus l’application a vu de journées réelles — à travers les âges, les cycles, les habitudes de sommeil et les trackers —, mieux elle distingue une fluctuation ordinaire d’un changement qui mérite attention, et plus honnêtement elle peut être calibrée. Aujourd’hui, cette calibration repose uniquement sur la recherche publiée ; vos données nous permettraient de la confronter à la vie réelle et de publier ce que nous en apprenons.", "s2_t": "Ce qui est envoyé", "s2_b": "Uniquement les chiffres et les réponses de votre journée : variabilité de la fréquence cardiaque, pouls au repos, durée du sommeil et sommeil profond, oxygène sanguin, écart de température, VO₂max et readiness si votre tracker les fournit ; vos évaluations d’énergie et de sommeil ; la fréquence et l’intensité des bouffées de chaleur ; la mémoire et la clarté mentale ; le stress et l’alcool ; l’heure de votre dernier repas et de la caféine tardive ; les mesures de tension artérielle à domicile que vous avez saisies ; le poids et le tour de taille ; si la journée provient d’un tracker ou d’une saisie manuelle ; et les numéros de version de notre schéma et de nos pondérations.", "s3_t": "Ce qui n’est jamais envoyé", "s3_b": "Tout ce que vous écrivez avec vos propres mots reste sur votre appareil : ce qui vous a amené ici, les notes sur les événements de la journée, les nouveaux symptômes, vos questions à l’assistant et le texte de vos analyses. Le texte libre est ce qui rend le plus souvent un enregistrement reconnaissable ; c’est pourquoi le serveur le refuse — le filtre se trouve de notre côté et ne dépend pas de la mise à jour de l’application. Il n’y a pas de compte dans VIA·L : il n’y a donc ni nom, ni e-mail, ni numéro de téléphone à envoyer.", "s4_t": "Comment l’anonymat est préservé", "s4_b": "Chaque installation génère un identifiant aléatoire au premier lancement. Il n’est dérivé ni de votre appareil, ni de votre numéro de téléphone, ni de quoi que ce soit qui vous concerne, et il n’est conservé que sur votre appareil. Les enregistrements arrivent sous cet identifiant et rien d’autre. Nous ne pouvons pas regarder une ligne et dire à qui elle appartient — ni relier deux personnes entre elles, ni vous relier à un achat.", "s5_t": "C’est volontaire", "s5_b": "L’interrupteur est éteint tant que vous ne l’allumez pas, et vous pouvez l’éteindre à tout moment — l’application fonctionne exactement de la même façon dans les deux cas. Accepter ne débloque rien et refuser n’enlève rien : vos analyses, votre historique et votre abonnement ne dépendent pas de ce choix.", "s6_t": "Vous pouvez supprimer votre contribution", "s6_b": "« Supprimer ma contribution » efface tous les enregistrements envoyés depuis cette installation. Comme l’identifiant n’existe que sur votre appareil, la suppression ne peut être demandée que depuis lui — faites-le donc avant de supprimer l’application ou de changer de téléphone, sinon le lien est perdu et les lignes anonymes ne peuvent plus être retrouvées. Les enregistrements déjà intégrés à un résultat agrégé publié ne peuvent pas en être retirés.", "s7_t": "Où et combien de temps c’est conservé", "s7_b": "Les enregistrements passent par une connexion chiffrée jusqu’à notre service de traitement chez Cloudflare et y sont conservés dans une base de données. Ils sont gardés aussi longtemps que la recherche qu’ils servent — c’est-à-dire sans date de fin fixe —, car un jeu de calibration perd son sens s’il est effacé selon un calendrier. Ils ne sont jamais vendus, jamais utilisés à des fins publicitaires et jamais remis à des assureurs ou à des employeurs. Si un spécialiste vous accompagne dans VIA·L EXPERT, c’est une démarche distincte avec son propre consentement : cet interrupteur n’envoie rien à aucun spécialiste.", "s8_t": "Bénéfices et risques, honnêtement", "s8_b": "Accepter ne vous apporte aucun bénéfice personnel : vos propres analyses n’en deviennent ni meilleures ni plus rapides. Le bénéfice est collectif et arrive plus tard — une application mieux calibrée pour les personnes qui traversent la même période de vie. Le risque est faible mais non nul : aucun ensemble de mesures de santé n’est absolument impossible à ré-identifier, surtout si quelqu’un dispose déjà d’un jeu de données correspondant. Nous réduisons ce risque en refusant le texte libre, en utilisant un identifiant aléatoire et en limitant l’enregistrement à une liste fixe de valeurs. Si ce risque résiduel ne vous paraît pas acceptable, n’activez pas l’interrupteur — c’est un choix parfaitement raisonnable.", "s9_t": "Base légale et contact", "s9_b": "Les données de santé constituent une catégorie particulière : nous ne les traitons donc que sur la base de votre consentement explicite — article 6(1)(a) combiné à l’article 9(2)(a) du RGPD. Le consentement donné ici peut être retiré à tout moment en éteignant l’interrupteur ; le retrait n’affecte pas le traitement déjà effectué. Questions et demandes : privacy@via-l.com. Cette page fait partie de notre politique de confidentialité et est mise à jour en même temps qu’elle.", "agree": "J’ai lu cette page et j’accepte de partager mes chiffres quotidiens anonymisés", "on": "Le partage est activé", "off": "Le partage est désactivé", "del": "Supprimer ma contribution", "del_ok": "Supprimé. Il ne reste rien de cette installation sur le serveur.", "del_err": "Le serveur est injoignable. Réessayez plus tard.", "del_confirm": "Supprimer tous les enregistrements envoyés depuis cet appareil ? Cette action est irréversible.", "nav_today": "Aujourd'hui", "nav_approach": "Approche", "nav_guide": "Mon guide", "nav_card": "Mon profil"}, "pl": {"title": "Pomóż ulepszyć VIA·L", "sub": "Nieobowiązkowy sposób, by przekazać swoje zanonimizowane dzienne liczby, żeby aplikacja uczyła się na prawdziwych danych. Domyślnie wyłączone. Przeczytaj tę stronę, zanim zdecydujesz.", "s1_t": "Dlaczego o to prosimy", "s1_b": "VIA·L czyta Twoje dzienne liczby na tle Twojej własnej linii odniesienia. Im więcej prawdziwych dni aplikacja zobaczyła — w różnym wieku, przy różnych cyklach, wzorcach snu i trackerach —, tym lepiej odróżnia zwykłe wahanie od zmiany wartej uwagi i tym uczciwiej można ją skalibrować. Dziś ta kalibracja opiera się wyłącznie na opublikowanych badaniach; Twoje dane pozwoliłyby nam sprawdzić ją na realnym życiu i opublikować to, czego się nauczymy.", "s2_t": "Co jest wysyłane", "s2_b": "Tylko liczby i odpowiedzi z Twojego dnia: zmienność rytmu serca, tętno spoczynkowe, długość snu i sen głęboki, natlenienie krwi, odchylenie temperatury, VO₂max i gotowość (readiness), jeśli Twój tracker je podaje; Twoje oceny energii i snu; częstość i nasilenie uderzeń gorąca; pamięć i jasność umysłu; stres i alkohol; porę ostatniego posiłku i późnej kofeiny; domowe pomiary ciśnienia, które wpisałeś(-aś); wagę i obwód talii; to, czy dzień pochodzi z trackera, czy z ręcznego wpisu; oraz numery wersji naszego schematu i wag.", "s3_t": "Czego nie wysyłamy nigdy", "s3_b": "Wszystko, co piszesz własnymi słowami, zostaje na Twoim urządzeniu: co Cię tu przywiodło, notatki o wydarzeniach dnia, nowe objawy, Twoje pytania do asystenta i tekst Twoich analiz. To swobodny tekst najczęściej czyni zapis rozpoznawalnym, dlatego serwer go odrzuca — filtr stoi po naszej stronie i nie zależy od tego, czy aplikacja jest aktualna. W VIA·L nie ma konta, więc nie ma imienia, adresu e-mail ani numeru telefonu do wysłania.", "s4_t": "Jak zachowana jest anonimowość", "s4_b": "Każda instalacja tworzy losowy identyfikator przy pierwszym uruchomieniu. Nie wywodzi się on z Twojego urządzenia, numeru telefonu ani niczego, co Cię dotyczy, i przechowywany jest wyłącznie na Twoim urządzeniu. Zapisy trafiają do nas pod tym identyfikatorem i niczym więcej. Nie potrafimy spojrzeć na wiersz i powiedzieć, czyj on jest — ani powiązać dwóch osób ze sobą, ani powiązać Ciebie z zakupem.", "s5_t": "To dobrowolne", "s5_b": "Przełącznik jest wyłączony, dopóki go nie włączysz, i możesz go wyłączyć w każdej chwili — aplikacja działa dokładnie tak samo w obu przypadkach. Zgoda niczego nie odblokowuje, a odmowa niczego nie zabiera: Twoje analizy, historia i subskrypcja nie zależą od tego wyboru.", "s6_t": "Możesz usunąć swój wkład", "s6_b": "«Usuń mój wkład» kasuje wszystkie zapisy wysłane z tej instalacji. Ponieważ identyfikator żyje tylko na Twoim urządzeniu, o usunięcie można poprosić jedynie z niego — zrób to przed skasowaniem aplikacji lub przejściem na nowy telefon, inaczej powiązanie przepada i anonimowych wierszy nie da się już odnaleźć. Zapisów, które weszły już do opublikowanego wyniku zbiorczego, nie da się z tego wyniku wyjąć.", "s7_t": "Gdzie i jak długo są przechowywane", "s7_b": "Zapisy idą szyfrowanym połączeniem do naszej usługi przetwarzania w Cloudflare i tam są przechowywane w bazie danych. Zostają tak długo, jak trwa badanie, któremu służą — czyli bez ustalonej daty końcowej — bo zbiór kalibracyjny traci sens, jeśli kasuje się go według kalendarza. Nigdy nie są sprzedawane, nigdy nie służą reklamie i nigdy nie trafiają do ubezpieczycieli ani pracodawców. Jeśli prowadzi Cię specjalista w VIA·L EXPERT, to osobna sprawa z własną zgodą: ten przełącznik nie wysyła niczego żadnemu specjaliście.", "s8_t": "Korzyści i ryzyka, uczciwie", "s8_b": "Zgoda nie daje Ci osobistej korzyści: Twoje własne analizy nie stają się przez nią ani lepsze, ani szybsze. Korzyść jest wspólna i przychodzi później — lepiej skalibrowana aplikacja dla osób w tym samym okresie życia. Ryzyko jest małe, ale nie zerowe: żadnego zbioru pomiarów zdrowotnych nie da się uznać za absolutnie niemożliwy do ponownej identyfikacji, zwłaszcza gdy ktoś dysponuje już pasującym zbiorem danych. Zmniejszamy to ryzyko, odrzucając swobodny tekst, używając losowego identyfikatora i ograniczając zapis do stałej listy wartości. Jeśli to resztkowe ryzyko nie jest dla Ciebie do przyjęcia, nie włączaj przełącznika — to całkowicie rozsądny wybór.", "s9_t": "Podstawa prawna i kontakt", "s9_b": "Dane o zdrowiu to szczególna kategoria, dlatego przetwarzamy je wyłącznie na podstawie Twojej wyraźnej zgody — art. 6 ust. 1 lit. a w związku z art. 9 ust. 2 lit. a RODO. Udzieloną tu zgodę możesz wycofać w każdej chwili, wyłączając przełącznik; wycofanie nie wpływa na przetwarzanie, które już się odbyło. Pytania i wnioski: privacy@via-l.com. Ta strona jest częścią naszej polityki prywatności i jest aktualizowana razem z nią.", "agree": "Przeczytałem(-am) tę stronę i zgadzam się udostępniać moje zanonimizowane dzienne liczby", "on": "Udostępnianie włączone", "off": "Udostępnianie wyłączone", "del": "Usuń mój wkład", "del_ok": "Usunięto. Z tej instalacji nie zostało na serwerze nic.", "del_err": "Nie udało się połączyć z serwerem. Spróbuj później.", "del_confirm": "Usunąć wszystkie zapisy wysłane z tego urządzenia? Tego nie da się cofnąć.", "nav_today": "Dziś", "nav_approach": "Podejście", "nav_guide": "Mój przewodnik", "nav_card": "Mój profil"}, "it": {"title": "Aiuta a migliorare VIA·L", "sub": "Un modo facoltativo di contribuire con i tuoi numeri quotidiani anonimizzati, perché l’app impari su dati reali. Disattivato per impostazione predefinita. Leggi questa pagina prima di decidere.", "s1_t": "Perché te lo chiediamo", "s1_b": "VIA·L legge i tuoi numeri quotidiani confrontandoli con la tua stessa linea di base. Più giornate reali l’app ha visto — di età, cicli, abitudini di sonno e tracker diversi —, meglio distingue una normale oscillazione da un cambiamento che merita attenzione, e più onestamente può essere calibrata. Oggi quella calibrazione si regge soltanto sulla ricerca pubblicata; i tuoi dati ci permetterebbero di verificarla sulla vita reale e di pubblicare ciò che impariamo.", "s2_t": "Che cosa viene inviato", "s2_b": "Solo i numeri e le risposte della tua giornata: variabilità della frequenza cardiaca, battito a riposo, durata del sonno e sonno profondo, ossigeno nel sangue, scostamento della temperatura, VO₂max e readiness se il tuo tracker li fornisce; le tue valutazioni di energia e sonno; frequenza e intensità delle vampate; memoria e lucidità mentale; stress e alcol; l’orario dell’ultimo pasto e della caffeina serale; i valori di pressione misurati a casa che hai inserito; peso e girovita; se la giornata proviene da un tracker o da inserimento manuale; e i numeri di versione del nostro schema e dei pesi.", "s3_t": "Che cosa non viene mai inviato", "s3_b": "Tutto ciò che scrivi con parole tue resta sul tuo dispositivo: che cosa ti ha portato qui, le note sugli eventi della giornata, i sintomi nuovi, le tue domande all’assistente e il testo delle tue analisi. Il testo libero è ciò che più spesso rende riconoscibile un record, perciò il server lo rifiuta — il filtro sta dalla nostra parte e non dipende dal fatto che l’app sia aggiornata. In VIA·L non esiste un account, quindi non c’è nome, né e-mail, né numero di telefono da inviare.", "s4_t": "Come resta anonimo", "s4_b": "Ogni installazione genera un identificatore casuale al primo avvio. Non deriva dal tuo dispositivo, dal tuo numero di telefono o da qualcosa che ti riguarda, ed è conservato solo sul tuo dispositivo. I record arrivano sotto quell’identificatore e nient’altro. Non possiamo guardare una riga e dire di chi è — né collegare due persone tra loro, né collegare te a un acquisto.", "s5_t": "È volontario", "s5_b": "L’interruttore è spento finché non lo accendi, e puoi spegnerlo di nuovo in qualsiasi momento: l’app funziona esattamente allo stesso modo in entrambi i casi. Acconsentire non sblocca nulla e rifiutare non toglie nulla: le tue analisi, la tua cronologia e il tuo abbonamento non dipendono da questa scelta.", "s6_t": "Puoi cancellare il tuo contributo", "s6_b": "«Cancella il mio contributo» rimuove tutti i record inviati da questa installazione. Poiché l’identificatore vive solo sul tuo dispositivo, la cancellazione può essere richiesta soltanto da lì: fallo prima di disinstallare l’app o di passare a un nuovo telefono, altrimenti il collegamento si perde e le righe anonime non sono più rintracciabili. I record già confluiti in un risultato aggregato pubblicato non possono essere estratti da quel risultato.", "s7_t": "Dove vengono conservati e per quanto", "s7_b": "I record viaggiano su una connessione cifrata fino al nostro servizio di elaborazione su Cloudflare e lì vengono conservati in un database. Restano finché dura la ricerca che servono — cioè senza una data di fine prestabilita —, perché un insieme di calibrazione perde senso se viene cancellato a calendario. Non vengono mai venduti, mai usati per pubblicità e mai consegnati ad assicurazioni o datori di lavoro. Se un professionista ti segue in VIA·L EXPERT, quella è una vicenda separata con un proprio consenso: questo interruttore non invia nulla a nessun professionista.", "s8_t": "Benefici e rischi, con onestà", "s8_b": "Acconsentire non ti porta alcun beneficio personale: le tue analisi non diventano né migliori né più veloci. Il beneficio è comune e arriva dopo — un’app calibrata meglio per chi attraversa lo stesso periodo della vita. Il rischio è piccolo ma non nullo: nessun insieme di misure di salute è assolutamente impossibile da re-identificare, soprattutto se qualcuno dispone già di un insieme di dati corrispondente. Riduciamo quel rischio rifiutando il testo libero, usando un identificatore casuale e limitando il record a un elenco fisso di valori. Se questo rischio residuo non ti sembra accettabile, non accendere l’interruttore: è una scelta del tutto ragionevole.", "s9_t": "Base giuridica e contatti", "s9_b": "I dati sulla salute sono una categoria particolare, perciò li trattiamo solo con il tuo consenso esplicito — articolo 6(1)(a) in combinato disposto con l’articolo 9(2)(a) del GDPR. Il consenso prestato qui può essere revocato in qualsiasi momento spegnendo l’interruttore; la revoca non pregiudica il trattamento già avvenuto. Domande e richieste: privacy@via-l.com. Questa pagina fa parte della nostra informativa sulla privacy e viene aggiornata insieme a essa.", "agree": "Ho letto questa pagina e acconsento a condividere i miei numeri quotidiani anonimizzati", "on": "Condivisione attiva", "off": "Condivisione disattivata", "del": "Cancella il mio contributo", "del_ok": "Cancellato. Sul server non resta nulla di questa installazione.", "del_err": "Non è stato possibile raggiungere il server. Riprova più tardi.", "del_confirm": "Cancellare tutti i record inviati da questo dispositivo? L’operazione non è reversibile.", "nav_today": "Oggi", "nav_approach": "Approccio", "nav_guide": "La mia guida", "nav_card": "Il mio profilo"}, "he": {"title": "עזרו לשפר את VIA·L", "sub": "דרך אופציונלית לתרום את המספרים היומיים שלכם באופן אנונימי, כדי שהאפליקציה תוכל ללמוד על נתונים אמיתיים. כבוי כברירת מחדל. קראו את העמוד הזה לפני שתחליטו.", "s1_t": "למה אנחנו מבקשים", "s1_b": "VIA·L קוראת את המספרים היומיים שלכם מול קו הבסיס האישי שלכם. ככל שהאפליקציה ראתה יותר ימים אמיתיים — בגילים שונים, במחזורים שונים, בדפוסי שינה ובמכשירי מעקב שונים — כך היא מיטיבה להבחין בין תנודה רגילה לבין שינוי שראוי לשים לב אליו, וכך אפשר לכייל אותה בכנות רבה יותר. כיום הכיול הזה נשען על מחקר שפורסם בלבד; הנתונים שלכם יאפשרו לנו לבחון אותו מול החיים האמיתיים ולפרסם את מה שנלמד.", "s2_t": "מה נשלח", "s2_b": "רק המספרים והתשובות של היום שלכם: שונות קצב הלב, דופק במנוחה, משך השינה ושינה עמוקה, ריווי חמצן בדם, סטיית טמפרטורה, VO₂max ומוכנות (readiness) אם מכשיר המעקב שלכם מספק אותם; הדירוגים שלכם לאנרגיה ולשינה; תדירות גלי החום ועוצמתם; זיכרון וצלילות מחשבתית; מתח ואלכוהול; שעת הארוחה האחרונה וקפאין מאוחר; מדידות לחץ דם ביתיות שהזנתם; משקל והיקף מותניים; האם היום הגיע ממכשיר מעקב או מהזנה ידנית; ומספרי הגרסה של הסכימה ושל המשקלים שלנו.", "s3_t": "מה לעולם לא נשלח", "s3_b": "כל מה שכתבתם במילים שלכם נשאר במכשיר שלכם: מה הביא אתכם לכאן, הערות על אירועי היום, תסמינים חדשים, השאלות שלכם לעוזר והטקסט של הניתוחים שלכם. טקסט חופשי הוא מה שהופך רשומה לזיהוי לרוב, ולכן השרת מסרב לקבל אותו — המסנן נמצא בצד שלנו ואינו תלוי בכך שהאפליקציה מעודכנת. ב-VIA·L אין חשבון, ולכן אין שם, אין דוא\"ל ואין מספר טלפון לשלוח.", "s4_t": "איך נשמרת האנונימיות", "s4_b": "כל התקנה יוצרת מזהה אקראי בהפעלה הראשונה. הוא אינו נגזר מהמכשיר שלכם, ממספר הטלפון שלכם או מכל דבר שקשור אליכם, והוא נשמר רק במכשיר שלכם. הרשומות מגיעות תחת המזהה הזה ותו לא. איננו יכולים להסתכל בשורה ולומר של מי היא — ואיננו יכולים לקשר בין שני אנשים או לקשר אתכם לרכישה.", "s5_t": "זה בהתנדבות", "s5_b": "המתג כבוי עד שתדליקו אותו, ואפשר לכבות אותו בחזרה בכל רגע — האפליקציה עובדת בדיוק אותו הדבר כך או כך. הסכמה אינה פותחת שום דבר וסירוב אינו לוקח שום דבר: הניתוחים שלכם, ההיסטוריה שלכם והמנוי שלכם אינם תלויים בבחירה הזאת.", "s6_t": "אפשר למחוק את התרומה שלכם", "s6_b": "«מחיקת התרומה שלי» מוחקת כל רשומה שנשלחה מההתקנה הזאת. מכיוון שהמזהה קיים רק במכשיר שלכם, אפשר לבקש מחיקה רק ממנו — לכן עשו זאת לפני שתמחקו את האפליקציה או תעברו לטלפון חדש, אחרת הקישור אובד ואי אפשר עוד למצוא את השורות האנונימיות. רשומות שכבר נכללו בתוצאה מצטברת שפורסמה אינן ניתנות לשליפה מאותה תוצאה.", "s7_t": "היכן נשמר ולכמה זמן", "s7_b": "הרשומות עוברות בחיבור מוצפן אל שירות העיבוד שלנו ב-Cloudflare ונשמרות שם במסד נתונים. הן נשמרות כל עוד נמשך המחקר שהן משרתות — כלומר ללא תאריך סיום קבוע — משום שמערך כיול מאבד את משמעותו אם מוחקים אותו לפי לוח זמנים. הן לעולם אינן נמכרות, לעולם אינן משמשות לפרסום ולעולם אינן נמסרות לחברות ביטוח או למעסיקים. אם מלווה אתכם מומחה ב-VIA·L EXPERT, זהו עניין נפרד עם הסכמה משלו: המתג הזה אינו שולח דבר לשום מומחה.", "s8_t": "תועלת וסיכון, בכנות", "s8_b": "ההסכמה אינה מביאה לכם תועלת אישית: הניתוחים שלכם לא ייעשו טובים או מהירים יותר. התועלת משותפת ומגיעה מאוחר יותר — אפליקציה מכוילת טוב יותר עבור אנשים באותה תקופת חיים. הסיכון קטן אך אינו אפס: שום אוסף של מדדי בריאות אינו בלתי ניתן לזיהוי מחדש באופן מוחלט, בייחוד אם למישהו כבר יש מאגר נתונים תואם. אנחנו מקטינים את הסיכון הזה בכך שאנו מסרבים לטקסט חופשי, משתמשים במזהה אקראי ומגבילים את הרשומה לרשימה קבועה של ערכים. אם הסיכון השיורי הזה אינו מקובל עליכם, אל תדליקו את המתג — זו בחירה סבירה לחלוטין.", "s9_t": "בסיס חוקי ויצירת קשר", "s9_b": "נתוני בריאות הם קטגוריה מיוחדת, ולכן אנו מעבדים אותם רק על סמך הסכמתכם המפורשת — סעיף 6(1)(a) יחד עם סעיף 9(2)(a) ל-GDPR. את ההסכמה שניתנה כאן אפשר לבטל בכל עת על ידי כיבוי המתג; הביטול אינו משפיע על עיבוד שכבר בוצע. שאלות ובקשות: privacy@via-l.com. העמוד הזה הוא חלק ממדיניות הפרטיות שלנו ומתעדכן יחד איתה.", "agree": "קראתי את העמוד הזה ואני מסכים/ה לשתף את המספרים היומיים שלי באופן אנונימי", "on": "השיתוף פעיל", "off": "השיתוף כבוי", "del": "מחיקת התרומה שלי", "del_ok": "נמחק. לא נשאר בשרת דבר מההתקנה הזאת.", "del_err": "לא הצלחנו להגיע לשרת. נסו שוב מאוחר יותר.", "del_confirm": "למחוק כל רשומה שנשלחה מהמכשיר הזה? אי אפשר לבטל את הפעולה.", "nav_today": "היום", "nav_approach": "הגישה שלנו", "nav_guide": "המלווה שלי", "nav_card": "הפרופיל שלי"}, "ja": {"title": "VIA·L の改善に協力する", "sub": "匿名化した一日の数値を提供して、アプリが実際のデータから学べるようにする任意の仕組みです。初期設定はオフです。決める前にこのページをお読みください。", "s1_t": "お願いする理由", "s1_b": "VIA·L は、あなたの数値をあなた自身のベースラインと照らして読み取ります。年齢も、周期も、睡眠のかたちも、使うトラッカーも異なる実際の一日を多く見るほど、ふだんの揺らぎと注意を向ける価値のある変化とを見分けやすくなり、より誠実に較正できます。現在その較正は公表された研究だけに頼っています。あなたのデータがあれば、それを実生活に照らして検証し、分かったことを公表できます。", "s2_t": "送られるもの", "s2_b": "送られるのはその日の数値と選択だけです。心拍変動、安静時脈拍、睡眠時間と深い睡眠、血中酸素、体温の偏差、VO₂max とレディネス（トラッカーが対応している場合）、エネルギーと睡眠の自己評価、ほてりの回数と強さ、記憶と頭の冴え、ストレスと飲酒、最後の食事の時刻と遅い時間のカフェイン、ご自身で入力した家庭血圧の測定値、体重と腹囲、その日がトラッカー由来か手入力かの別、そして当社のスキーマと重み付けのバージョン番号です。", "s3_t": "決して送られないもの", "s3_b": "ご自身の言葉で書いたものはすべて端末に残ります。ここに来たきっかけ、その日の出来事のメモ、新しい症状、アシスタントへの質問、分析結果の本文などです。自由記述こそ記録を特定しやすくするものなので、サーバー側で受け取りを拒否します。フィルターは当社側にあり、アプリが最新かどうかに左右されません。VIA·L にはアカウントがないため、送るべき氏名もメールアドレスも電話番号も存在しません。", "s4_t": "匿名性が保たれるしくみ", "s4_b": "インストールごとに、初回起動時にランダムな識別子が作られます。端末や電話番号、その他あなたに関する情報から導かれるものではなく、端末の中だけに保存されます。記録はその識別子のみを伴って届きます。当社は一行を見て誰のものかを言うことはできず、二人を結びつけることも、あなたと購入履歴を結びつけることもできません。", "s5_t": "任意です", "s5_b": "スイッチはあなたが入れるまでオフのままで、いつでも切り直せます。どちらでもアプリの動作はまったく変わりません。同意しても何かが開放されることはなく、断っても何かが失われることはありません。分析も履歴もサブスクリプションも、この選択に左右されません。", "s6_t": "提供した分は削除できます", "s6_b": "「提供した分を削除」は、このインストールから送られたすべての記録を消します。識別子は端末の中にしかないため、削除を求められるのはその端末からだけです。アプリを削除する前、新しい端末に移る前に行ってください。あとでは手がかりが失われ、匿名の行を見つけられなくなります。すでに公表された集計結果に含まれた記録を、その結果から取り出すことはできません。", "s7_t": "保管場所と保管期間", "s7_b": "記録は暗号化された通信で Cloudflare 上の当社処理サービスへ送られ、そこのデータベースに保管されます。役立てている研究が続くあいだ保管され、終了日はあらかじめ定めていません。較正用のデータは日程で消してしまえば意味を失うためです。販売することも、広告に使うことも、保険会社や雇用主に渡すことも決してありません。VIA·L EXPERT で専門家の伴走を受けている場合、それは別個の話で別の同意によります。このスイッチが専門家に何かを送ることはありません。", "s8_t": "利点とリスクを正直に", "s8_b": "同意してもあなた個人に利点はありません。ご自身の分析が良くなることも速くなることもありません。利点は共有されるもので、後から訪れます。同じ時期を生きる人々のために、よりよく較正されたアプリになるということです。リスクは小さいものの、ゼロではありません。健康の測定値の集まりで、再識別が絶対に不可能なものは存在しません。とくに、対応するデータをすでに持っている相手がいる場合はそうです。当社は自由記述を受け取らないこと、ランダムな識別子を使うこと、記録を決まった項目に限ることで、このリスクを下げています。この残余のリスクが受け入れがたいと感じるなら、スイッチは入れないでください。それはまったく理にかなった選択です。", "s9_t": "法的根拠と連絡先", "s9_b": "健康データは特別な種類の個人データであるため、当社はあなたの明示的な同意に基づいてのみ取り扱います（GDPR 第6条1項(a) および第9条2項(a)）。ここでの同意はスイッチを切ることでいつでも撤回できます。撤回は、それまでに行われた処理には影響しません。ご質問・ご依頼は privacy@via-l.com へ。このページは当社プライバシーポリシーの一部であり、ポリシーと同時に更新されます。", "agree": "このページを読み、匿名化した一日の数値を提供することに同意します", "on": "提供はオン", "off": "提供はオフ", "del": "提供した分を削除", "del_ok": "削除しました。このインストールのデータはサーバーに残っていません。", "del_err": "サーバーに接続できませんでした。しばらくしてからお試しください。", "del_confirm": "この端末から送られたすべての記録を削除しますか？元に戻すことはできません。", "nav_today": "今日", "nav_approach": "アプローチ", "nav_guide": "マイガイド", "nav_card": "マイプロフィール"}, "ko": {"title": "VIA·L 개선에 참여하기", "sub": "익명화된 하루 수치를 제공해 앱이 실제 데이터로 배울 수 있게 하는 선택 기능입니다. 기본값은 꺼짐입니다. 결정하기 전에 이 페이지를 읽어 주세요.", "s1_t": "부탁드리는 이유", "s1_b": "VIA·L은 당신의 하루 수치를 당신 자신의 기준선과 비교해 읽습니다. 나이도, 주기도, 수면 습관도, 사용하는 트래커도 다른 실제 하루를 많이 볼수록, 흔한 변동과 눈여겨볼 만한 변화를 더 잘 구분하고 더 정직하게 보정할 수 있습니다. 지금 그 보정은 발표된 연구에만 기대고 있습니다. 당신의 데이터가 있으면 이를 실제 생활에 비추어 확인하고, 배운 바를 공개할 수 있습니다.", "s2_t": "무엇이 전송되나요", "s2_b": "그날의 수치와 선택만 전송됩니다. 심박변이도, 안정 시 맥박, 수면 시간과 깊은 수면, 혈중 산소, 체온 편차, 트래커가 제공하는 경우 VO₂max와 준비도(readiness), 에너지와 수면에 대한 자기 평가, 안면홍조의 빈도와 강도, 기억력과 정신적 명료함, 스트레스와 음주, 마지막 식사 시각과 늦은 시간의 카페인, 직접 입력한 가정 혈압 측정값, 체중과 허리둘레, 그날이 트래커에서 왔는지 수동 입력인지, 그리고 저희 스키마와 가중치의 버전 번호입니다.", "s3_t": "결코 전송되지 않는 것", "s3_b": "당신이 직접 쓴 글은 모두 기기에 남습니다. 무엇 때문에 오게 되었는지, 그날 있었던 일에 대한 메모, 새로 생긴 증상, 어시스턴트에게 한 질문, 그리고 분석의 본문입니다. 자유 서술은 기록을 알아볼 수 있게 만드는 가장 큰 요인이기에 서버가 이를 거부합니다. 필터는 저희 쪽에 있으며 앱이 최신인지 여부와 무관합니다. VIA·L에는 계정이 없으므로 보낼 이름도, 이메일도, 전화번호도 존재하지 않습니다.", "s4_t": "익명성이 유지되는 방식", "s4_b": "설치할 때마다 앱을 처음 실행하는 순간 무작위 식별자가 생성됩니다. 이는 기기나 전화번호, 당신에 관한 어떤 정보에서도 파생되지 않으며 기기 안에만 저장됩니다. 기록은 그 식별자만 달고 도착합니다. 저희는 한 줄을 보고 누구의 것인지 말할 수 없고, 두 사람을 연결하거나 당신을 구매 내역과 연결할 수도 없습니다.", "s5_t": "자발적인 선택입니다", "s5_b": "스위치는 당신이 켜기 전까지 꺼져 있으며 언제든 다시 끌 수 있습니다. 어느 쪽이든 앱의 동작은 똑같습니다. 동의한다고 해서 무엇이 열리지 않고, 거절한다고 해서 무엇이 사라지지 않습니다. 분석도, 기록도, 구독도 이 선택과 무관합니다.", "s6_t": "제공한 기록을 삭제할 수 있습니다", "s6_b": "‘내 제공 기록 삭제’는 이 설치에서 보낸 모든 기록을 지웁니다. 식별자는 기기 안에만 있기 때문에 삭제 요청도 그 기기에서만 가능합니다. 앱을 삭제하거나 새 휴대폰으로 옮기기 전에 해 주세요. 그 뒤에는 연결 고리가 사라져 익명 기록을 더 이상 찾을 수 없습니다. 이미 공개된 집계 결과에 포함된 기록은 그 결과에서 다시 빼낼 수 없습니다.", "s7_t": "어디에 얼마나 보관하나요", "s7_b": "기록은 암호화된 연결로 Cloudflare에 있는 저희 처리 서비스로 전송되어 그곳 데이터베이스에 보관됩니다. 그 기록이 쓰이는 연구가 계속되는 동안 보관되며 종료 날짜를 정해 두지 않습니다. 보정용 데이터는 일정에 따라 지워 버리면 의미를 잃기 때문입니다. 판매하지 않고, 광고에 쓰지 않으며, 보험사나 고용주에게 넘기지 않습니다. VIA·L EXPERT에서 전문가의 관리를 받고 있다면 그것은 별도의 동의가 있는 별개의 일이며, 이 스위치는 어떤 전문가에게도 아무것도 보내지 않습니다.", "s8_t": "이점과 위험, 솔직하게", "s8_b": "동의해도 당신 개인에게 돌아오는 이점은 없습니다. 당신의 분석이 더 좋아지거나 빨라지지 않습니다. 이점은 함께 나누는 것이며 나중에 옵니다. 같은 시기를 지나는 사람들을 위해 더 잘 보정된 앱이 되는 것입니다. 위험은 작지만 0은 아닙니다. 어떤 건강 측정 데이터도 재식별이 절대 불가능하다고 할 수는 없으며, 상대가 이미 대응되는 데이터를 갖고 있다면 더욱 그렇습니다. 저희는 자유 서술을 받지 않고, 무작위 식별자를 쓰며, 기록을 정해진 항목으로 제한해 이 위험을 줄입니다. 이 남은 위험이 받아들이기 어렵다면 스위치를 켜지 마세요. 그것은 충분히 합리적인 선택입니다.", "s9_t": "법적 근거와 문의", "s9_b": "건강 데이터는 특별한 범주이므로 저희는 당신의 명시적 동의에 근거해서만 처리합니다 — GDPR 제6조 제1항 (a)와 제9조 제2항 (a). 여기서 준 동의는 스위치를 꺼서 언제든 철회할 수 있으며, 철회는 이미 이루어진 처리에는 영향을 주지 않습니다. 문의와 요청: privacy@via-l.com. 이 페이지는 저희 개인정보처리방침의 일부이며 방침과 함께 갱신됩니다.", "agree": "이 페이지를 읽었으며 익명화된 하루 수치를 제공하는 데 동의합니다", "on": "제공 켜짐", "off": "제공 꺼짐", "del": "내 제공 기록 삭제", "del_ok": "삭제되었습니다. 이 설치에서 보낸 데이터는 서버에 남아 있지 않습니다.", "del_err": "서버에 연결하지 못했습니다. 나중에 다시 시도해 주세요.", "del_confirm": "이 기기에서 보낸 모든 기록을 삭제할까요? 되돌릴 수 없습니다.", "nav_today": "오늘", "nav_approach": "접근 방식", "nav_guide": "나의 가이드", "nav_card": "내 프로필"}};
const LANG_NAMES = {en:'English',es:'Español',uk:'Українська',ru:'Русский',de:'Deutsch',pt:'Português',fr:'Français',pl:'Polski',it:'Italiano',he:'עברית',ja:'日本語',ko:'한국어'};
const LANG_ORDER = ['en','es','uk','ru','de','pt','fr','pl','it','he','ja','ko'];
const API = 'https://interpreter.viaelcom.workers.dev';
let lang = 'en';
try{ const s=localStorage.getItem('selectedLang')||localStorage.getItem('vialp_lang'); if(s&&T[s]) lang=s; else { const n=(navigator.language||'en').slice(0,2); if(T[n]) lang=n; } }catch(e){}
function tr(k){ return (T[lang]&&T[lang][k])||T.en[k]||''; }
function applyLang(l){
  lang = T[l] ? l : 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang==='he') ? 'rtl' : 'ltr';   // иврит: как в самом приложении
  document.querySelectorAll('[data-t]').forEach(function(el){
    const v = tr(el.getAttribute('data-t'));
    if (v) el.textContent = v;
  });
  document.getElementById('langBtn').textContent = lang.toUpperCase();
  rcRender();
  try{ localStorage.setItem('selectedLang', lang); }catch(e){}
}
function toggleLang(){ document.getElementById('langMenu').classList.toggle('open'); }
// Согласие живёт в том же ключе, что читает приложение (_researchConsent → vialp_research_consent).
function rcOn(){ try{ return localStorage.getItem('vialp_research_consent')==='1'; }catch(e){ return false; } }
function rcRender(){
  const on = rcOn();
  document.getElementById('rcAgree').checked = on;
  const st = document.getElementById('rcState');
  st.textContent = on ? tr('on') : tr('off');
  st.classList.toggle('on', on);
}
function rcToggle(on){
  try{ localStorage.setItem('vialp_research_consent', on ? '1' : '0'); }catch(e){}
  document.getElementById('rcMsg').textContent = '';
  rcRender();
}
// Удаление вклада: pid живёт только на устройстве, поэтому запросить удаление может лишь оно.
async function rcForget(){
  let pid=''; try{ pid=localStorage.getItem('vialp_pid')||''; }catch(e){}
  const msg=document.getElementById('rcMsg');
  if(!pid){ msg.textContent = tr('del_ok'); return; }
  if(!confirm(tr('del_confirm'))) return;
  try{
    const r = await fetch(API+'/research/forget', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid:pid})});
    const j = await r.json();
    msg.textContent = (j&&j.ok) ? tr('del_ok') : tr('del_err');
  }catch(e){ msg.textContent = tr('del_err'); }
}
(function(){
  const m = document.getElementById('langMenu');
  LANG_ORDER.filter(function(l){ return T[l]; }).forEach(function(l){
    const d = document.createElement('div');
    d.className='lang-opt'; d.textContent = LANG_NAMES[l] || l;
    d.onclick = function(){ applyLang(l); m.classList.remove('open'); };
    m.appendChild(d);
  });
  document.addEventListener('click', function(e){ if(!e.target.closest('.lang-wrap')) m.classList.remove('open'); });
  applyLang(lang);
})();
</script>
