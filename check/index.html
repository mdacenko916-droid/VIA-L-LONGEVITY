<style>
  :root{

  header{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}

  .logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:var(--gold);text-decoration:none;letter-spacing:.5px}
  .langs{display:flex;gap:6px}
  .langs button{background:transparent;border:1px solid var(--line);color:var(--text-lt);border-radius:999px;padding:6px 11px;font:600 15px 'DM Sans',sans-serif;cursor:pointer}
  .langs button.on{background:var(--gold);color:var(--gold-xp);border-color:var(--gold)}
  /* язык — кнопка с выпадающим списком, как на главной */
  .lsw{position:relative}
  .lbtn{display:flex;align-items:center;gap:6px;background:var(--gold-xp);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 15px 'DM Sans',sans-serif;letter-spacing:1px;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .lbtn .arr{font-size:8px;color:var(--text-lt);transition:transform .2s}
  .lsw.open .arr{transform:rotate(180deg)}
  .lsw .langs{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--cream);border:1px solid var(--gold-pale);border-radius:12px;overflow:hidden;min-width:170px;box-shadow:0 8px 24px rgba(90,70,40,.18);z-index:50;flex-direction:column;gap:0}
  .lsw.open .langs{display:flex}
  .lsw .langs button{display:block;width:100%;text-align:left;border:none;border-radius:0;background:transparent;padding:12px 16px;font:500 16px 'DM Sans',sans-serif;color:var(--text-mid);cursor:pointer}
  .lsw .langs button.on{background:var(--cream-dk);color:var(--gold);font-weight:600}
  .progress{height:3px;background:var(--cream-md)}
  .progress i{display:block;height:100%;width:0;background:var(--gold-pale);transition:width .35s}
  main{max-width:640px;margin:0 auto;padding:20px 16px 120px}
  .intro h1{font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(28px,7vw,40px);line-height:1.2;margin:18px 0 12px}
  .intro p{color:var(--text-lt);margin-bottom:12px;font-size:18px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}
  .chips span{background:var(--gold-xp);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;color:var(--text-lt)}
  .btn{display:inline-block;background:var(--gold);color:var(--gold-xp);border:none;border-radius:14px;padding:15px 24px;font:600 18px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;text-align:center}
  .btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold-pale)}
  .btn:disabled{opacity:.45;cursor:default}
  .fine,.intro p.fine{font-size:14px;color:var(--text-lt);opacity:.85;margin-top:14px}
  .chat{display:flex;flex-direction:column;gap:10px}
  .msg{max-width:92%;padding:13px 17px;font-size:18px;border-radius:16px;background:var(--bubble);border:1px solid var(--line);color:var(--text-mid);animation:in .25s ease}
  .msg.me{align-self:flex-end;background:var(--me);color:var(--gold-xp);border-color:var(--me)}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--gold-xp);border:1px solid var(--line);border-radius:14px;padding:15px 18px;font:600 18px/1.35 'DM Sans',sans-serif;color:var(--text);cursor:pointer}
  .opt .box{flex:0 0 24px;height:24px;border:1.5px solid var(--gold-pale);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold-xp)}
  .opt.on{border-color:var(--gold)}
  .opt.on .box{background:var(--gold);border-color:var(--gold)}
  .row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
  textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:18px 'DM Sans',sans-serif;background:var(--gold-xp);color:var(--text);resize:vertical}
  .stop{background:#F6E3DC;border:1px solid #D9A99A;border-radius:16px;padding:18px;color:var(--alert)}
  .stop h2{font-family:'Playfair Display',serif;font-weight:500;font-size:24px;margin-bottom:8px}
  .stop p{margin-top:8px;color:var(--text-mid)}
  .loading{display:flex;gap:6px;padding:14px 16px}
  .loading i{width:8px;height:8px;border-radius:50%;background:var(--gold-pale);animation:b 1s infinite}
  .loading i:nth-child(2){animation-delay:.15s}.loading i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
  .report{background:var(--gold-xp);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-top:10px}
  .report h2{font-family:'Playfair Display',serif;font-weight:500;font-size:25px;line-height:1.3;margin-bottom:6px}
  .report h3{font-family:'Playfair Display',serif;font-weight:500;font-size:19px;color:var(--gold);margin:20px 0 6px}
  .report ul{padding-left:20px}
  .report li{margin:4px 0}
  .next{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .card{background:var(--bubble);border:1px solid var(--line);border-radius:16px;padding:16px}
  .card b{display:block;font-family:'Playfair Display',serif;font-weight:500;font-size:19px;margin-bottom:4px}
  .card p{font-size:16px;color:var(--text-lt);margin-bottom:10px}
  .card .row{justify-content:flex-start}
  .err{color:var(--alert);font-size:16px}
  @media (max-width:360px){body,.msg{font-size:17px}.opt{font-size:17px;padding:13px 14px}}
</style>

// Порядок шагов: [ключ, мульти?, эксклюзивный вариант]
var STEPS=[['age',0],['cycle',0],['main',0],['also',1,'none'],['since',0],['impact',0],['sleep',1,'ok'],['about',1,'none'],['labs',1,'none'],['device',0],['tried',0],['want',0]];
var TOTAL=STEPS.length+2; // + проверка безопасности + заметка

var lang=(function(){
  try{ var q=new URLSearchParams(location.search).get('lang'); if(T[q]) return q; }catch(e){}
  try{ var s=localStorage.getItem('selectedLang'); if(T[s]) return s; }catch(e){}
  var n=(navigator.language||'').slice(0,2).toLowerCase();
  return T[n]?n:(n==='ua'?'uk':'en');
})();
var A={}, step=-1, report=null;
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function L(){return T[lang];}
function prog(n){ $('prog').style.width=Math.round(100*n/TOTAL)+'%'; }
function say(text,me){ var d=document.createElement('div'); d.className='msg'+(me?' me':''); d.textContent=text; $('chat').appendChild(d); return d; }
function scrollEnd(){ setTimeout(function(){ window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); },30); }
// Воронка «Безкоштовний розбір»: open — открыл опросник, start — нажал «Почати» (метка источника, без личных данных).
var EVSENT={};
function ev(name){ if(EVSENT[name]) return; EVSENT[name]=1;
  try{ var b=JSON.stringify({ev:name,src:SRC,lang:lang}), u='https://interpreter.viaelcom.workers.dev/check-event';
    if(navigator.sendBeacon) navigator.sendBeacon(u,new Blob([b],{type:'text/plain'})); else fetch(u,{method:'POST',body:b,keepalive:true}); }catch(e){} }
ev('open');

// Кнопка языка: открыть/закрыть список, подпись = текущий язык.
var LF={uk:['🇺🇦','UK'],ru:['🇷🇺','RU'],es:['🇪🇸','ES'],en:['🇬🇧','EN']};
function lbtnSync(){ var f=LF[lang]||LF.uk; document.getElementById('lflag').textContent=f[0]; document.getElementById('lcode').textContent=f[1]; document.getElementById('lsw').classList.remove('open'); }
document.getElementById('lbtn').onclick=function(e){ e.stopPropagation(); document.getElementById('lsw').classList.toggle('open'); };
document.addEventListener('click',function(){ document.getElementById('lsw').classList.remove('open'); });
function renderIntro(){
  document.documentElement.lang=lang;
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on',b.dataset.l===lang); }); lbtnSync();
  var t=L();
  $('intro').innerHTML='<h1>'+esc(t.title)+'</h1><p>'+esc(t.lead)+'</p><div class="chips">'+t.chips.map(function(c){return '<span>'+esc(c)+'</span>';}).join('')+
    '</div><button class="btn" id="go">'+esc(t.start)+'</button><p class="fine">'+esc(t.fine)+'</p>';
  $('go').onclick=function(){ ev('start'); start(); };
}
document.querySelectorAll('.langs button').forEach(function(b){
  b.onclick=function(){
    if(lang===b.dataset.l) return;
    lang=b.dataset.l; try{ localStorage.setItem('selectedLang',lang); }catch(e){}
    if(step<0||report){ renderIntro(); if(report) showReport(report); return; }
    restart();   // язык поменяли посреди опроса — начинаем заново на новом языке
  };
});

function start(){
  $('intro').hidden=true; $('chat').hidden=false; $('chat').innerHTML='';
  A={}; step=0; report=null;
  say(L().hello); askSafety();
}
function restart(){ step=-1; report=null; $('ctl').innerHTML=''; $('chat').innerHTML=''; $('chat').hidden=true; $('intro').hidden=false; prog(0); renderIntro(); }

// Мульти/одиночный выбор. done(values[]) вызывается по «Далі» (мульти) или по клику (одиночный).
function choose(opts,multi,excl,done){
  var t=L(), sel=[], ctl=$('ctl');
  ctl.innerHTML='<div class="opts">'+Object.keys(opts).map(function(k){
    return '<button class="opt" data-k="'+k+'">'+(multi?'<span class="box"></span>':'')+'<span>'+esc(opts[k])+'</span></button>';
  }).join('')+'</div>'+(multi?'<div class="row"><button class="btn" id="nx" disabled>'+esc(t.next)+'</button></div>':'');
  ctl.querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){
      var k=b.dataset.k;
      if(!multi){ ctl.innerHTML=''; say(opts[k],true); done([k]); return; }
      var i=sel.indexOf(k);
      if(i>=0) sel.splice(i,1); else { if(k===excl) sel=[]; else sel=sel.filter(function(x){return x!==excl;}); sel.push(k); }
      ctl.querySelectorAll('.opt').forEach(function(o){ var on=sel.indexOf(o.dataset.k)>=0; o.classList.toggle('on',on); o.querySelector('.box').textContent=on?'✓':''; });
      $('nx').disabled=!sel.length;
    };
  });
  if(multi) $('nx').onclick=function(){ ctl.innerHTML=''; say(sel.map(function(k){return opts[k];}).join(', '),true); done(sel.slice()); };
  scrollEnd();
}

function askSafety(){
  prog(0); var t=L();
  say(t.safetyQ);
  choose(t.safety,true,'none',function(v){
    if(v.length===1&&v[0]==='none'){ prog(1); ask(0); return; }
    var harm=v.indexOf('harm')>=0;
    $('ctl').innerHTML='<div class="stop"><h2>'+esc(t.stopT)+'</h2><p>'+esc(t.stopP)+'</p>'+(harm?'<p><b>'+esc(t.stopHarm)+'</b></p>':'')+'</div>';
    scrollEnd();
  });
}
function ask(i){
  if(i>=STEPS.length){ askNote(); return; }
  var s=STEPS[i], key=s[0], q=L().q[key], opts=q[1];
  if(key==='also'){ opts={}; Object.keys(q[1]).forEach(function(k){ if(k!==A.main) opts[k]=q[1][k]; }); }  // главное не повторяем
  say(q[0]);
  choose(opts,!!s[1],s[2],function(v){ A[key]=s[1]?v:v[0]; prog(i+2); ask(i+1); });
}
function askNote(){
  var t=L(); say(t.noteQ);
  $('ctl').innerHTML='<div class="row"><button class="btn ghost" id="wr">'+esc(t.write)+'</button><button class="btn" id="sk">'+esc(t.skip)+'</button></div>';
  $('sk').onclick=function(){ say(t.skip,true); submit(); };
  $('wr').onclick=function(){
    $('ctl').innerHTML='<textarea id="nt" maxlength="500" placeholder="'+esc(t.notePh)+'"></textarea><div class="row"><button class="btn" id="sd">'+esc(t.send)+'</button></div>';
    $('nt').focus();
    $('sd').onclick=function(){ var v=$('nt').value.trim(); if(v){ A.note=v; say(v,true); } else say(t.skip,true); submit(); };
  };
  scrollEnd();
}

function submit(){
  var t=L(); prog(TOTAL);
  say(t.wait);
  $('ctl').innerHTML='<div class="loading"><i></i><i></i><i></i></div>'; scrollEnd();
  var a={}; Object.keys(A).forEach(function(k){ a[k]=A[k]; });
  if(Array.isArray(a.also)) a.also=a.also.filter(function(x){return x!=='none';});
  if(Array.isArray(a.about)) a.about=a.about.filter(function(x){return x!=='none';});
  fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:lang,src:SRC,a:a})})
    .then(function(r){ return r.json().catch(function(){ return {error:'x'}; }); })
    .then(function(j){
      if(j&&j.report){ report=j.report; say(t.ready); showReport(report); return; }
      var e=j&&j.error, msg=e==='limit_ip'?t.errLimit:(e==='limit_day'?t.errDay:t.errGen);
      $('ctl').innerHTML='<p class="err">'+esc(msg)+'</p>'+(e==='limit_ip'||e==='limit_day'?'':'<div class="row"><button class="btn" id="rt">'+esc(t.retry)+'</button></div>');
      if($('rt')) $('rt').onclick=submit;
    })
    .catch(function(){ $('ctl').innerHTML='<p class="err">'+esc(t.errGen)+'</p><div class="row"><button class="btn" id="rt">'+esc(t.retry)+'</button></div>'; $('rt').onclick=submit; });
}

function storeLinks(){
  var ct='check'+(SRC?'_'+SRC:'');
  return {
    ios:'https://apps.apple.com/app/apple-store/id6807062006?pt=129383674&ct='+encodeURIComponent(ct)+'&mt=8',
    android:'https://play.google.com/store/apps/details?id=com.viael.vial&referrer='+encodeURIComponent('utm_source=check&utm_medium='+(SRC||'site')+'&utm_campaign=quiz')
  };
}
function showReport(r){
  var t=L(), s=storeLinks(), dev=A.device&&A.device!=='none';
  var li=function(arr){ return '<ul>'+(arr||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'; };
  $('ctl').innerHTML=
    '<div class="report" id="rep"><h2>'+esc(r.title)+'</h2>'+
    '<h3>'+esc(t.hTold)+'</h3><p>'+esc(r.told)+'</p>'+
    '<h3>'+esc(t.hLooks)+'</h3><p>'+esc(r.looks)+'</p>'+
    '<h3>'+esc(t.hExcl)+'</h3><p>'+esc(r.exclude)+'</p>'+
    (r.now&&r.now.length?'<h3>'+esc(t.hNow)+'</h3>'+li(r.now):'')+
    (r.ask&&r.ask.length?'<h3>'+esc(t.hAsk)+'</h3>'+li(r.ask):'')+
    '<p class="fine">'+esc(t.disc)+'</p>'+
    '<div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn ghost" id="dl">⬇ '+esc(t.dl)+'</button><button class="btn ghost" id="ag">'+esc(t.again)+'</button></div></div>'+
    '<div class="next"><h3 style="font-family:Playfair Display,serif;font-weight:500;font-size:22px;margin-top:8px">'+esc(t.nextH)+'</h3>'+
    '<div class="card"><b>'+esc(t.appT)+'</b><p>'+esc(dev?t.appDev+' ':'')+esc(t.appP)+'</p><div class="row"><a class="btn" href="'+s.ios+'" target="_blank" rel="noopener">App Store</a><a class="btn" href="'+s.android+'" target="_blank" rel="noopener">Google Play</a></div></div>'+
    (t.calT
      ? '<div class="card"><b>'+esc(t.calT)+'</b><p>'+esc(t.calP)+'</p><div class="row"><a class="btn" href="'+CAL+'" target="_blank" rel="noopener">'+esc(t.calB)+'</a></div></div>'+
        '<div class="card"><b>'+esc(t.clubT)+'</b><p>'+esc(t.clubP)+'</p><div class="row"><a class="btn" href="https://t.me/vial_club_guard_bot?start='+(lang==='ru'?'RU':'UK')+'" target="_blank" rel="noopener">'+esc(t.clubB)+'</a></div></div>'
      : '<div class="card"><b>'+esc(t.wrT)+'</b><p>'+esc(t.wrP)+'</p><div class="row"><a class="btn" href="'+s.ios+'" target="_blank" rel="noopener">App Store</a><a class="btn" href="'+s.android+'" target="_blank" rel="noopener">Google Play</a></div></div>')+
    '</div>';
  $('dl').onclick=download; $('ag').onclick=restart;
  scrollEnd();
}
function download(){
  if(!report) return; var t=L(), r=report, d=new Date().toISOString().slice(0,10);
  var b=function(a){ return (a||[]).map(function(x){return '— '+x;}).join('\n'); };
  var txt='VIA-L — '+r.title+'\n'+d+'\n\n'+t.hTold+'\n'+r.told+'\n\n'+t.hLooks+'\n'+r.looks+'\n\n'+t.hExcl+'\n'+r.exclude+'\n\n'+
    (r.now&&r.now.length?t.hNow+'\n'+b(r.now)+'\n\n':'')+(r.ask&&r.ask.length?t.hAsk+'\n'+b(r.ask)+'\n\n':'')+t.disc+'\nvia-l.com\n';
  var blob=new Blob([txt],{type:'text/plain;charset=utf-8'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=t.file+'-'+d+'.txt'; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },0);
}
renderIntro();
})();
