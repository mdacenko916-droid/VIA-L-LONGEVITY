<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>VIA·L — Кабинет нутрициолога</title>
<style>
:root{
  /* 1С-стиль: белый фон, чёрный контрастный текст, серые линии, без золота.
     Имена переменных сохранены — меняются ТОЛЬКО значения. */
  --gold:#1a1a1a;--gold-lt:#000000;--gold-dim:#ececec;--gold-glow:#f4f4f4;
  --dark:#ffffff;--dark2:#f4f4f4;--dark3:#e6e6e6;
  --surface:#ffffff;--surface-2:#f7f7f7;--surface-3:#f0f0f0;
  --t1:#000000;--t2:#222222;--t3:#555555;
  --b1:#cfcfcf;--b2:#9a9a9a;
  --ok:#1a7a4f;--warn:#9a5400;--alert:#b3002d;
  --ok-dim:#e7f2ec;--warn-dim:#f4ece0;--alert-dim:#f7e6ea;
  --sidebar-w:260px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--dark);color:var(--t1);font-family:'DM Sans',sans-serif;overflow:hidden;}

/* ── GATE ─────────────────────────────────────── */
#gate{
  position:fixed;inset:0;z-index:900;
  background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(196,154,60,.06),transparent 70%),var(--dark);
  display:flex;align-items:center;justify-content:center;
}
.gate-box{
  width:min(360px,92vw);padding:36px 32px;
  background:var(--surface);border:1px solid var(--b1);border-radius:24px;
  box-shadow:0 16px 48px rgba(0,0,0,.10),0 0 80px rgba(196,154,60,.06);
  text-align:center;
}
.gate-logo{font-family:'Oswald',sans-serif;font-size:11px;font-weight:300;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);margin-bottom:24px;}
.gate-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:400;color:var(--t1);margin-bottom:8px;}
.gate-sub{font-size:13px;color:var(--t2);margin-bottom:28px;line-height:1.6;}
.gate-input{
  width:100%;padding:14px 18px;border-radius:14px;
  background:var(--dark);border:1px solid var(--b1);
  color:var(--t1);font-family:'DM Mono',monospace;font-size:16px;letter-spacing:4px;
  text-align:center;outline:none;margin-bottom:8px;
  transition:border-color .2s;
}
.gate-input:focus{border-color:var(--b2);}
.gate-input.error{border-color:var(--alert);animation:shake .3s ease;}
.gate-error{font-size:12px;color:var(--alert);margin-bottom:12px;display:none;}
.gate-error.show{display:block;}
.gate-btn{
  width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#C49A3C,#8B6B22);
  color:#000;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;
  box-shadow:0 4px 20px rgba(196,154,60,.3);transition:transform .2s,box-shadow .2s;
}
.gate-btn:hover{transform:translateY(-1px);box-shadow:0 8px 32px rgba(196,154,60,.4);}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── APP SHELL ────────────────────────────────── */
#app{display:none;height:100%;flex-direction:column;}
#app.visible{display:flex;}

/* top bar */
.topbar{
  height:52px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--b1);
  background:var(--dark2);
}
.topbar-logo{font-family:'Oswald',sans-serif;font-size:10px;font-weight:300;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);}
.topbar-actions{display:flex;gap:8px;}
.topbtn{
  padding:7px 14px;border-radius:10px;border:1px solid var(--b1);
  background:var(--surface-3);color:var(--t2);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;
  cursor:pointer;transition:all .2s;letter-spacing:.3px;
}
.topbtn:hover{border-color:var(--b2);color:var(--t1);}
.topbtn.primary{background:var(--gold-dim);border-color:rgba(196,150,60,.3);color:var(--gold);}
.topbtn.primary:hover{background:rgba(196,150,60,.25);}

/* main area */
.main{flex:1;display:flex;overflow:hidden;}

/* ── SIDEBAR ──────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  display:flex;flex-direction:column;
  border-right:1px solid var(--b1);background:var(--dark2);
  overflow:hidden;
}
.sidebar-search{
  padding:12px;border-bottom:1px solid var(--b1);flex-shrink:0;
}
.sidebar-search input{
  width:100%;padding:9px 14px;border-radius:10px;
  background:var(--surface-3);border:1px solid var(--b1);
  color:var(--t1);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;
}
.sidebar-search input::placeholder{color:var(--t3);}
.client-list{flex:1;overflow-y:auto;}
.client-item{
  padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--b1);
  transition:background .15s;position:relative;
}
.client-item:hover{background:var(--surface-3);}
.client-item.active{background:var(--gold-glow);border-left:2px solid var(--gold);}
.client-name{font-size:14px;font-weight:500;color:var(--t1);margin-bottom:3px;}
.client-meta{font-size:11px;color:var(--t3);}
.client-score{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-family:'DM Mono',monospace;font-size:18px;font-weight:300;
}
.score-ok{color:var(--ok);}
.score-warn{color:var(--warn);}
.score-alert{color:var(--alert);}
.empty-list{padding:40px 16px;text-align:center;color:var(--t3);font-size:13px;line-height:1.7;}

/* ── CONTENT PANEL ────────────────────────────── */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.content-placeholder{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--t3);text-align:center;gap:12px;
}
.content-placeholder svg{opacity:.2;}
.content-placeholder p{font-size:14px;max-width:240px;line-height:1.65;}

/* client header */
.client-header{
  padding:20px 24px 0;flex-shrink:0;border-bottom:1px solid var(--b1);
}
.client-header-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.client-header-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:400;color:var(--t1);}
.client-header-meta{font-size:12px;color:var(--t3);margin-top:3px;}
.client-header-score{text-align:right;}
.score-big{font-family:'DM Mono',monospace;font-size:40px;font-weight:300;line-height:1;}
.score-big-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);}
.header-actions{display:flex;gap:8px;margin-bottom:12px;}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--b1);padding:0 24px;background:var(--dark2);}
.tab{
  padding:12px 18px;font-size:12px;font-weight:500;letter-spacing:.5px;
  color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .2s;white-space:nowrap;
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab:hover{color:var(--t2);}
.tab-content{flex:1;overflow-y:auto;padding:24px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── OVERVIEW ─────────────────────────────────── */
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.metric-card{
  background:var(--surface);border:1px solid var(--b1);border-radius:14px;
  padding:14px 16px;
}
.metric-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.metric-val{font-family:'DM Mono',monospace;font-size:26px;font-weight:300;line-height:1;}
.metric-sub{font-size:11px;color:var(--t3);margin-top:4px;}
.sessions-list{display:flex;flex-direction:column;gap:6px;}
.session-row{
  display:flex;align-items:center;gap:14px;padding:12px 16px;
  background:var(--surface);border:1px solid var(--b1);border-radius:12px;
}
.session-date{font-size:12px;color:var(--t3);width:90px;flex-shrink:0;}
.session-score{font-family:'DM Mono',monospace;font-size:20px;font-weight:300;width:42px;}
.session-metrics{flex:1;display:flex;gap:12px;flex-wrap:wrap;}
.session-metric{font-size:11px;color:var(--t2);}
.section-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:400;color:var(--t1);margin-bottom:14px;}

/* ── PROTOCOL ─────────────────────────────────── */
.protocol-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
.protocol-table th{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);
  padding:8px 12px;text-align:left;border-bottom:1px solid var(--b1);
}
.protocol-table td{padding:8px 12px;border-bottom:1px solid var(--b1);}
.protocol-table tr:last-child td{border-bottom:none;}
.proto-name{font-size:13px;color:var(--t1);}
.proto-input{
  background:transparent;border:none;outline:none;
  font-family:'DM Sans',sans-serif;font-size:12px;color:var(--t2);
  width:100%;padding:2px 0;
}
.proto-input:focus{color:var(--t1);}
.proto-del{
  background:none;border:none;cursor:pointer;
  color:var(--t3);font-size:16px;padding:4px;border-radius:6px;
  transition:color .15s;line-height:1;
}
.proto-del:hover{color:var(--alert);}
.add-row-btn{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border:1px dashed var(--b2);border-radius:12px;
  background:none;cursor:pointer;color:var(--t3);font-size:12px;font-family:'DM Sans',sans-serif;
  transition:all .2s;width:100%;
}
.add-row-btn:hover{border-color:var(--gold);color:var(--gold);}

/* ── LABS ─────────────────────────────────────── */
.labs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.lab-card{
  background:var(--surface);border:1px solid var(--b1);border-radius:14px;padding:16px;
  display:flex;flex-direction:column;gap:6px;
}
.lab-name{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);}
.lab-input{
  background:none;border:none;border-bottom:1px solid var(--b1);outline:none;
  font-family:'DM Mono',monospace;font-size:22px;font-weight:300;color:var(--t1);
  width:100%;padding:4px 0;transition:border-color .2s;
}
.lab-input:focus{border-bottom-color:var(--gold);}
.lab-ref{font-size:11px;color:var(--t3);}
.lab-status{font-size:11px;font-weight:500;}
.lab-date-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.lab-date-row label{font-size:11px;color:var(--t3);}
.lab-date-row input{
  background:none;border-bottom:1px solid var(--b1);border-top:none;border-left:none;border-right:none;
  outline:none;color:var(--t1);font-family:'DM Sans',sans-serif;font-size:12px;padding:2px 0;
}

/* ── NOTES ────────────────────────────────────── */
.note-composer{margin-bottom:20px;}
.note-textarea{
  width:100%;padding:14px 16px;border-radius:14px;
  background:var(--surface);border:1px solid var(--b1);
  color:var(--t1);font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.7;
  resize:vertical;min-height:100px;outline:none;margin-bottom:10px;
  transition:border-color .2s;
}
.note-textarea:focus{border-color:var(--b2);}
.note-save-btn{
  padding:10px 20px;border-radius:10px;border:1px solid rgba(196,150,60,.3);
  background:var(--gold-dim);color:var(--gold);font-family:'DM Sans',sans-serif;
  font-size:11px;font-weight:500;letter-spacing:.5px;cursor:pointer;transition:all .2s;
}
.note-save-btn:hover{background:rgba(196,150,60,.22);}
.note-item{
  background:var(--surface);border:1px solid var(--b1);border-radius:14px;
  padding:16px;margin-bottom:8px;
}
.note-meta{font-size:11px;color:var(--t3);margin-bottom:8px;display:flex;justify-content:space-between;}
.note-text{font-size:13px;color:var(--t2);line-height:1.65;white-space:pre-wrap;}
.note-del{background:none;border:none;cursor:pointer;color:var(--t3);font-size:13px;transition:color .15s;}
.note-del:hover{color:var(--alert);}

/* ── MODAL ────────────────────────────────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:800;
  background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal{
  width:min(480px,94vw);background:var(--surface);border:1px solid var(--b1);border-radius:20px;
  box-shadow:0 16px 48px rgba(0,0,0,.18);padding:28px;max-height:90vh;overflow-y:auto;
}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--t1);margin-bottom:20px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.form-input,.form-select{
  width:100%;padding:11px 14px;border-radius:12px;
  background:var(--dark);border:1px solid var(--b1);
  color:var(--t1);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;
  transition:border-color .2s;
}
.form-input:focus,.form-select:focus{border-color:var(--b2);}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.btn-cancel{
  padding:11px 20px;border-radius:12px;border:1px solid var(--b1);
  background:none;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;
}
.btn-save{
  padding:11px 24px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#C49A3C,#8B6B22);
  color:#000;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;
}

/* ── RESPONSIVE ───────────────────────────────── */
@media(max-width:768px){
  .sidebar{
    position:fixed;left:0;top:52px;bottom:0;z-index:200;
    transform:translateX(-100%);transition:transform .3s;
    width:min(280px,85vw);
  }
  .sidebar.open{transform:translateX(0);}
  .metrics-row{grid-template-columns:repeat(2,1fr);}
  .labs-grid{grid-template-columns:1fr;}
  .tab{padding:10px 12px;font-size:11px;}
}

/* ═══════════ 1С-FLAT SKIN — белый фон, чёрный контрастный текст ═══════════
   Поверх существующих правил: убираем декор (золото, градиенты, скругления,
   тени, декоративные шрифты, разрядку, капс). Меняем только вид, не разметку. */
*{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif !important;
  border-radius:0 !important;
  box-shadow:none !important;
  letter-spacing:normal !important;
  text-transform:none !important;
}
#gate{background:#fff !important;}
.gate-box{border:1px solid #9a9a9a !important;}
.gate-title,.client-header-name,.section-title,.modal-title,.gate-logo,.topbar-logo{
  color:#000 !important;font-weight:700 !important;
}
/* плоские чёрные/серые кнопки вместо золотых градиентов */
.gate-btn,.btn-save{background:#1a1a1a !important;color:#fff !important;font-weight:600 !important;}
.gate-btn:hover,.btn-save:hover{background:#000 !important;transform:none !important;}
.topbtn.primary{background:#e6e6e6 !important;color:#000 !important;border-color:#9a9a9a !important;}
.topbtn.primary:hover{background:#d8d8d8 !important;}
.note-save-btn{background:#e6e6e6 !important;color:#000 !important;border-color:#9a9a9a !important;}
/* активные состояния — чёрным, не золотом */
.tab.active{color:#000 !important;border-bottom:2px solid #000 !important;font-weight:600 !important;}
.client-item.active{background:#ececec !important;border-left:3px solid #000 !important;}
.lab-input:focus{border-bottom-color:#000 !important;}
.add-row-btn:hover{border-color:#000 !important;color:#000 !important;}
/* таблицы/карточки — чёткая серая сетка */
.metric-card,.session-row,.lab-card,.note-item,.modal,.gate-box{border:1px solid #cfcfcf !important;}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">VIA·L — CABINET</div>
    <div class="gate-title">Кабинет нутрициолога</div>
    <div class="gate-sub">Введите пароль администратора для доступа к базе клиентов.</div>
    <input class="gate-input" id="gateInput" type="password" maxlength="32" placeholder="· · · · · · · ·" autocomplete="current-password">
    <div class="gate-error" id="gateError">Неверный пароль</div>
    <button class="gate-btn" onclick="checkGate()">Войти →</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">VIA·L &mdash; Cabinet</div>
    <div class="topbar-actions">
      <button class="topbtn" id="mobileMenuBtn" style="display:none;" onclick="toggleSidebar()">☰ Клиенты</button>
      <button class="topbtn primary" onclick="openAddClient()">+ Новый клиент</button>
      <button class="topbtn" onclick="migrateLocal()" title="Импорт из старого локального хранилища в базу">⇪ Импорт</button>
      <button class="topbtn" onclick="exportData()">↓ Экспорт</button>
      <button class="topbtn" onclick="lockApp()" title="Выйти">⎋</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input type="text" placeholder="Поиск клиента..." id="searchInput" oninput="filterClients()">
      </div>
      <div class="client-list" id="clientList"></div>
    </div>

    <!-- Content -->
    <div class="content" id="content">
      <div class="content-placeholder" id="placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <p>Выберите клиента из списка или добавьте нового</p>
      </div>

      <!-- Client Detail -->
      <div id="clientDetail" style="display:none;flex:1;display:none;flex-direction:column;overflow:hidden;">
        <div class="client-header" id="clientHeaderEl"></div>
        <div class="tabs" id="tabsEl">
          <div class="tab active" onclick="switchTab('overview')">Обзор</div>
          <div class="tab" onclick="switchTab('protocol')">Протокол</div>
          <div class="tab" onclick="switchTab('labs')">Анализы</div>
          <div class="tab" onclick="switchTab('notes')">Заметки</div>
        </div>
        <div class="tab-content" id="tabContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT CLIENT MODAL -->
<div class="modal-overlay" id="clientModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Новый клиент</div>
    <div class="form-row">
      <label>ФИО</label>
      <input class="form-input" id="f-name" type="text" placeholder="Имя и фамилия">
    </div>
    <div class="form-row-2">
      <div class="form-row" style="margin:0">
        <label>Email</label>
        <input class="form-input" id="f-email" type="email" placeholder="email@...">
      </div>
      <div class="form-row" style="margin:0">
        <label>Телефон</label>
        <input class="form-input" id="f-phone" type="tel" placeholder="+34...">
      </div>
    </div>
    <div class="form-row-2" style="margin-top:14px;">
      <div class="form-row" style="margin:0">
        <label>Возраст</label>
        <input class="form-input" id="f-age" type="number" placeholder="47" min="18" max="99">
      </div>
      <div class="form-row" style="margin:0">
        <label>Пол</label>
        <select class="form-select" id="f-gender">
          <option value="female">Женщина</option>
          <option value="male">Мужчина</option>
        </select>
      </div>
    </div>
    <div class="form-row" style="margin-top:14px;">
      <label>Гормональная фаза</label>
      <select class="form-select" id="f-phase">
        <option value="regular">Регулярный цикл</option>
        <option value="peri">Перименопауза</option>
        <option value="post">Постменопауза</option>
        <option value="andro">Андропауза</option>
        <option value="other">Другое</option>
      </select>
    </div>
    <div class="form-row">
      <label>Заметка при создании</label>
      <textarea class="form-input" id="f-note" rows="3" placeholder="Жалобы, цель, особенности..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Отменить</button>
      <button class="btn-save" onclick="saveClient()">Сохранить →</button>
    </div>
  </div>
</div>

<script>
// ── BACKEND (Cloudflare Worker + D1) ──────────────────────
// Пароль больше НЕ в HTML — проверяется воркером (/cabinet-auth), данные клиентов
// живут в D1, а не в localStorage. См. docs/CABINET-MODEL.md (Этап 1).
const API       = 'https://interpreter.viaelcom.workers.dev';
const KEY       = 'vial_cabinet';        // legacy localStorage — только для разовой миграции
const TOKEN_KEY = 'vial_cabinet_token';

let clients = [];
let selectedId = null;
let editingId = null;
let currentTab = 'overview';

function getToken(){ return sessionStorage.getItem(TOKEN_KEY) || ''; }

async function api(path, body){
  const r = await fetch(API + path, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + getToken() },
    body: JSON.stringify(body || {}),
  });
  if(r.status === 401){ lockApp(); throw new Error('unauthorized'); }
  return r.json();
}

// ── GATE ─────────────────────────────────────────────────
async function checkGate(){
  const inp = document.getElementById('gateInput');
  try{
    const r = await fetch(API + '/cabinet-auth', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ password: inp.value }),
    });
    const j = await r.json();
    if(j.ok && j.token){
      sessionStorage.setItem(TOKEN_KEY, j.token);
      enterApp();
      return;
    }
    document.getElementById('gateError').textContent =
      j.error === 'rate_limited' ? 'Слишком много попыток — подождите 10 мин'
      : j.error === 'cabinet_not_configured' ? 'Кабинет ещё не настроен (нет CABINET_PASS)'
      : 'Неверный пароль';
  }catch(_){
    document.getElementById('gateError').textContent = 'Ошибка соединения с сервером';
  }
  inp.classList.add('error');
  document.getElementById('gateError').style.display='block';
  setTimeout(()=>inp.classList.remove('error'),400);
}
document.getElementById('gateInput').addEventListener('keydown',e=>{ if(e.key==='Enter') checkGate(); });

async function enterApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').classList.add('visible');
  await loadData();
  renderClientList();
  // show mobile menu btn on small screens
  if(window.innerWidth<768) document.getElementById('mobileMenuBtn').style.display='';
}
function lockApp(){
  sessionStorage.removeItem(TOKEN_KEY);
  location.reload();
}

// ── DATA (D1 через воркер) ────────────────────────────────
async function loadData(){
  try{
    const j = await api('/cabinet/clients');
    clients = (j && j.clients) || [];
  }catch(_){ clients = []; }
}
// Сохраняет ТЕКУЩЕГО выбранного клиента (почти все правки идут по selectedId).
function saveData(){
  const c = clients.find(x=>x.id===selectedId);
  if(c) api('/cabinet/save', { client:c }).catch(()=>{});
}
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// Разовая миграция клиентов из старого localStorage в D1.
async function migrateLocal(){
  let old=[];
  try{ old = JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(_){}
  if(!old.length){ alert('В локальном хранилище этого браузера нет клиентов для импорта.'); return; }
  if(!confirm('Импортировать '+old.length+' клиент(ов) из старого локального хранилища в базу?\n(Локальная копия останется как резерв.)')) return;
  let n=0;
  for(const c of old){
    if(!c.code) c.code = c.id || genId();
    try{ const j = await api('/cabinet/save',{ client:c }); if(j && j.ok) n++; }catch(_){}
  }
  await loadData(); renderClientList();
  alert('Импортировано: '+n+' / '+old.length);
}

// ── CLIENT LIST ───────────────────────────────────────────
function renderClientList(filter=''){
  const list = document.getElementById('clientList');
  const filtered = clients.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase()));
  if(!filtered.length){
    list.innerHTML=`<div class="empty-list">Клиентов не найдено.<br>Нажмите «+ Новый клиент»</div>`;
    return;
  }
  list.innerHTML = filtered.map(c=>{
    const last = (c.sessions||[]).slice(-1)[0];
    const scoreClass = last ? (last.type==='ok'?'score-ok':last.type==='warn'?'score-warn':'score-alert') : '';
    const scoreVal = last ? last.score : '—';
    const lastDate = last ? last.date : 'Нет сессий';
    return `<div class="client-item${selectedId===c.id?' active':''}" onclick="selectClient('${c.id}')">
      <div class="client-name">${c.name}</div>
      <div class="client-meta">${c.phase_label||''}${c.age?' · '+c.age+' л.':''} · ${lastDate}</div>
      <div class="client-score ${scoreClass}">${scoreVal}</div>
    </div>`;
  }).join('');
}
function filterClients(){
  renderClientList(document.getElementById('searchInput').value);
}

// ── SELECT CLIENT ─────────────────────────────────────────
function selectClient(id){
  selectedId = id;
  currentTab = 'overview';
  renderClientList(document.getElementById('searchInput').value);
  renderClientDetail();
  if(window.innerWidth<768) document.getElementById('sidebar').classList.remove('open');
}

function renderClientDetail(){
  const c = clients.find(x=>x.id===selectedId);
  if(!c){ document.getElementById('placeholder').style.display='flex'; document.getElementById('clientDetail').style.display='none'; return; }
  document.getElementById('placeholder').style.display='none';
  const det = document.getElementById('clientDetail');
  det.style.display='flex';

  // Header
  const last = (c.sessions||[]).slice(-1)[0];
  const clr = last?(last.type==='ok'?'var(--ok)':last.type==='warn'?'var(--warn)':'var(--alert)'):'var(--t3)';
  document.getElementById('clientHeaderEl').innerHTML=`
    <div class="client-header-top">
      <div>
        <div class="client-header-name">${c.name}</div>
        <div class="client-header-meta">${c.email||''}${c.phone?' · '+c.phone:''} · ${c.phase_label||''} · ${c.age||'?'} л.</div>
      </div>
      <div class="client-header-score">
        <div class="score-big" style="color:${clr}">${last?last.score:'—'}</div>
        <div class="score-big-lbl">Readiness</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="topbtn" onclick="openEditClient('${c.id}')">✎ Редактировать</button>
      <button class="topbtn primary" onclick="generatePDF('${c.id}')">↓ PDF</button>
      <button class="topbtn" onclick="deleteClient('${c.id}')" style="color:var(--alert)">✕ Удалить</button>
    </div>`;

  // Tabs
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const names=['overview','protocol','labs','notes'];
    t.classList.toggle('active', names[i]===currentTab);
  });

  renderTabContent();
}

// ── TABS ──────────────────────────────────────────────────
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const names=['overview','protocol','labs','notes'];
    t.classList.toggle('active', names[i]===tab);
  });
  renderTabContent();
}

function renderTabContent(){
  const c = clients.find(x=>x.id===selectedId);
  if(!c) return;
  const el = document.getElementById('tabContent');
  if(currentTab==='overview') el.innerHTML = renderOverview(c);
  else if(currentTab==='protocol') el.innerHTML = renderProtocol(c);
  else if(currentTab==='labs') el.innerHTML = renderLabs(c);
  else if(currentTab==='notes') el.innerHTML = renderNotes(c);
}

// ── OVERVIEW TAB ──────────────────────────────────────────
function renderOverview(c){
  const last = (c.sessions||[]).slice(-1)[0];
  const clr = last?(last.type==='ok'?'var(--ok)':last.type==='warn'?'var(--warn)':'var(--alert)'):'var(--t3)';
  const metricCards = last ? `
    <div class="metrics-row">
      <div class="metric-card"><div class="metric-lbl">HRV</div><div class="metric-val" style="color:${clr}">${last.hrv||'—'}</div><div class="metric-sub">мс</div></div>
      <div class="metric-card"><div class="metric-lbl">ЧСС покоя</div><div class="metric-val">${last.rhr||'—'}</div><div class="metric-sub">уд/мин</div></div>
      <div class="metric-card"><div class="metric-lbl">Сон</div><div class="metric-val">${last.sleep||'—'}</div><div class="metric-sub">ч</div></div>
      <div class="metric-card"><div class="metric-lbl">Энергия</div><div class="metric-val">${last.energy||'—'}</div><div class="metric-sub">/ 10</div></div>
    </div>` : `<p style="color:var(--t3);font-size:13px;margin-bottom:20px;">Сессий ещё нет. Клиент ещё не прошёл анализ.</p>`;

  const sessionsHTML = (c.sessions||[]).length ? `
    <div class="section-title">История сессий</div>
    <div class="sessions-list">${(c.sessions||[]).slice().reverse().map(s=>{
      const sc2 = s.type==='ok'?'var(--ok)':s.type==='warn'?'var(--warn)':'var(--alert)';
      return `<div class="session-row">
        <div class="session-date">${s.date}</div>
        <div class="session-score" style="color:${sc2}">${s.score}</div>
        <div class="session-metrics">
          ${s.hrv?`<span class="session-metric">HRV ${s.hrv}</span>`:''}
          ${s.rhr?`<span class="session-metric">ЧСС ${s.rhr}</span>`:''}
          ${s.sleep?`<span class="session-metric">Сон ${s.sleep}ч</span>`:''}
          ${s.energy?`<span class="session-metric">Энергия ${s.energy}</span>`:''}
        </div>
      </div>`;
    }).join('')}</div>` : '';

  return metricCards + sessionsHTML;
}

// ── PROTOCOL TAB ──────────────────────────────────────────
function renderProtocol(c){
  const rows = (c.protocol||[]).map((p,i)=>`
    <tr>
      <td><input class="proto-input" style="font-size:13px;color:var(--t1);font-weight:500;" value="${esc(p.name)}" oninput="updateProto(${i},'name',this.value)" placeholder="Название добавки"></td>
      <td><input class="proto-input" value="${esc(p.dose)}" oninput="updateProto(${i},'dose',this.value)" placeholder="300 мг"></td>
      <td><input class="proto-input" value="${esc(p.timing)}" oninput="updateProto(${i},'timing',this.value)" placeholder="вечер"></td>
      <td><input class="proto-input" value="${esc(p.notes||'')}" oninput="updateProto(${i},'notes',this.value)" placeholder="..."></td>
      <td><button class="proto-del" onclick="deleteProto(${i})">×</button></td>
    </tr>`).join('');

  return `
    <div class="section-title">Нутриентный протокол</div>
    <table class="protocol-table">
      <thead><tr>
        <th>Добавка</th><th>Доза</th><th>Время приёма</th><th>Заметка</th><th></th>
      </tr></thead>
      <tbody id="protoBody">${rows}</tbody>
    </table>
    <button class="add-row-btn" onclick="addProtoRow()">+ Добавить добавку</button>
    <div style="margin-top:12px;">
      <button class="topbtn primary" onclick="addDefaultProtocol()" style="font-size:11px;">⚡ Авто-протокол по последней сессии</button>
    </div>`;
}
function updateProto(idx,field,val){
  const c=clients.find(x=>x.id===selectedId); if(!c) return;
  if(!c.protocol) c.protocol=[];
  c.protocol[idx][field]=val; saveData();
}
function deleteProto(idx){
  const c=clients.find(x=>x.id===selectedId); if(!c) return;
  c.protocol.splice(idx,1); saveData(); renderTabContent();
}
function addProtoRow(){
  const c=clients.find(x=>x.id===selectedId); if(!c) return;
  if(!c.protocol) c.protocol=[];
  c.protocol.push({name:'',dose:'',timing:'',notes:''}); saveData(); renderTabContent();
}
function addDefaultProtocol(){
  const c=clients.find(x=>x.id===selectedId); if(!c) return;
  const last=(c.sessions||[]).slice(-1)[0];
  const isMale = c.gender==='male';
  const base = isMale ? [
    {name:'Магний глицинат',dose:'300 мг',timing:'вечер',notes:'Сон, стресс, HRV'},
    {name:'Омега-3 EPA+DHA',dose:'2 г',timing:'с едой',notes:'Воспаление, когниция'},
    {name:'Витамин D3 + К2',dose:'2000 МЕ',timing:'утро',notes:'Проконтролировать уровень'},
    {name:'Цинк',dose:'25 мг',timing:'утро',notes:'Тестостерон, иммунитет'},
  ] : [
    {name:'Магний глицинат',dose:'300 мг',timing:'вечер',notes:'Сон, стресс, ПМС'},
    {name:'Омега-3 EPA+DHA',dose:'2 г',timing:'с едой',notes:'Воспаление, когниция'},
    {name:'Витамин D3 + К2',dose:'2000 МЕ',timing:'утро',notes:'Проконтролировать уровень'},
    {name:'Цинк + селен',dose:'25 мг / 100 мкг',timing:'утро',notes:'Щитовидная, репродуктивное'},
  ];
  if(last && last.score < 50) base.push({name:'Ашваганда KSM-66',dose:'300 мг',timing:'утро',notes:'Стресс, кортизол'});
  c.protocol = base; saveData(); renderTabContent();
}

// ── LABS TAB ──────────────────────────────────────────────
const LAB_FIELDS=[
  {id:'vitd',name:'Витамин D',unit:'нмоль/л',ref:'75–150',low:50,high:250},
  {id:'ferr',name:'Ферритин',unit:'мкг/л',ref:'50–100',low:20,high:200},
  {id:'tsh',name:'ТТГ',unit:'мМЕ/л',ref:'0.4–4.0',low:0.3,high:4.5},
  {id:'e2',name:'Эстрадиол',unit:'пг/мл',ref:'20–350',low:15,high:500},
  {id:'prog',name:'Прогестерон',unit:'нмоль/л',ref:'0.5–25',low:0.3,high:60},
  {id:'test',name:'Тестостерон',unit:'нмоль/л',ref:'10–35',low:5,high:50},
  {id:'cort',name:'Кортизол (утро)',unit:'нмоль/л',ref:'150–600',low:100,high:700},
  {id:'b12',name:'Витамин B12',unit:'пмоль/л',ref:'148–616',low:100,high:800},
];
function labStatus(val,f){
  if(!val) return '';
  if(val<f.low) return '<span class="lab-status" style="color:var(--alert)">↓ Низко</span>';
  if(val>f.high) return '<span class="lab-status" style="color:var(--warn)">↑ Выше нормы</span>';
  if(val<f.low*1.3 || val>f.high*0.85) return '<span class="lab-status" style="color:var(--warn)">⚠ Субоптимально</span>';
  return '<span class="lab-status" style="color:var(--ok)">✓ В норме</span>';
}
function renderLabs(c){
  const labs = c.labs||{};
  return `
    <div class="section-title">Лабораторные показатели</div>
    <div class="lab-date-row">
      <label>Дата анализов:</label>
      <input type="date" value="${labs.date||''}" onchange="updateLab('date',this.value)">
    </div>
    <div class="labs-grid">${LAB_FIELDS.map(f=>`
      <div class="lab-card">
        <div class="lab-name">${f.name}</div>
        <div style="display:flex;align-items:baseline;gap:6px;">
          <input class="lab-input" type="number" value="${labs[f.id]||''}" placeholder="—"
            onchange="updateLab('${f.id}',this.value)" style="width:80px;">
          <span style="font-size:11px;color:var(--t3);">${f.unit}</span>
        </div>
        <div class="lab-ref">Норма: ${f.ref}</div>
        ${labStatus(labs[f.id],f)}
      </div>`).join('')}</div>`;
}
function updateLab(field,val){
  const c=clients.find(x=>x.id===selectedId); if(!c) return;
  if(!c.labs) c.labs={};
  c.labs[field]=val; saveData();
}

// ── NOTES TAB ─────────────────────────────────────────────
function renderNotes(c){
  const notes=(c.notes||[]);
  return `
    <div class="section-title">Заметки специалиста</div>
    <div class="note-composer">
      <textarea class="note-textarea" id="noteText" placeholder="Заметка, наблюдение, рекомендация..."></textarea>
      <button class="note-save-btn" onclick="addNote()">Сохранить заметку</button>
    </div>
    <div id="notesList">${notes.length ? notes.slice().reverse().map((n,i)=>`
      <div class="note-item">
        <div class="note-meta">
          <span>${n.date}</span>
          <button class="note-del" onclick="deleteNote(${notes.length-1-i})">✕</button>
        </div>
        <div class="note-text">${esc(n.text)}</div>
      </div>`).join('') : `<p style="color:var(--t3);font-size:13px;">Заметок пока нет.</p>`}</div>`;
}
function addNote(){
  const c=clients.find(x=>x.id===selectedId); if(!c) return;
  const text=document.getElementById('noteText').value.trim(); if(!text) return;
  if(!c.notes) c.notes=[];
  c.notes.push({text,date:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),ts:Date.now()});
  saveData(); renderTabContent();
}
function deleteNote(idx){
  const c=clients.find(x=>x.id===selectedId); if(!c) return;
  c.notes.splice(idx,1); saveData(); renderTabContent();
}

// ── ADD / EDIT CLIENT MODAL ───────────────────────────────
const PHASE_LABELS={regular:'Регулярный цикл',peri:'Перименопауза',post:'Постменопауза',andro:'Андропауза',other:'Другое'};
function openAddClient(){
  editingId=null;
  document.getElementById('modalTitle').textContent='Новый клиент';
  ['name','email','phone','age','note'].forEach(f=>document.getElementById('f-'+f).value='');
  document.getElementById('f-gender').value='female';
  document.getElementById('f-phase').value='peri';
  document.getElementById('clientModal').classList.add('open');
}
function openEditClient(id){
  editingId=id;
  const c=clients.find(x=>x.id===id); if(!c) return;
  document.getElementById('modalTitle').textContent='Редактировать клиента';
  document.getElementById('f-name').value=c.name||'';
  document.getElementById('f-email').value=c.email||'';
  document.getElementById('f-phone').value=c.phone||'';
  document.getElementById('f-age').value=c.age||'';
  document.getElementById('f-gender').value=c.gender||'female';
  document.getElementById('f-phase').value=c.phase||'peri';
  document.getElementById('f-note').value='';
  document.getElementById('clientModal').classList.add('open');
}
function closeModal(){ document.getElementById('clientModal').classList.remove('open'); }
async function saveClient(){
  const name=document.getElementById('f-name').value.trim(); if(!name){alert('Введите имя');return;}
  const note=document.getElementById('f-note').value.trim();
  const phase=document.getElementById('f-phase').value;
  let cur;
  if(editingId){
    const c=clients.find(x=>x.id===editingId); if(!c) return;
    c.name=name; c.email=document.getElementById('f-email').value.trim();
    c.phone=document.getElementById('f-phone').value.trim();
    c.age=parseInt(document.getElementById('f-age').value)||'';
    c.gender=document.getElementById('f-gender').value;
    c.phase=phase; c.phase_label=PHASE_LABELS[phase];
    if(note){if(!c.notes)c.notes=[];c.notes.push({text:note,date:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}),ts:Date.now()});}
    cur=c;
  } else {
    const c={
      id:genId(),name,
      email:document.getElementById('f-email').value.trim(),
      phone:document.getElementById('f-phone').value.trim(),
      age:parseInt(document.getElementById('f-age').value)||'',
      gender:document.getElementById('f-gender').value,
      phase,phase_label:PHASE_LABELS[phase],
      created:Date.now(),
      sessions:[],protocol:[],labs:{},notes:[]
    };
    if(note) c.notes.push({text:note,date:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}),ts:Date.now()});
    clients.unshift(c);
    selectedId=c.id;
    cur=c;
  }
  // сохраняем конкретного клиента (не полагаемся на selectedId)
  try{ await api('/cabinet/save',{ client:cur }); }catch(_){}
  closeModal(); renderClientList(); renderClientDetail();
}

// ── DELETE CLIENT ─────────────────────────────────────────
async function deleteClient(id){
  if(!confirm('Удалить клиента? Все данные будут потеряны.')) return;
  try{ await api('/cabinet/delete',{ code:id }); }catch(_){}
  clients=clients.filter(x=>x.id!==id);
  if(selectedId===id){ selectedId=null; document.getElementById('placeholder').style.display='flex'; document.getElementById('clientDetail').style.display='none'; }
  renderClientList();
}

// ── EXPORT / IMPORT ───────────────────────────────────────
function exportData(){
  const blob=new Blob([JSON.stringify(clients,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='vial_cabinet_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

// ── PDF ───────────────────────────────────────────────────

  const c=clients.find(x=>x.id===id); if(!c) return;
  const last=(c.sessions||[]).slice(-1)[0];
  const labs=c.labs||{};
  const proto=(c.protocol||[]);
  const date=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>

    .sub{color:#666;font-size:13px;margin-bottom:32px;}

    .score-box{display:flex;align-items:center;gap:20px;background:#f8f6f2;border-radius:12px;padding:20px;margin-bottom:24px;}
    .score-num{font-size:56px;font-family:'Courier New',monospace;font-weight:300;line-height:1;color:${last?(last.type==='ok'?'#4ECCA3':last.type==='warn'?'#F5A623':'#FF6B8A'):'#666'};}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
    .m{background:#f8f6f2;border-radius:8px;padding:12px;text-align:center;}
    .m-val{font-size:22px;font-family:'Courier New',monospace;font-weight:300;}
    .m-lbl{font-size:10px;color:#666;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
    table{width:100%;border-collapse:collapse;}
    td,th{padding:8px 10px;text-align:left;border-bottom:1px solid #e8e4de;font-size:13px;}
    th{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#999;font-weight:400;}
    .note{background:#f8f6f2;border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:13px;color:#444;line-height:1.65;}
    .note-date{font-size:11px;color:#999;margin-bottom:4px;}
    .footer{margin-top:40px;padding-top:16px;border-top:1px solid #e8e4de;font-size:11px;color:#999;text-align:center;}
  </style></head><body>
  <h1>${c.name}</h1>
  <div class="sub">${c.phase_label||''} · ${c.age||''}${c.age?' л.':''} · ${date}</div>
  ${last?`<h2>Результат анализа</h2>
  <div class="score-box"><div class="score-num">${last.score}</div><div><div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#999;">Readiness Score</div><div style="font-size:16px;margin-top:4px;">${last.score>=65?'Хорошее восстановление':last.score>=40?'Требует внимания':'Сигнал'}</div><div style="font-size:12px;color:#666;margin-top:2px;">${last.date}</div></div></div>
  <div class="metrics">
    <div class="m"><div class="m-val">${last.hrv||'—'}</div><div class="m-lbl">HRV мс</div></div>
    <div class="m"><div class="m-val">${last.rhr||'—'}</div><div class="m-lbl">ЧСС уд/мин</div></div>
    <div class="m"><div class="m-val">${last.sleep||'—'}</div><div class="m-lbl">Сон ч</div></div>
    <div class="m"><div class="m-val">${last.energy||'—'}</div><div class="m-lbl">Энергия /10</div></div>
  </div>`:''}
  ${proto.length?`<h2>Нутриентный протокол</h2>
  <table><thead><tr><th>Добавка</th><th>Доза</th><th>Время приёма</th><th>Примечание</th></tr></thead>
  <tbody>${proto.map(p=>`<tr><td>${p.name}</td><td>${p.dose}</td><td>${p.timing}</td><td style="color:#666;">${p.notes||''}</td></tr>`).join('')}</tbody></table>`:''}
  ${Object.keys(labs).filter(k=>k!=='date'&&labs[k]).length?`<h2>Лабораторные показатели${labs.date?' ('+labs.date+')':''}</h2>
  <table><thead><tr><th>Показатель</th><th>Значение</th><th>Норма</th></tr></thead>
  <tbody>${LAB_FIELDS.filter(f=>labs[f.id]).map(f=>`<tr><td>${f.name}</td><td><b>${labs[f.id]}</b> ${f.unit}</td><td style="color:#999;">${f.ref}</td></tr>`).join('')}</tbody></table>`:''}
  ${(c.notes||[]).length?`<h2>Заметки специалиста</h2>${(c.notes||[]).slice(-3).map(n=>`<div class="note"><div class="note-date">${n.date}</div>${n.text}</div>`).join('')}`:''}
  <div class="footer">VIA·L Longevity — Персональный протокол · Не является медицинским заключением · via-l.com</div>
  </body></html>`;
  const w=window.open('','_blank');
  w.document.write(html); w.document.close();
  setTimeout(()=>w.print(),400);
}

// ── UTILS ─────────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

// ── INIT ──────────────────────────────────────────────────
if(getToken()) enterApp();

window.addEventListener('resize',()=>{
  const btn=document.getElementById('mobileMenuBtn');
  if(btn) btn.style.display = window.innerWidth<768 ? '' : 'none';
});
</script>
</body>
</html>
