<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>VÍA-L · Анкета здоровья клиента</title>
<style>
  :root{
    --green:#14342b; --green2:#1f4d40; --gold:#c4a05a; --gold-d:#a8893f;
    --cream:#f7f4ec; --ink:#23241f; --muted:#6b6f66; --line:#e2ddcf;
    --ok:#2e7d5b; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px; margin:0 auto; padding:0 16px 120px}
  header.top{
    background:linear-gradient(135deg,var(--green),var(--green2)); color:#fff;
    padding:28px 16px 22px; text-align:center;
  }
  header.top .logo{font-weight:700; letter-spacing:.18em; font-size:26px}
  header.top .logo span{color:var(--gold)}
  header.top .tag{letter-spacing:.32em; font-size:10px; opacity:.8; margin-top:4px}
  header.top h1{font-size:18px; font-weight:600; margin:16px 0 4px}
  header.top p{font-size:13px; opacity:.85; margin:0; max-width:540px; margin:0 auto}
  .langbar{display:flex; justify-content:flex-end; margin-bottom:6px}
  #langSel{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:8px; padding:6px 10px; font-size:13px; font-family:inherit; cursor:pointer}
  #langSel option{color:#23241f}
  /* progress */
  .progress{position:sticky; top:0; z-index:20; background:var(--cream); padding:10px 0 6px; border-bottom:1px solid var(--line)}
  .progress .bar{height:6px; background:var(--line); border-radius:6px; overflow:hidden}
  .progress .bar i{display:block; height:100%; width:0; background:var(--gold); transition:width .3s}
  .progress .lbl{font-size:12px; color:var(--muted); margin-top:6px; display:flex; justify-content:space-between}
  /* section card */
  .sec{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 16px; margin:16px 0; box-shadow:0 1px 2px rgba(20,52,43,.04)}
  .sec > h2{margin:0 0 2px; font-size:16px; color:var(--green); display:flex; align-items:center; gap:8px}
  .sec > h2 .chip{background:var(--green); color:#fff; font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px}
  .sec > .subnote{font-size:12px; color:var(--muted); margin:4px 0 12px}
  .sub{font-size:13px; font-weight:600; color:var(--gold-d); text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px}
  /* question */
  .q{margin:14px 0}
  .q > label.qt{display:block; font-size:14px; font-weight:500; margin-bottom:7px}
  .q > label.qt b{color:var(--gold-d); margin-right:6px; font-weight:700}
  .hint{font-size:12px; color:var(--muted); margin:-2px 0 7px}
  input[type=text], input[type=date], input[type=number], textarea{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-size:14px;
    font-family:inherit; background:#fff; color:var(--ink);
  }
  input:focus, textarea:focus{outline:none; border-color:var(--gold)}
  textarea{min-height:64px; resize:vertical}
  .dob{display:flex; gap:8px}
  .dob select{flex:1; min-width:0; border:1px solid var(--line); border-radius:9px; padding:10px 8px; font-size:14px; font-family:inherit; background:#fff; color:var(--ink)}
  .dob select:focus{outline:none; border-color:var(--gold)}
  .dobsep{align-self:center; color:var(--muted); font-weight:700; padding:0 1px}
  /* radio & checkbox as chips */
  .opts{display:flex; flex-wrap:wrap; gap:8px}
  .opts.col{flex-direction:column}
  .opt{position:relative}
  .opt input{position:absolute; opacity:0; pointer-events:none}
  .opt span{display:block; border:1px solid var(--line); border-radius:9px; padding:9px 12px; font-size:13px; cursor:pointer; background:#fff; transition:.15s; -webkit-user-select:none; user-select:none}
  .opt input:checked + span{border-color:var(--green); background:var(--green); color:#fff; font-weight:600}
  .opt input:focus-visible + span{box-shadow:0 0 0 2px var(--gold)}
  /* scale */
  .scale .ends{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px}
  .scale .row{display:flex; align-items:center; gap:12px}
  .scale input[type=range]{flex:1; accent-color:var(--green)}
  .scale .val{min-width:34px; text-align:center; font-weight:700; font-size:18px; color:var(--green); border:1px solid var(--line); border-radius:8px; padding:2px 0}
  /* lab group */
  .lab{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media(max-width:480px){ .lab{grid-template-columns:1fr} }
  .lab .li label{display:block; font-size:12px; color:var(--muted); margin-bottom:3px}
  .lab .li input{padding:8px 10px}
  /* consent + submit */
  .consent{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--muted)}
  .consent input{margin-top:3px}
  .actions{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px; z-index:30}
  .actions .inner{max-width:720px; margin:0 auto; display:flex; gap:10px; align-items:center}
  button.submit{flex:1; background:var(--gold); color:#3a2f12; border:0; border-radius:11px; padding:14px; font-size:15px; font-weight:700; cursor:pointer}
  button.submit:disabled{opacity:.45; cursor:not-allowed}
  /* preview (dev) */
  .preview{background:#0f1c18; color:#cfe8dd; border-radius:12px; padding:14px; font-size:12px; white-space:pre-wrap; word-break:break-word; margin-top:10px; max-height:50vh; overflow:auto}
  .draftnote{font-size:11px; color:var(--muted); text-align:center; margin-top:8px}
</style>
</head>
<body>
<header class="top">
  <div class="langbar"><select id="langSel" aria-label="Language"></select></div>
  <div class="logo">VÍA<span>·</span>L</div>
  <div class="tag">WELLNESS &amp; LONGEVITY</div>
  <h1 id="h1">Анкета здоровья клиента</h1>
  <p id="sub">Гормональный статус · ЖКТ · Метаболизм · Нутриентный статус · Образ жизни.</p>
</header>

<div class="wrap">
  <div class="progress">
    <div class="bar"><i id="pbar"></i></div>
    <div class="lbl"><span id="pcount">0 из 0</span><span id="ppct">0%</span></div>
  </div>

  <form id="anketa" autocomplete="off"></form>

  <div class="actions">
    <div class="inner">
      <button class="submit" id="btnSubmit" type="button" disabled>Отправить анкету</button>
    </div>
  </div>
  <div class="draftnote">Черновой каркас · только русский · отправка пока показывает структуру (без сервера)</div>
  <pre class="preview" id="preview" hidden></pre>
</div>

<script>
/* ──────────────────────────────────────────────────────────────────────────
   СХЕМА АНКЕТЫ — единый источник правды (110 вопросов, блоки A–M).
   Типы поля:
     text      — короткий текст
     textarea  — длинный ответ
     radio     — один выбор из opts
     check     — мультивыбор из opts
     scale     — слайдер 0–10 (lo/hi подписи концов)
     lab       — группа числовых/текстовых маркеров (fields[])
   Секции с sex:'f'|'m' показываются только нужному полу (ветвление по «Пол»).
   ────────────────────────────────────────────────────────────────────────── */
const YNU = ['Да','Нет','Иногда / не уверен(а)'];

const SCHEMA = [
  { id:'intro', title:'Основные данные', chip:'', fields:[
    {id:'date', n:'', t:'text', q:'Дата заполнения', ph:'дд.мм.гггг'},
    {id:'name', n:'', t:'text', q:'Имя и фамилия'},
    {id:'birth', n:'', t:'dob', q:'Дата рождения / возраст'},
    {id:'sex', n:'', t:'radio', q:'Пол', opts:['Женский','Мужской'], control:true},
    {id:'contact', n:'', t:'text', q:'Контакт (e-mail / телефон)'},
  ]},

  { id:'A', title:'Общий анамнез и образ жизни', chip:'A', groups:[
    {sub:'A1. Основные данные и цели', fields:[
      {id:'a1', n:1, t:'lab', q:'Каков ваш рост и текущий вес?', fields:[{k:'height',l:'Рост, см'},{k:'weight',l:'Вес, кг'}]},
      {id:'a2', n:2, t:'radio', q:'Как изменился ваш вес за последние 12 месяцев?', opts:['Снизился более чем на 5 кг','Снизился на 1–5 кг','Стабильный','Вырос на 1–5 кг','Вырос более чем на 5 кг']},
      {id:'a3', n:3, t:'textarea', q:'Какова ваша основная цель при работе со специалистом Vía-L?'},
      {id:'a4', n:4, t:'textarea', q:'Какие три показателя качества жизни вам наиболее важно улучшить?'},
      {id:'a5', n:5, t:'textarea', q:'Были ли попытки изменить питание или образ жизни ранее? Что сработало / не сработало?'},
    ]},
    {sub:'A2. Анамнез здоровья', fields:[
      {id:'a6', n:6, t:'textarea', q:'Перечислите все подтверждённые диагнозы и хронические заболевания'},
      {id:'a7', n:7, t:'textarea', q:'Текущие лекарственные препараты (название, доза, длительность)'},
      {id:'a8', n:8, t:'textarea', q:'Принимаемые БАД, витамины, спортивное питание'},
      {id:'a9', n:9, t:'textarea', q:'Аллергии или непереносимость (пищевые, лекарственные)'},
      {id:'a10', n:10, t:'textarea', q:'Операции или госпитализации за последние 5 лет (год и причина)'},
      {id:'a11', n:11, t:'check', q:'Семейный анамнез: заболевания у близких родственников', opts:['Сердечно-сосудистые заболевания','Сахарный диабет 2 типа','Онкологические заболевания','Остеопороз','Аутоиммунные заболевания','Деменция / Альцгеймер','Щитовидная железа','Ожирение']},
      {id:'a12', n:12, t:'radio', q:'Проходили ли комплексные лабораторные обследования за 12 месяцев?', opts:YNU},
      {id:'a12b', n:'', t:'textarea', q:'Если да — дата и основные результаты (или приложите копию)'},
    ]},
  ]},

  { id:'B', title:'Питание и метаболизм', chip:'B', groups:[
    {sub:'B1. Пищевые привычки', fields:[
      {id:'b13', n:13, t:'radio', q:'Сколько раз в день вы едите (включая перекусы)?', opts:['1–2 раза','3 раза','4–5 раз','6 и более']},
      {id:'b14', n:14, t:'textarea', q:'Опишите типичный день питания (завтрак, обед, ужин, перекусы)'},
      {id:'b15', n:15, t:'check', q:'Есть ли в рационе намеренные ограничения?', opts:['Вегетарианство','Веганство','Безглютеновое','Безлактозное','Низкоуглеводное / кето','Интервальное голодание','Халяль / Кошер','Нет']},
      {id:'b16', n:16, t:'check', q:'Как часто вы употребляете следующие продукты?', opts:['Красное мясо (>3 р/нед)','Рыба и морепродукты (>2 р/нед)','Молочные продукты ежедневно','Яйца ежедневно','Ультрапереработанные продукты (>3 р/нед)','Сладкое / кондитерское ежедневно','Алкоголь (>3 р/нед)','Овощи/зелень каждый приём пищи']},
      {id:'b17', n:17, t:'radio', q:'Сколько чистой воды вы выпиваете в день?', opts:['Менее 1 л','1–1,5 л','1,5–2 л','Более 2 л']},
      {id:'b18', n:18, t:'radio', q:'Отмечаете ли переедание, бесконтрольное поедание, эмоциональный аппетит?', opts:YNU},
      {id:'b19', n:19, t:'radio', q:'Как изменился аппетит за последние 6–12 месяцев?', opts:['Увеличился','Снизился','Не изменился','Нестабильный / скачки']},
      {id:'b20', n:20, t:'textarea', q:'Есть ли тяга к определённым продуктам (сладкое, солёное, жирное, кофеин)?'},
    ]},
    {sub:'B2. Метаболические маркеры (по анализам)', labhint:true, fields:[
      {id:'b21', n:21, t:'lab', q:'Углеводный обмен', fields:[{k:'glu',l:'Глюкоза натощак'},{k:'hba1c',l:'HbA1c'},{k:'ins',l:'Инсулин натощак'},{k:'homa',l:'HOMA-IR'}]},
      {id:'b22', n:22, t:'lab', q:'Липидный профиль', fields:[{k:'chol',l:'Общий холестерин'},{k:'ldl',l:'ЛПНП'},{k:'hdl',l:'ЛПВП'},{k:'tg',l:'Триглицериды'}]},
      {id:'b23', n:23, t:'check', q:'Есть ли признаки инсулинорезистентности?', opts:['Сложно похудеть даже при диете','Тёмные пятна в складках кожи','Сильная сонливость после еды','Постоянная тяга к сладкому','Нет признаков','Не знаю']},
    ]},
  ]},

  { id:'C', title:'Желудочно-кишечный тракт', chip:'C', groups:[
    {sub:'C1. Пищеварение и симптомы', fields:[
      {id:'c24', n:24, t:'scale', q:'Как вы оцениваете своё пищеварение в целом?', lo:'очень плохое', hi:'отличное'},
      {id:'c25', n:25, t:'check', q:'Отмечаете ли следующие симптомы?', opts:['Вздутие живота','Метеоризм (газообразование)','Изжога / рефлюкс','Тошнота','Боли / спазмы в животе','Диарея','Запоры','Чередование диареи и запоров']},
      {id:'c26', n:26, t:'radio', q:'Как часто у вас стул?', opts:['1–3 раза/день','1 раз в день','1 раз в 2–3 дня','Реже 1 раза в 3 дня']},
      {id:'c27', n:27, t:'radio', q:'Характер стула по Бристольской шкале?', opts:['Тип 1–2 (твёрдый, «овечий»)','Тип 3–4 (норма)','Тип 5–6 (мягкий)','Тип 7 (водянистый)']},
      {id:'c28', n:28, t:'radio', q:'Есть ли непереваренная пища в стуле, слизь или кровь?', opts:YNU},
      {id:'c29', n:29, t:'textarea', q:'Диагнозы: СРК, ГЭРБ, гастрит, язва, болезнь Крона, целиакия, дисбактериоз?'},
      {id:'c30', n:30, t:'radio', q:'Принимали ли антибиотики за последние 12 месяцев?', opts:YNU},
    ]},
    {sub:'C2. Связь с питанием и образом жизни', fields:[
      {id:'c31', n:31, t:'textarea', q:'Ухудшение пищеварения после определённых продуктов? Каких?'},
      {id:'c32', n:32, t:'radio', q:'Влияет ли стресс на работу кишечника?', opts:YNU},
      {id:'c33', n:33, t:'radio', q:'Употребляете ли ферментированные продукты (кефир, йогурт, квашеная капуста, кимчи)?', opts:['Ежедневно','3–4 раза/нед','Редко','Никогда']},
      {id:'c34', n:34, t:'textarea', q:'Принимаете/принимали пробиотики? Препарат и длительность'},
    ]},
  ]},

  { id:'D', title:'Энергия, сон и стресс-реакция', chip:'D', groups:[
    {sub:'D1. Уровень энергии', fields:[
      {id:'d35', n:35, t:'scale', q:'Средний уровень энергии в течение дня', lo:'полное истощение', hi:'высокая энергия'},
      {id:'d36', n:36, t:'check', q:'В какое время суток энергия наиболее низкая?', opts:['Утром при пробуждении','В первой половине дня','После обеда (13–15 ч)','Вечером','Равномерно низкий']},
      {id:'d37', n:37, t:'radio', q:'Хроническая усталость, не проходящая после отдыха?', opts:YNU},
      {id:'d38', n:38, t:'radio', q:'Упадок сил после еды?', opts:YNU},
    ]},
    {sub:'D2. Сон', fields:[
      {id:'d39', n:39, t:'radio', q:'Сколько часов вы спите в среднем?', opts:['Менее 5 ч','5–6 ч','7–8 ч','Более 9 ч']},
      {id:'d40', n:40, t:'scale', q:'Как вы оцениваете качество сна?', lo:'очень плохое', hi:'отличное'},
      {id:'d41', n:41, t:'check', q:'Нарушения сна?', opts:['Трудности с засыпанием','Частые пробуждения ночью','Раннее пробуждение (не заснуть снова)','Поверхностный сон','Апноэ (или подозрение)','Ночная потливость','Нет нарушений','Дневная сонливость несмотря на сон']},
      {id:'d42', n:42, t:'radio', q:'Регулярно ли ложитесь и встаёте в одно время?', opts:YNU},
    ]},
    {sub:'D3. Стресс и психоэмоциональное состояние', fields:[
      {id:'d43', n:43, t:'scale', q:'Уровень хронического стресса в жизни', lo:'стресса нет', hi:'постоянный высокий'},
      {id:'d44', n:44, t:'check', q:'Как проявляется стресс в организме?', opts:['Учащённое сердцебиение','Мышечное напряжение / боли','Раздражительность','Тревога / панические атаки','Нарушения сна','Переедание или потеря аппетита','Желудочно-кишечные расстройства','Снижение либидо']},
      {id:'d45', n:45, t:'check', q:'Практикуете ли методы управления стрессом?', opts:['Медитация / дыхательные практики','Йога / растяжка','Прогулки на природе','Психотерапия','Нет','Другое']},
    ]},
  ]},

  { id:'E', title:'Физическая активность и мышечная функция', chip:'E', fields:[
    {id:'e46', n:46, t:'radio', q:'Какова ваша текущая физическая активность?', opts:['Сидячий образ жизни','Лёгкая активность (прогулки)','Умеренная (3–4 р/нед)','Высокая (5+ р/нед)','Профессиональный спорт']},
    {id:'e47', n:47, t:'check', q:'Какие виды тренировок вы выполняете?', opts:['Силовые тренировки','Кардио (бег, велосипед, плавание)','HIIT / интервальные','Йога / пилатес','Танцы / групповые классы','Не тренируюсь']},
    {id:'e48', n:48, t:'radio', q:'Снижение мышечной силы или выносливости за 1–2 года?', opts:YNU},
    {id:'e49', n:49, t:'textarea', q:'Боли в суставах, мышцах или ограничения подвижности?'},
    {id:'e50', n:50, t:'textarea', q:'Данные о составе тела (% жира, мышечная масса)?'},
  ]},

  { id:'F', title:'Кожа, волосы, ногти', chip:'F', subnote:'Маркеры нутриентного статуса', fields:[
    {id:'f51', n:51, t:'check', q:'Изменения кожи за последние 1–2 года?', opts:['Сухость / шелушение','Акне / высыпания','Снижение упругости / дряблость','Пигментация','Медленное заживление ран','Без изменений']},
    {id:'f52', n:52, t:'check', q:'Состояние волос', opts:['Выпадение усилилось','Истончение','Сухость / ломкость','Изменение текстуры','Без изменений']},
    {id:'f53', n:53, t:'check', q:'Состояние ногтей', opts:['Ломкие','Расслаиваются','Белые пятна','Медленный рост','Без изменений']},
  ]},

  { id:'G', title:'Щитовидная железа и надпочечники', chip:'G', labhint:true, fields:[

let LANG = 'en';
const tr = s => LANG==='ru' ? s : ((TR[LANG] && TR[LANG][s]) || (TR.en && TR.en[s]) || s);

function fieldHTML(f){
  const num = f.n ? `<b>${f.n}.</b>` : '';
  const hint = f.hint ? `<div class="hint">${esc(tr(f.hint))}</div>` : '';
  let body = '';
  if(f.t==='text'){
    let val='';
    if(f.id==='date'){ const d=new Date(),p=n=>String(n).padStart(2,'0'); val=` value="${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}" autocomplete="off"`; }
    body = `<input type="${f.input||'text'}" name="${f.id}"${f.ph?` placeholder="${esc(tr(f.ph))}"`:''}${val}>`;
  } else if(f.t==='textarea'){
    body = `<textarea name="${f.id}"></textarea>`;
  } else if(f.t==='radio' || f.t==='check'){
    const type = f.t==='radio' ? 'radio' : 'checkbox';
    const col = f.opts.length>4 || f.opts.some(o=>tr(o).length>22) ? ' col' : '';
    body = `<div class="opts${col}">` + f.opts.map((o,i)=>
      `<label class="opt"><input type="${type}" name="${f.id}" value="${esc(o)}"${f.control?` data-control="1"`:''}><span>${esc(tr(o))}</span></label>`
    ).join('') + `</div>`;
  } else if(f.t==='scale'){
    body = `<div class="scale">
      <div class="ends"><span>0 — ${esc(tr(f.lo))}</span><span>${esc(tr(f.hi))} — 10</span></div>
      <div class="row"><input type="range" min="0" max="10" value="5" name="${f.id}" oninput="this.closest('.scale').querySelector('.val').textContent=this.value"><div class="val">5</div></div>
    </div>`;
  } else if(f.t==='lab'){
    body = `<div class="lab">` + f.fields.map(li=>
      `<div class="li"><label>${esc(tr(li.l))}</label><input type="text" name="${f.id}.${li.k}"></div>`
    ).join('') + `</div>`;
  } else if(f.t==='dob'){
    const now=new Date().getFullYear(), yFrom=f.yFrom||now, yTo=f.yTo||(f.yearsBack!=null?now-f.yearsBack:1930);
    const MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const op=(v,t)=>`<option value="${v}">${esc(t)}</option>`;
    let dd=`<option value="">${esc(tr('День'))}</option>`; for(let d=1;d<=31;d++) dd+=op(d,d);
    let mm=`<option value="">${esc(tr('Месяц'))}</option>`; MON.forEach((m,i)=>mm+=op(i+1, f.numMonth?(i+1):tr(m)));
    let yy=`<option value="">${esc(tr('Год'))}</option>`; for(let y=yFrom;y>=yTo;y--) yy+=op(y,y);
    const sep = f.sep ? `<span class="dobsep">${esc(f.sep)}</span>` : '';
    body = `<div class="dob"><select name="${f.id}.d">${dd}</select>${sep}<select name="${f.id}.m">${mm}</select>${sep}<select name="${f.id}.y">${yy}</select></div>`;
  }
  return `<div class="q"><label class="qt">${num} ${esc(tr(f.q))}</label>${hint}${body}</div>`;
}

function sectionHTML(s){
  const chip = s.chip ? `<span class="chip">${s.chip}</span>` : '';
  const note = s.subnote ? `<div class="subnote">${esc(tr(s.subnote))}</div>` : '';
  const labnote = s.labhint ? `<div class="subnote">${esc(tr('По данным анализов — впишите значение или оставьте пустым, если не знаете.'))}</div>` : '';
  let inner = '';
  if(s.groups){
    inner = s.groups.map(g=>{
      const gnote = g.labhint ? `<div class="subnote">${esc(tr('По данным анализов — оставьте пустым, если не знаете.'))}</div>` : '';
      return `<div class="sub">${esc(tr(g.sub))}</div>${gnote}` + g.fields.map(fieldHTML).join('');
    }).join('');
  } else {
    inner = s.fields.map(fieldHTML).join('');
  }
  return `<section class="sec" data-sec="${s.id}"${s.sex?` data-sex="${s.sex}"`:''}>
    <h2>${chip}${esc(tr(s.title))}</h2>${note}${labnote}${inner}</section>`;
}

const CONSENT_KEY='Согласие на обработку данных (GDPR): подтверждаю достоверность сведений и даю согласие на их обработку специалистом Vía-L исключительно для нутрициологического консультирования.';
function build(){
  form.innerHTML = SCHEMA.map(sectionHTML).join('') + `
    <section class="sec">
      <label class="consent"><input type="checkbox" id="consent">
      <span>${esc(tr(CONSENT_KEY))}</span></label>
    </section>`;
  wire();
}

/* ── Ветвление по полу (пере-биндится при каждом build) ─────────────────── */
function applySex(){
  const sex = (form.querySelector('input[name="sex"]:checked')||{}).value;
  const secI=form.querySelector('[data-sex="f"]'), secJ=form.querySelector('[data-sex="m"]');
  secI.style.display = sex==='Женский' ? '' : 'none';
  secJ.style.display = sex==='Мужской' ? '' : 'none';
  updateProgress();
}
function wire(){
  form.querySelectorAll('input[name="sex"]').forEach(r=>r.addEventListener('change', applySex));
  const c=document.getElementById('consent'); if(c) c.addEventListener('change', updateProgress);
  applySex(); // прячет I/J пока пол не выбран и восстанавливает состояние
}

/* ── Прогресс + активация кнопки ────────────────────────────────────────── */
const pbar=document.getElementById('pbar'), pcount=document.getElementById('pcount'),
      ppct=document.getElementById('ppct'), btn=document.getElementById('btnSubmit');
function visibleFields(){
  // считаем «вопросы» как уникальные name без учёта lab-подполей и скрытых секций
  const seen=new Set(), list=[];
  form.querySelectorAll('section.sec').forEach(sec=>{
    if(sec.style.display==='none') return;
    sec.querySelectorAll('[name]').forEach(el=>{
      if(el.id==='consent') return;
      const base=el.name.split('.')[0];
      if(seen.has(base)) return; seen.add(base); list.push(base);
    });
  });
  return list;
}
function isFilled(base){
  const els=[...form.querySelectorAll(`[name="${base}"], [name^="${base}."]`)];
  return els.some(el=>{
    if(el.type==='checkbox'||el.type==='radio') return el.checked;
    if(el.type==='range') return false; // слайдер не считаем «обязательным»
    return el.value.trim()!=='';
  });
}
function updateProgress(){
  const all=visibleFields().filter(b=>{
    const el=form.querySelector(`[name="${b}"]`);
    return !(el && el.type==='range');
  });
  const done=all.filter(isFilled).length;
  const pct=all.length?Math.round(done/all.length*100):0;
  pbar.style.width=pct+'%'; pcount.textContent=`${done} ${tr('из')} ${all.length}`; ppct.textContent=pct+'%';
  const c=document.getElementById('consent');
  btn.disabled = !(c && c.checked);
}
form.addEventListener('input', updateProgress);
form.addEventListener('change', updateProgress);

/* ── Сбор данных (черновик: показываем структуру) ───────────────────────── */
function collect(){
  const out={};
  SCHEMA.forEach(s=>{
    const sec=form.querySelector(`[data-sec="${s.id}"]`);
    if(sec && sec.style.display==='none') return;
    const fields = s.groups ? s.groups.flatMap(g=>g.fields) : s.fields;
    fields.forEach(f=>{
      if(f.t==='lab'){
        const grp={};
        f.fields.forEach(li=>{ const v=form.querySelector(`[name="${f.id}.${li.k}"]`).value.trim(); if(v) grp[li.l]=v; });
        if(Object.keys(grp).length) out[f.id]={q:f.q, v:grp};
      } else if(f.t==='dob'){
        const g=k=>form.querySelector(`[name="${f.id}.${k}"]`).value;
        const d=g('d'), mo=g('m'), y=g('y');
        if(d&&mo&&y){ const p=n=>String(n).padStart(2,'0'); out[f.id]={q:f.q, v:`${y}-${p(mo)}-${p(d)}`}; }
      } else if(f.t==='check'){
        const v=[...form.querySelectorAll(`[name="${f.id}"]:checked`)].map(e=>e.value);
        if(v.length) out[f.id]={q:f.q, v};
      } else if(f.t==='radio'){
        const e=form.querySelector(`[name="${f.id}"]:checked`);
        if(e) out[f.id]={q:f.q, v:e.value};
      } else if(f.t==='scale'){
        out[f.id]={q:f.q, v:Number(form.querySelector(`[name="${f.id}"]`).value)};
      } else {
        const v=form.querySelector(`[name="${f.id}"]`).value.trim();
        if(v) out[f.id]={q:f.q, v};
      }
    });
  });
  return out;
}
/* ── Отправка: ?topic= → POST в воркер; без topic — debug-превью структуры ── */
const ENDPOINT='https://interpreter.viaelcom.workers.dev/anketa-submit';
const _Q=new URLSearchParams(location.search);
const TOPIC=_Q.get('topic')||'';
const INTAKE=_Q.get('intake')||'';   // программный токен (анкета после оплаты программы)
const SRC=_Q.get('src')||'';         // источник, напр. elite (письмо из Cal)
const CODE=_Q.get('code')||'';       // код доступа — связка анкеты и переписки в один топик
const SEND=!!(TOPIC||INTAKE||SRC||CODE); // слать на сервер при любом маршрут-параметре; голый URL — превью
async function submitAnketa(){
  const data=collect();
  const pre=document.getElementById('preview');
  if(!SEND){ // прямое открытие / dev — показываем структуру, ничего не шлём
    pre.hidden=false; pre.style.background='';
    pre.textContent=tr('СТРУКТУРА ДЛЯ НУТРИЦИОЛОГА (черновик, на сервер пока не уходит):')+'\n\n'+JSON.stringify(data,null,2);
    pre.scrollIntoView({behavior:'smooth'}); return;
  }
  btn.disabled=true; const prev=btn.textContent; btn.textContent=tr('Отправляем…');
  try{
    const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topic:TOPIC, intake:INTAKE, src:SRC, code:CODE, lang:LANG, answers:data, ts:Date.now()})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    form.style.display='none'; document.querySelector('.actions').style.display='none';
    pre.hidden=false; pre.style.background='#143a2b';
    pre.textContent='✓ '+tr('Анкета отправлена — спасибо! Нутрициолог свяжется с вами.');
    pre.scrollIntoView({behavior:'smooth'});
  }catch(e){
    btn.disabled=false; btn.textContent=prev;
    pre.hidden=false; pre.style.background='#5a1f1f';
    pre.textContent='⚠ '+tr('Не удалось отправить. Проверьте связь и попробуйте ещё раз.');
  }
}
btn.addEventListener('click', submitAnketa);

/* ── Статика интерфейса (перерисовывается при смене языка) ──────────────── */
const SUB_KEY='Гормональный статус · ЖКТ · Метаболизм · Нутриентный статус · Образ жизни. Отвечайте честно — пустые поля можно пропустить.';
const DRAFT_KEY='Черновой каркас · отправка пока показывает структуру (без сервера)';
function applyStatic(){
  document.getElementById('h1').textContent = tr('Анкета здоровья клиента');
  document.getElementById('sub').textContent = tr(SUB_KEY);
  btn.textContent = tr('Отправить анкету');
  const dn=document.querySelector('.draftnote'); if(dn){ if(SEND){ dn.style.display='none'; } else { dn.textContent = tr(DRAFT_KEY); } }
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG==='he'||LANG==='ar') ? 'rtl' : 'ltr';
}

/* ── Языки (порядок и метки как в ИП) ──────────────────────────────────── */
const LANGS=[['en','🇬🇧 English'],['es','🇪🇸 Español'],['uk','🇺🇦 Українська'],['ru','🇷🇺 Русский'],
  ['de','🇩🇪 Deutsch'],['pt','🇧🇷 Português'],['fr','🇫🇷 Français'],['pl','🇵🇱 Polski'],
  ['it','🇮🇹 Italiano'],['he','🇮🇱 עברית'],['ja','🇯🇵 日本語'],['ko','🇰🇷 한국어']];
const VALID=LANGS.map(x=>x[0]);
const langSel=document.getElementById('langSel');
LANGS.forEach(([c,n])=>{ const o=document.createElement('option'); o.value=c; o.textContent=n; langSel.appendChild(o); });
function setLang(l){
  LANG = VALID.includes(l) ? l : 'en';
  try{ localStorage.setItem('vial_anketa_lang', LANG); }catch(e){}
  langSel.value = LANG;
  applyStatic();
  build();
}
langSel.addEventListener('change', e=>setLang(e.target.value));

const urlLang=new URLSearchParams(location.search).get('lang');
let saved=null; try{ saved=localStorage.getItem('vial_anketa_lang'); }catch(e){}
setLang(VALID.includes(urlLang) ? urlLang : (VALID.includes(saved) ? saved : 'en'));
</script>
